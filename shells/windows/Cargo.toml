# The Windows shell. ADR-0018 §11.12's layout, and
# `docs/application-architecture.md` §7's Windows row: HC-1, `TwinVPNService`
# running as LocalSystem with trimmed privileges, a WFP sublayer carrying
# persistent and boot-time filters, a named pipe with an explicit DACL, and an
# MSI signed with an Authenticode EV certificate.
#
# CB-2: a shell holds NO decision. It may translate, marshal, schedule and
# render. With every shell deleted and a mock adapter bound, the core must still
# make every decision correctly (the falsification test). A branch here on a
# ConnectionState, a reason_code class, a policy verdict, a candidate priority,
# a timer expiry or a version comparison is a defect, not a shortcut.
#
# THIS WORKSPACE IS A SEPARATE ARTIFACT from /core, so that no domain silently
# acquires another's dependency graph. `shells/linux/Cargo.toml` is the model.
[workspace]
resolver = "2"
members = ["twinvpnsvc", "twinvpnctl"]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.90"
license      = "Apache-2.0"
repository   = "https://github.com/twinvpn/twinvpn"

[workspace.dependencies]
# The `version` next to every `path` is load-bearing: a versionless path
# dependency is a `*` requirement and build/deny.toml sets `wildcards = "deny"`
# for DP-1. See core/Cargo.toml for the full note.
twinvpn-core             = { version = "0.1.0", path = "../../core/crates/twinvpn-core" }
twinvpn-types            = { version = "0.1.0", path = "../../core/crates/twinvpn-types" }
twinvpn-env              = { version = "0.1.0", path = "../../core/crates/twinvpn-env" }
twinvpn-platform         = { version = "0.1.0", path = "../../core/crates/twinvpn-platform" }
twinvpn-platform-windows = { version = "0.1.0", path = "../../core/crates/twinvpn-platform-windows" }
twinvpn-enforce          = { version = "0.1.0", path = "../../core/crates/twinvpn-enforce" }
twinvpn-mgmt             = { version = "0.1.0", path = "../../core/crates/twinvpn-mgmt" }
twinvpn-diag             = { version = "0.1.0", path = "../../core/crates/twinvpn-diag" }

thiserror = "2.0"
anyhow    = "1.0"
clap      = { version = "4.5", features = ["derive"] }
tokio     = { version = "1.48", features = ["full"] }
tracing   = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde     = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Pinned to the same version `core/Cargo.toml` pins, so the shell and the
# adapter cannot disagree about a struct layout across the crate boundary.
windows-sys = "0.61"

[profile.release]
lto           = "fat"
codegen-units = 1
strip         = "symbols"
panic         = "unwind"
