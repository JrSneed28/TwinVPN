# twinvpnsvc — `TwinVPNService`, the privileged Windows authority: hosts the
# core, owns the Wintun adapter, the IP Helper route table, the WFP sublayer and
# the NRPT rules (ADR-0016 §11.2's Windows row).
#
# Owner: desktop-windows.
[package]
name    = "twinvpnsvc"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description = "TwinVPNService: the privileged Windows authority (ADR-0016)"
publish = false

# A library AND a binary, for one reason: ADR-0017 MI-20 and ADR-0018 §11.16 (b)
# require "one contract, two carriages, NEVER two contracts". The MI envelope,
# its framing and its client are therefore declared ONCE, here, and `twinvpnctl`
# consumes them with `default-features = false` — which excludes every service
# module, so the unprivileged CLI links no Wintun, no WFP, no IP Helper and no
# core-hosting code.
#
# The alternative — a copy of the framing in each binary — is exactly the second
# contract those rules forbid, and it would drift.
[lib]
name = "twinvpnsvc"
path = "src/lib.rs"

[[bin]]
name = "twinvpnsvc"
path = "src/main.rs"
required-features = ["core-host"]

[features]
default = ["service", "core-host"]

# The privileged half that talks to WINDOWS: the SCM, the trimmed privilege
# posture, the start sequence, the power events, the client-token check and the
# pipe's DACL. Off for `twinvpnctl`, which needs only `mi`.
#
# Deliberately does NOT pull `twinvpn-core`, and the split is a verification
# decision rather than a taste one. The core reaches `snow`, `snow` reaches
# `ring`, and `ring`'s build script refuses a GNU compiler for
# `x86_64-pc-windows-msvc` — so on a Linux host WITHOUT an MSVC-targeting C
# toolchain, anything that links the core cannot be type-checked for Windows at
# all. Splitting the feature means the whole Win32 surface still is:
#
#   cargo clippy -p twinvpnsvc --no-default-features --features service \
#       --all-targets --target x86_64-pc-windows-msvc -- -D warnings
#
# That command is the only compile proof this domain's `#[cfg(windows)]` service
# code has, and without the split there would be none. See
# `shells/windows/README.md` §7.19.
service = [
  "dep:twinvpn-platform",
  "dep:twinvpn-platform-windows",
  "dep:twinvpn-enforce",
  "dep:twinvpn-env",
  "dep:tracing-subscriber",
  "dep:clap",
]

# Hosting the core: `service::runtime`, `service::server` and the binary. On by
# default, so a real build is unchanged; separable, so the line above can run.
core-host = ["service", "dep:twinvpn-core"]

# **The disposable lab guest's seed. NEVER in `default`, and never shipped.**
#
# The kill-switch lane's guest has no control plane and no pairing ceremony, so
# the two facts `enforce::arm` needs and the key material `session.connect`
# needs have no source there. Under this feature — and only when
# `TWINVPN_LAB_SEED_FILE` names a file — `crate::lab_seed` supplies them through
# the core's own public API at every start.
#
# It turns on `twinvpn-crypto/test-support` because `VerifiedTunnelKey` has no
# public constructor by design (ADR-0007 N-4/N-5): the only way to hold one is to
# verify a signed `TunnelKeyBinding`, and `testkit::verified_tunnel_key` is the
# fixture that does the whole ceremony rather than short-circuiting it. That
# feature is one `core/README.md` §3 records as never shipping, which is exactly
# the claim this feature makes about itself — and the service says so at WARN on
# every start that seeds.
lab-seed = ["core-host", "dep:twinvpn-crypto", "twinvpn-crypto/test-support"]

[dependencies]
twinvpn-mgmt  = { workspace = true }
twinvpn-types = { workspace = true }
twinvpn-diag  = { workspace = true }
thiserror     = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }

twinvpn-core             = { workspace = true, optional = true }
twinvpn-platform         = { workspace = true, optional = true }
twinvpn-platform-windows = { workspace = true, optional = true }
# ADR-0011 §11.9's known-encrypted-resolver registry. The adapter takes the list
# injected (CD-2); this shell reads it from the one shared consumer.
twinvpn-enforce          = { workspace = true, optional = true }
twinvpn-env              = { workspace = true, optional = true }
# `lab-seed` only. See that feature.
twinvpn-crypto           = { workspace = true, optional = true }
tracing-subscriber       = { workspace = true, optional = true }
clap                     = { workspace = true, optional = true }

# The one place in this shell that names Windows. `shells/linux` carries
# `#![forbid(unsafe_code)]` because `tokio` gives it `UnixListener` and
# `peer_cred()`; there is no equivalent on this platform for SCM registration,
# a pipe DACL or `SERVICE_CONTROL_POWEREVENT`, so `src/win32/` is a shim with
# the same discipline the adapter uses — see this crate's `lib.rs`.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Services",          # the SCM: StartServiceCtrlDispatcherW, SERVICE_STATUS
  "Win32_System_Threading",         # OpenProcessToken, the service's own token
  "Win32_System_Power",             # PBT_APMSUSPEND / PBT_APMRESUMESUSPEND
  "Win32_System_RemoteDesktop",     # WTS session type, for PS-14's console-seat rule
  "Win32_System_Pipes",             # GetNamedPipeClientProcessId
  "Win32_Security",                 # the DACL, the SIDs, token queries
  "Win32_Security_Authorization",   # ConvertStringSecurityDescriptorToSecurityDescriptorW
  "Win32_Storage_FileSystem",       # the pipe handle's flags
  "Win32_System_Memory",            # LocalFree, for the converted descriptor
] }

[dev-dependencies]
twinvpn-platform = { workspace = true, features = ["mock"] }
