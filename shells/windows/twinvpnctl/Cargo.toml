# twinvpnctl — the unprivileged Windows CLI over the local management interface
# (ADR-0017, ADR-0023).
#
# Owner: desktop-windows.
#
# THE CARGO TARGET IS `twinvpnctl`; THE INSTALLED COMMAND IS `twinvpn.exe`.
#
# ADR-0016 §11.2's Windows process table names this binary `twinvpn.exe`,
# ADR-0017 §11.12's command shape is `twinvpn <noun> <verb>`, and ADR-0023
# EM-42's rendered `next_action` strings say "run 'twinvpn peer disconnect
# nas-attic'". `ownership.md` §9.5 D-1 closes W-41: the cargo target and this
# `[package] name` stay `twinvpnctl` — renaming them churns three shells for
# nothing a user sees — and `packaging/TwinVPN.wxs` installs the artifact as
# `twinvpn.exe` with a `twinvpnctl.exe` duplicate beside it as a compatibility
# alias. The same split holds on Linux and macOS, so one CLI has one installed
# name on all three.
[package]
name    = "twinvpnctl"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description = "the unprivileged Windows CLI over the local management interface (ADR-0017, ADR-0023)"
publish = false

[dependencies]
# The MI contract, from the ONE place it is declared (MI-20). `default-features
# = false` excludes the whole `service` feature, so this unprivileged binary
# links no Wintun, no WFP, no IP Helper and no core-hosting code.
twinvpnsvc    = { path = "../twinvpnsvc", default-features = false }
twinvpn-mgmt  = { workspace = true }
twinvpn-types = { workspace = true }
twinvpn-diag  = { workspace = true }
thiserror     = { workspace = true }
tokio         = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
