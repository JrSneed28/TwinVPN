# Version catalogue.
#
# Every version is pinned. Where a version is also pinned by
# `build/toolchain/env.sh`, the value here MUST match it and the comment says
# which line — `build/` is the `infrastructure` domain's and this file is
# `mobile-android`'s, so the two can only be kept in step by naming the link.
#
#   TWINVPN_KOTLIN_VERSION        = 2.0.21   (env.sh:11)
#   TWINVPN_JDK_VERSION           = 21.0.5   (env.sh:10)
#   TWINVPN_PROTOBUF_JAVA_VERSION = 4.33.1   (env.sh:51)
#
# `protobuf-javalite` is deliberately NOT used: `contracts/gen/kotlin` is
# generated against the full runtime and `make verify-bindings` compiles it
# against that runtime, so swapping to lite here would make the committed
# bindings and the shipped app disagree about a runtime CI has already verified.

[versions]
kotlin          = "2.0.21"
agp             = "8.7.3"
composeBom      = "2024.12.01"
lifecycle       = "2.8.7"
activityCompose = "1.9.3"
coreKtx         = "1.15.0"
protobufJava    = "4.33.1"
cameraX         = "1.4.1"
mlkitBarcode    = "17.3.0"
zxingCore       = "3.5.3"
androidxTest    = "1.6.2"   # androidx.test:runner ONLY -- see the note below
androidxJunit   = "1.2.1"
uiAutomator     = "2.3.0"

[libraries]
compose-bom        = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui         = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3  = { module = "androidx.compose.material3:material3" }
activity-compose   = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
core-ktx           = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
lifecycle-runtime  = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-compose  = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-process  = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
protobuf-java      = { module = "com.google.protobuf:protobuf-java", version.ref = "protobufJava" }
protobuf-kotlin    = { module = "com.google.protobuf:protobuf-kotlin", version.ref = "protobufJava" }
camera-core        = { module = "androidx.camera:camera-core", version.ref = "cameraX" }
camera-camera2     = { module = "androidx.camera:camera-camera2", version.ref = "cameraX" }
camera-lifecycle   = { module = "androidx.camera:camera-lifecycle", version.ref = "cameraX" }
camera-view        = { module = "androidx.camera:camera-view", version.ref = "cameraX" }
mlkit-barcode      = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkitBarcode" }
zxing-core         = { module = "com.google.zxing:core", version.ref = "zxingCore" }

# `androidx.test:runner` and `androidx.test:rules` are published SEPARATELY and
# their version lines DIVERGED: runner reached 1.6.2, rules stopped at 1.6.1 and
# ships 1.7.0 next -- there has never been a `rules:1.6.2`. One `androidxTest`
# ref covering both is what put that non-existent coordinate on
# `:app:debugAndroidTestRuntimeClasspath` and failed run 33288074040 at
# `:app:processDebugAndroidTestManifest`, which is the first task in the
# androidTest chain that resolves that configuration -- so the manifest merger
# was never the problem and nothing in it was ever wrong.
#
# `rules` is now not declared at all, rather than pinned to 1.6.1, because
# nothing under `src/androidTest/` imports it: all four suites use
# `AndroidJUnit4`, `InstrumentationRegistry` and `UiDevice`, and none takes a
# `@Rule` from that artifact. A suite that later wants `ServiceTestRule` or
# `GrantPermissionRule` must add it back with a version line OF ITS OWN.
test-runner      = { module = "androidx.test:runner", version.ref = "androidxTest" }
test-junit       = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiAutomator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
