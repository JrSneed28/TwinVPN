# twinvpnctl — the unprivileged macOS CLI over the local management interface
# (ADR-0017, ADR-0023).
#
# Owner: desktop-macos.
#
# THE CARGO TARGET IS `twinvpnctl`; THE INSTALLED COMMAND IS `twinvpn`.
#
# ADR-0016 §11.2's process table and ADR-0017 §11.12's command shape both name
# this binary `twinvpn`, and ADR-0023 EM-42's rendered `next_action` strings say
# "run 'twinvpn peer disconnect nas-attic'". `ownership.md` §9.5 D-1 closes W-41:
# the cargo target and this `[package] name` stay `twinvpnctl` — renaming them
# churns three shells for nothing a user sees — and `packaging/install.sh`
# installs the artifact as `/usr/local/bin/twinvpn` with a `twinvpnctl` symlink
# beside it as a compatibility alias. The same split holds on Linux and Windows,
# so one CLI has one installed name on all three.
[package]
name    = "twinvpnctl"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description = "the unprivileged macOS CLI over the local management interface (ADR-0017, ADR-0023)"
publish = false

[dependencies]
# The MI contract, from the ONE place it is declared (MI-20).
#
# Before X-7 this was `twinvpnd` with `default-features = false`, which excluded
# the daemon's whole `agent` feature. There is no daemon now: PS-22 moved the
# authority into the NE system extension, so the shared half is its own crate
# and the exclusion is STRUCTURAL rather than a feature flag. `twinvpn-mi` links
# no core, no platform adapter and no `pf`, so this binary is unprivileged by
# its dependency graph and not merely by how it is run.
twinvpn-mi    = { version = "0.1.0", path = "../twinvpn-mi" }
twinvpn-mgmt  = { workspace = true }
twinvpn-types = { workspace = true }
tokio         = { workspace = true }
serde_json    = { workspace = true }
