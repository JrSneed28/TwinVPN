# twinvpnd — the minimal privileged macOS `LaunchDaemon`: hosts the core, owns
# the pf anchor, the route programme, the resolver and the MI endpoint (ADR-0016).
#
# Owner: desktop-macos.
[package]
name    = "twinvpnd"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description = "the privileged macOS LaunchDaemon: hosts the core, owns the pf anchor, the routes, the resolver and the MI endpoint (ADR-0016)"
publish = false

# A library AND a binary, for one reason: ADR-0017 MI-20 and ADR-0018 §11.16 (b)
# require "one contract, two carriages, NEVER two contracts". The MI envelope,
# its framing and its client are declared ONCE, here, and `twinvpnctl` consumes
# them with `default-features = false` — which excludes every agent module, so
# the unprivileged CLI links no pf, no route programme and no core-hosting code.
[lib]
name = "twinvpnd"
path = "src/lib.rs"

[[bin]]
name = "twinvpnd"
path = "src/main.rs"
required-features = ["agent"]

[features]
default = ["agent"]

# The privileged half: the start sequence, the peer credential, the endpoint, the
# MI server. Off for `twinvpnctl`, which needs only `mi`.
agent = [
    "dep:twinvpn-platform",
    "dep:twinvpn-platform-macos",
    "dep:twinvpn-env",
    "dep:libc",
    "dep:tracing-subscriber",
]

# Hosting the core in this process.
#
# **NOT DEFAULT, and the reason is a toolchain limit rather than a design one.**
# `twinvpn-core` pulls `twinvpn-crypto` -> `snow` -> `ring`, whose C sources are
# compiled by a build script. There is no Darwin C toolchain on the Linux CI host,
# so `cargo clippy --target aarch64-apple-darwin` on this workspace fails inside
# `ring`'s build script before it type-checks a line of ours -- which would make
# `make cross-check` red for a reason that has nothing to do with this shell.
#
# So the core edge is a TRAIT (`agent::server::CommandSink`, which is PS-4's typed
# vocabulary anyway), everything above it is default-on and cross-checked, and
# only the ~30 lines in `main.rs` that CONSTRUCT a `twinvpn_core::Core` are behind
# this feature. A macOS build enables it; `cargo test --workspace --all-features`
# on Linux exercises it.
#
# Reported to the integration lead as a request: if `twinvpn-crypto` selected
# `snow`'s pure-Rust resolver instead of `ring-accelerated`, this feature could be
# default and the whole shell would be cross-checked. `core/Cargo.toml` and
# `twinvpn-crypto` are `core-foundation`'s, so this domain does not make that
# change.
core-host = ["agent", "dep:twinvpn-core", "dep:twinvpn-diag"]

[dependencies]
twinvpn-mgmt  = { workspace = true }
twinvpn-types = { workspace = true }
thiserror     = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }

twinvpn-core           = { workspace = true, optional = true }
twinvpn-diag           = { workspace = true, optional = true }
twinvpn-platform       = { workspace = true, optional = true }
twinvpn-platform-macos = { workspace = true, optional = true }
twinvpn-env            = { workspace = true, optional = true }
libc                   = { workspace = true, optional = true }
tracing-subscriber     = { workspace = true, optional = true }
