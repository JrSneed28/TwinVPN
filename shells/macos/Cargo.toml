# The macOS shell. ADR-0018 §11.12's layout, and `docs/application-architecture.md`
# §7's macOS row: HC-1, "NE **system extension** + minimal `LaunchDaemon`",
# "pf anchor from /etc/pf.conf, daemon-applied", "Unix socket / XPC",
# "Developer ID + notarized, stapled".
#
# CB-2: a shell holds NO decision. It may translate, marshal, schedule and
# render. With every shell deleted and a mock adapter bound, the core must still
# make every decision correctly (the falsification test). A branch here on a
# ConnectionState, a reason_code class, a policy verdict, a candidate priority,
# a timer expiry or a version comparison is a defect, not a shortcut.
#
# Owner: desktop-macos. `shells/linux/Cargo.toml` says of itself "THIS MANIFEST
# IS OWNED BY THE INTEGRATION LEAD"; this one is not, because `ownership.md` §2
# gives `shells/macos/**` to this domain in full. If that is wrong, it is the
# integration lead's to move -- reported rather than assumed.
#
# NOTHING HERE HAS EVER BEEN LINKED. `make cross-check` type-checks the whole
# workspace for aarch64-apple-darwin with `-D warnings`, which is a COMPILE proof
# and never a behaviour proof. `cargo test` on the Linux host runs whatever is
# target-free, which is most of `mi` and all of `twinvpn-bridge`.
[workspace]
resolver = "2"
members = ["twinvpnd", "twinvpnctl", "twinvpn-bridge"]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.90"
license      = "Apache-2.0"
repository   = "https://github.com/twinvpn/twinvpn"

[workspace.dependencies]
twinvpn-core           = { path = "../../core/crates/twinvpn-core" }
twinvpn-types          = { path = "../../core/crates/twinvpn-types" }
twinvpn-env            = { path = "../../core/crates/twinvpn-env" }
twinvpn-platform       = { path = "../../core/crates/twinvpn-platform" }
twinvpn-platform-macos = { path = "../../core/crates/twinvpn-platform-macos" }
twinvpn-mgmt           = { path = "../../core/crates/twinvpn-mgmt" }
twinvpn-diag           = { path = "../../core/crates/twinvpn-diag" }

thiserror = "2.0"
anyhow    = "1.0"
clap      = { version = "4.5", features = ["derive"] }
tokio     = { version = "1.48", features = ["full"] }
tracing   = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
libc      = "0.2"
serde     = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto           = "fat"
codegen-units = 1
strip         = "symbols"
# F-7: `catch_unwind` at the FFI boundary is what stops a Rust panic unwinding
# into Swift, and it only works if the profile unwinds. `panic = "abort"` here
# would turn a contained, reportable defect into a process kill that takes the
# tunnel down with it.
panic         = "unwind"
