# twinvpnctl — the unprivileged Linux CLI over the local management interface (ADR-0017, ADR-0023)
#
# Owner: desktop-linux.
#
# THE CARGO TARGET IS `twinvpnctl`; THE INSTALLED COMMAND IS `twinvpn`.
#
# ADR-0016 §11.2's process table and ADR-0017 §11.12's command shape both name
# this binary `twinvpn`, and ADR-0023 EM-42's rendered `next_action` strings say
# "run 'twinvpn peer disconnect nas-attic'". `ownership.md` §9.5 D-1 closes W-41:
# the cargo target and this `[package] name` stay `twinvpnctl` — renaming them
# churns three shells for nothing a user sees — and the package installs the
# artifact as `/usr/bin/twinvpn` with a `twinvpnctl` symlink beside it as a
# compatibility alias. Do not rename this package to match the installed name;
# `shells/linux/README.md` §3 carries the install lines that create both.
[package]
name    = "twinvpnctl"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description = "the unprivileged Linux CLI over the local management interface (ADR-0017, ADR-0023)"
publish = false

[dependencies]
# The MI contract, from the ONE place it is declared (MI-20). `default-features
# = false` excludes the whole `agent` feature, so this unprivileged binary links
# no tun, no nftables, no netlink and no core-hosting code.
twinvpnd      = { version = "0.1.0", path = "../twinvpnd", default-features = false }
twinvpn-mgmt  = { workspace = true }
twinvpn-types = { workspace = true }
twinvpn-diag  = { workspace = true }
thiserror     = { workspace = true }
tokio         = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
