# XcodeGen spec for `shells/ios` — ADR-0018 §11.12's "Swift package + Xcode
# project (app + NE extension)".
#
# ===========================================================================
# WHY A SPEC AND NOT A COMMITTED .xcodeproj
# ===========================================================================
#
# A `.xcodeproj` is a `project.pbxproj` full of generated 96-bit identifiers. On
# a host with no Xcode it cannot be generated, cannot be opened, and cannot be
# validated — so a hand-written one would be several hundred lines of unverifiable
# identifiers presented as a build system. This file is the same information in a
# form a reviewer can read and a machine can check, and `xcodegen generate`
# produces the project from it on a Darwin builder.
#
# `shells/ios/README.md` documents the one command.
#
# STATUS: written, not compiled. No Xcode, no Darwin SDK, no XcodeGen on the
# build host (ownership.md §10.3).

name: TwinVPN
options:
  bundleIdPrefix: net.twinvpn
  # ADR-0018 §11.9 row 1 and docs/networking.md §5.2's iOS row both fix the
  # minimum at iOS 15. ADR-0019's iOS row says the same for the UI tier.
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # `-ObjC` forces the linker to load EVERY member of a static archive that
    # defines an Objective-C class or category, so that categories — which
    # define no linker-visible symbol of their own — are not dropped.
    #
    # THE COMMENT THAT USED TO BE HERE WAS WRONG, and wrong in a way worth
    # naming: it claimed the flag related to `panic = "unwind"` and F-7's
    # `catch_unwind`. It does not. A Rust staticlib defines no Objective-C class
    # and no category, so `-ObjC` is a NO-OP over `libtwinvpn_core*.a`, and
    # unwinding is configured in `ADR-0018 §11.3`'s Cargo profile and nowhere
    # near a linker flag.
    #
    # The flag is kept because it is the correct default for a target that links
    # any Objective-C archive, and because removing a no-op is not worth a build
    # change. The false rationale is what had to go — someone reading it would
    # either delete a flag on a bad argument or believe unwinding is set up here,
    # and F-7's containment is not something to be wrong about.
    OTHER_LDFLAGS: "-ObjC"

targets:
  # -------------------------------------------------------------------------
  # The app. UI lives here and ONLY here (ADR-0019's iOS row, C-7).
  # -------------------------------------------------------------------------
  TwinVPN:
    type: application
    platform: iOS
    sources:
      - path: Sources/TwinVPNApp
        # The string catalogue is listed BELOW with an explicit build phase, so
        # it is excluded here — one file reference, one build file, no chance of
        # it being carried twice. XcodeGen would default an unrecognised
        # extension to the resources phase anyway, but a chrome catalogue that
        # ships or does not ship by default is not a thing to leave implicit.
        excludes:
          - "Resources/Localizable.xcstrings"
      # ADR-0019's iOS row puts platform chrome in the native view layer, and
      # this is that layer's string table — the direct counterpart of Android's
      # `res/values/strings.xml`. `xcstringstool` compiles it to
      # `en.lproj/Localizable.strings` inside the signed `.app`, which is what
      # `String(localized:)` in the view files reads.
      - path: Sources/TwinVPNApp/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Sources/TwinVPNBridge
      # `EnforcementProgramme`, and it is listed by BOTH production targets on
      # purpose. Only the app can present the system consent sheet
      # (`NEVPNManager.saveToPreferences`, ADR-0019 §11.10 (a)), so the app is
      # what reads `includeAllNetworks` / `excludeLocalNetworks` /
      # `makeOnDemandRules()` off a decoded programme; only the extension holds
      # the bytes Rust rendered and writes them under `configurationKey` for
      # W-24's read-back. ONE declaration compiled into two targets, because two
      # declarations of that key and those `CodingKeys` are two things that can
      # drift, and the drift reads as an enforcement posture the app installed
      # and the extension cannot find.
      - path: Sources/TwinVPNShared
    dependencies:
      - target: TwinVPNProvider
        embed: true
    settings:
      base:
        INFOPLIST_FILE: Resources/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/TwinVPN.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: net.twinvpn.client
        # The Swift MODULE name, which is not the target name and not the product
        # name. `TwinVPNTests` says `@testable import TwinVPNApp`, and
        # `Package.swift` names the same sources `TwinVPNApp`; without this the
        # XcodeGen target name `TwinVPN` would be the module and every test file
        # would fail at its import line, before a single assertion ran. Setting
        # the module name is the smaller correction than renaming the target or
        # editing both build systems' idea of what the sources are called.
        PRODUCT_MODULE_NAME: TwinVPNApp
        # `core-lite` — ADR-0018 §11.12's feature profile: twinvpn-schema,
        # twinvpn-crypto (VERIFICATION ONLY), twinvpn-store, twinvpn-trust and
        # twinvpn-diag, and NO data-plane crate. Built by `Scripts/build-core.sh`.
        #
        # A LIBRARY SEARCH PATH AND `-l`, NOT A `framework:` DEPENDENCY, because
        # the device and the simulator need DIFFERENT archives and a single
        # committed path can only name one of them. `$(PLATFORM_NAME)` is
        # `iphoneos` or `iphonesimulator`, which is exactly how
        # `Scripts/build-core.sh` keys its output directory — so one project
        # builds for both and neither can silently link the other's slice.
        LIBRARY_SEARCH_PATHS: $(inherited) $(SRCROOT)/Frameworks/$(PLATFORM_NAME)
        OTHER_LDFLAGS: $(inherited) -ltwinvpn_core_lite
        # The module map over the staged `twinvpn.h` and the committed internal
        # bridge header. `Scripts/stage-headers.sh` puts `twinvpn.h` there.
        SWIFT_INCLUDE_PATHS: $(inherited) $(SRCROOT)/Sources/TwinVPNBridge/include
        # ADR-0020 §11.9's iPadOS note: "The store MUST NOT be placed anywhere
        # reachable by the Files app: `UIFileSharingEnabled` and
        # `LSSupportsOpeningDocumentsInPlace` MUST be false, or the store MUST
        # NOT be in `Documents/`." Both are set false AND the store lives in the
        # App Group container, so the rule holds twice over.
        INFOPLIST_KEY_UIFileSharingEnabled: NO
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: NO
        # iPadOS is "not iOS scaled up" (ADR-0019 §11.8) but it IS the same
        # binary, with a distinct adaptive layout. Not a Catalyst app.
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

  # -------------------------------------------------------------------------
  # The NetworkExtension. The OS starts it (CB-1 (b)); it holds NO UI (C-7).
  # -------------------------------------------------------------------------
  TwinVPNProvider:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/TwinVPNProvider
      - path: Sources/TwinVPNBridge
      # The other half of the pair — see the app target above.
      - path: Sources/TwinVPNShared
    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
      - sdk: Network.framework
      # `SecureEnclave.isAvailable` — §11.16 (l)'s truthful `hardware_backed`
      # — is CryptoKit's, not Security's. Swift autolinks an imported
      # framework, so this line is belt-and-braces; it is written out for the
      # reason the macOS spec gives for the same list, "so a link failure says
      # which framework is missing instead of listing symbols".
      - sdk: CryptoKit.framework
    settings:
      base:
        INFOPLIST_FILE: Resources/Provider-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/TwinVPNProvider.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: net.twinvpn.client.provider
        # The FULL core, as a staticlib. ADR-0018 §11.9 row 1: "<= 12 MB on disk;
        # core RSS <= 9 MB inside ADR-0022's 12 MB provider budget (PB-6)".
        # `Scripts/check-budget.sh` is what makes that a gate rather than a hope.
        # Per-platform search path — see the app target for why.
        LIBRARY_SEARCH_PATHS: $(inherited) $(SRCROOT)/Frameworks/$(PLATFORM_NAME)
        OTHER_LDFLAGS: $(inherited) -ltwinvpn_core
        SWIFT_INCLUDE_PATHS: $(inherited) $(SRCROOT)/Sources/TwinVPNBridge/include

  # -------------------------------------------------------------------------
  # The device-bound suite. WRITTEN, NOT EXECUTED — see the headers in
  # TwinVPNTests/. A green build of this target proves nothing about them, and
  # every case in it skips itself on the simulator.
  # -------------------------------------------------------------------------
  TwinVPNTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TwinVPNTests
    dependencies:
      - target: TwinVPN

  # -------------------------------------------------------------------------
  # The HOSTED-SIMULATOR acceptance suite. Two rows, two evidence files:
  # `IOS-FAILCLOSED-CONFIGURATION` and `IOS-PROFILE-REMOVAL-HONESTY`.
  #
  # STANDALONE, for the same reason `TwinVPNIntegrationTests` is — and it
  # compiles the app sources it needs rather than hosting the app, because the
  # types it asserts about (`VPNPermission`, `StatusRecord`,
  # `EnforcementProgramme`) and the extension's enforcement half
  # (`EnforcementInstaller`) have to be visible in ONE module for the two halves
  # to be compared. It links `core-lite`, the same profile the app does, because
  # `ManagementClient` reaches `CoreLite` and `CoreLite` crosses `twinvpn.h`.
  #
  # WHAT IT DOES NOT COMPILE: `TwinVPNApp.swift` (its `@main` belongs to an
  # application, not a bundle), `Views/` (SwiftUI presentation, which no
  # assertion here reaches) and `Resources/` (the app's string catalogue, which
  # the app target ships with an explicit build phase).
  #
  # IT IS NOT A DEVICE ROW AND CANNOT BECOME ONE. No NetworkExtension provider
  # runs in the simulator — it uses the macOS kernel for networking — so nothing
  # here activates a tunnel, observes egress, or exercises OS enforcement. The
  # evidence it writes says so in `environment`, and `report.py`'s prerequisites
  # are what make a simulator file unusable as device evidence.
  # -------------------------------------------------------------------------
  TwinVPNAcceptanceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TwinVPNAcceptanceTests
      - path: Sources/TwinVPNApp
        excludes:
          - "TwinVPNApp.swift"
          - "Views"
          - "Resources"
      - path: Sources/TwinVPNBridge
      - path: Sources/TwinVPNShared
      # The extension's half of the enforcement write, and ONLY that file. The
      # rest of `Sources/TwinVPNProvider` needs a live `NEPacketTunnelProvider`
      # and the FULL core, which is why the half that needs neither was split
      # out of `BridgeHost` in the first place.
      - path: Sources/TwinVPNProvider/EnforcementInstaller.swift
      # The one predicate that separates the two lanes, shared with
      # `TwinVPNTests` so a simulator row and a device row cannot disagree about
      # which machine they ran on.
      - path: TwinVPNTests/DeviceCapabilities.swift
      # ONE file out of the excluded `Views/`, for the same reason
      # `EnforcementInstaller.swift` is named above: `StateVisual.resolve` is not
      # presentation. DESIGN.md D2 makes it the palette expression of O-18 — "an
      # unrenewed assertion rounds to `UNKNOWN`, never `PROTECTED`" — so it is a
      # product-honesty rule that happens to live in the visual layer, and
      # `StateVisualHonestyTests` is the assertion that reaches it. Nothing else
      # in `Views/` is compiled here and nothing here renders.
      - path: Sources/TwinVPNApp/Views/DesignSystem.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.twinvpn.client.acceptancetests
        # This bundle is ad-hoc SIGNED (unlike TwinVPNIntegrationTests, which
        # sets CODE_SIGNING_ALLOWED: NO), and codesign refuses a bundle with no
        # Info.plist. Generate one rather than commit a second plist to drift.
        GENERATE_INFOPLIST_FILE: YES
        LIBRARY_SEARCH_PATHS: $(inherited) $(SRCROOT)/Frameworks/$(PLATFORM_NAME)
        OTHER_LDFLAGS: $(inherited) -ltwinvpn_core_lite
        SWIFT_INCLUDE_PATHS: $(inherited) $(SRCROOT)/Sources/TwinVPNBridge/include
        # NO `CODE_SIGNING_ALLOWED: NO` here, unlike `TwinVPNIntegrationTests`,
        # and the difference is deliberate. Entitlements are applied at the
        # CODE-SIGN step, so a build with signing off resolves no App Group
        # container — and `StatusRecord.read()` would then return nil
        # unconditionally, turning every "the shield is not green" assertion
        # into a pass about an input that was never there. `ci-ios.sh
        # --acceptance` ad-hoc signs (`CODE_SIGN_IDENTITY=-`,
        # `CODE_SIGNING_REQUIRED=YES`, `CODE_SIGNING_ALLOWED=YES`) rather than
        # switching signing off. The suite ALSO injects its own byte source, so
        # the vacuous pass is closed twice over; this setting is the half that
        # does not depend on undocumented simulator container behaviour.

  # -------------------------------------------------------------------------
  # The SIMULATOR-runnable integration suite. This is the one that produces the
  # `build/ci/evidence/ios.json` link/run evidence.
  #
  # STANDALONE — no `target: TwinVPN` host application, on purpose. The app links
  # `core-lite` and this bundle links the FULL core; both export the same
  # `twinvpn.h` symbols, so hosting one inside the other would be a duplicate-
  # symbol link or, worse, a run in which the test exercised the app's profile
  # while claiming to exercise the extension's.
  #
  # IT IS NOT `TwinVPNTests` AND DOES NOT REPLACE IT. This suite proves link,
  # load, invoke, receive and lifecycle transitions on a simulator. The
  # NetworkExtension-activation, jetsam and leak-capture rows need a provisioned
  # physical device and stay in `TwinVPNTests`, run by
  # `build/ci/jobs/ios-device-lifecycle.yml` and by nothing else.
  # -------------------------------------------------------------------------
  TwinVPNIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TwinVPNIntegrationTests
      - path: Sources/TwinVPNBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.twinvpn.client.integrationtests
        LIBRARY_SEARCH_PATHS: $(inherited) $(SRCROOT)/Frameworks/$(PLATFORM_NAME)
        OTHER_LDFLAGS: $(inherited) -ltwinvpn_core
        SWIFT_INCLUDE_PATHS: $(inherited) $(SRCROOT)/Sources/TwinVPNBridge/include
        # No host application, so no signing identity is needed to run it on a
        # simulator. Stated as a setting rather than left to a default, because
        # "it happened to work unsigned" is not a property to rely on.
        CODE_SIGNING_ALLOWED: NO

schemes:
  # The shipping scheme: app + extension, and the DEVICE-BOUND suite.
  TwinVPN:
    build:
      targets:
        TwinVPN: all
        TwinVPNProvider: all
    test:
      targets:
        - TwinVPNTests

  # The link/run scheme `build/ci/ci-ios.sh` drives. It BUILDS the production
  # targets — so the shared core is linked into a genuine app and a genuine
  # NetworkExtension on every run — and TESTS the simulator suite.
  TwinVPNIntegration:
    build:
      targets:
        TwinVPN: all
        TwinVPNProvider: all
        TwinVPNIntegrationTests: [test]
    test:
      targets:
        - TwinVPNIntegrationTests

  # The acceptance scheme `build/ci/ci-ios.sh --acceptance` drives.
  #
  # It BUILDS the production targets as well as the suite, for two reasons: the
  # simulator app is what `artifact_digests` names, and building it is what
  # makes the digest a binding to bytes produced from the sources the suite
  # compiled rather than to a name in a JSON file.
  TwinVPNAcceptance:
    build:
      targets:
        TwinVPN: all
        TwinVPNProvider: all
        TwinVPNAcceptanceTests: [test]
    test:
      targets:
        - TwinVPNAcceptanceTests
