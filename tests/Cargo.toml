# tests/ — integration, chaos, compatibility and end-to-end tests.
#
# Owner: test-engineering (docs/implementation/ownership.md §1).
#
# This is the fifth cargo workspace. The integration lead added it to the
# Makefile's `WORKSPACES`, so `make lint` and `make test` run everything here.
#
# It is deliberately NOT a member of the core workspace: a test workspace that
# shared the product's manifest could silently add a dependency to a shipped
# crate. The cost is that every dependency below is named by path; the benefit
# is that nothing in `tests/` can reach a shipped artifact's dependency graph.
#
# `services/` is deliberately absent. Pulling in axum, tokio and a Postgres
# client would give the system tests the services' dependency graph rather than
# the product's, so cross-service agreement is checked the way
# `services/control-plane/tests/client_agreement.rs` checks it: by reading the
# other side as text at compile time.
[workspace]
resolver = "2"
members = ["system"]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.90"
license      = "Apache-2.0"
repository   = "https://github.com/twinvpn/twinvpn"

[workspace.dependencies]
# The core crates under test. Named by path because `tests/` is not a member of
# the core workspace and must not become one: a test workspace that shared the
# product's manifest could silently add a dependency to a shipped crate.
# DP-1 -- "NO UNBOUNDED VERSION RANGES". The `version` next to every `path`
# below is not redundant. A path dependency with no `version` key is a `*`
# requirement, and build/deny.toml mechanises DP-1 as `wildcards = "deny"`.
# `allow-wildcard-paths` there does NOT exempt these: cargo-deny applies it only
# to crates declared private, and these are not declared private. So the bound
# is written on the edge itself, which is where DP-1 asks for it. The `path`
# still wins for resolution; the `version` is what an auditor reads.
twinvpn-types        = { version = "0.1.0", path = "../core/crates/twinvpn-types" }
twinvpn-env          = { version = "0.1.0", path = "../core/crates/twinvpn-env", features = ["test-support"] }
twinvpn-schema       = { version = "0.1.0", path = "../core/crates/twinvpn-schema" }
twinvpn-crypto       = { version = "0.1.0", path = "../core/crates/twinvpn-crypto", features = ["test-support"] }
twinvpn-platform     = { version = "0.1.0", path = "../core/crates/twinvpn-platform", features = ["mock"] }
twinvpn-store        = { version = "0.1.0", path = "../core/crates/twinvpn-store" }
twinvpn-trust        = { version = "0.1.0", path = "../core/crates/twinvpn-trust" }
twinvpn-session      = { version = "0.1.0", path = "../core/crates/twinvpn-session" }

# ---------------------------------------------------------------------------
# THE SERVER AND SHELL ARTIFACTS.
# ---------------------------------------------------------------------------
# Added by the integration lead on final-review's recommendation, and it is the
# single highest-leverage change available at the end of this wave.
#
# `ownership.md` §1 chose four separate cargo workspaces deliberately and stated
# the benefit: no domain silently acquires another's dependency graph. The COST
# was never stated, and final-review named it: **no test in this repository could
# link a client crate and a server crate at the same time.**
#
# That is not a hypothetical. It is the shared cause of every cross-artifact
# defect this wave paid for -- the control plane deriving a v6 address one way
# and twinvpn-route another; the relay MACing the egress frame over the ingress
# flow_id; two independently-written channel bindings both passing their own
# tests over the same release() bug; three hand-written HealthState models in two
# workspaces. Each side was correct in its own tests. Nothing could compare them,
# so the rig fell back on `include_str!`-ing the other crate's SOURCE and
# grepping it -- which proves a crate agrees with its own README and cannot
# decode a frame.
#
# The property that actually matters is untouched: no PRODUCTION crate gains
# another domain's graph. Only the test crate -- test-engineering's own -- gains
# the ability to see both sides of a wire it is supposed to be verifying.
twinvpn-service-common = { version = "0.1.0", path = "../services/twinvpn-service-common" }
twinvpn-relay          = { version = "0.1.0", path = "../services/relay" }
twinvpn-relay-directory = { version = "0.1.0", path = "../services/relay-directory" }
twinvpn-relay-health   = { version = "0.1.0", path = "../services/relay-health" }
twinvpn-rendezvous     = { version = "0.1.0", path = "../services/rendezvous" }
twinvpn-presence       = { version = "0.1.0", path = "../services/presence" }
# `test-support` carries the scripted verifier. It is what lets this workspace
# drive the control plane's REAL revoke path without a signing anchor this host
# does not have -- and it is never shipped, exactly as `twinvpn-env`'s and
# `twinvpn-cp-client`'s equivalents are not (ADR-0018 CD-5).
twinvpn-control-plane  = { version = "0.1.0", path = "../services/control-plane", features = ["test-support"] }
twinvpn-platform-linux = { version = "0.1.0", path = "../core/crates/twinvpn-platform-linux" }
twinvpn-path         = { version = "0.1.0", path = "../core/crates/twinvpn-path" }
twinvpn-relay-client = { version = "0.1.0", path = "../core/crates/twinvpn-relay-client" }
twinvpn-tunnel       = { version = "0.1.0", path = "../core/crates/twinvpn-tunnel" }
twinvpn-route        = { version = "0.1.0", path = "../core/crates/twinvpn-route" }
twinvpn-dns          = { version = "0.1.0", path = "../core/crates/twinvpn-dns" }
twinvpn-enforce      = { version = "0.1.0", path = "../core/crates/twinvpn-enforce" }
twinvpn-gateway      = { version = "0.1.0", path = "../core/crates/twinvpn-gateway" }
twinvpn-cp-client    = { version = "0.1.0", path = "../core/crates/twinvpn-cp-client" }
# `test-support` is what makes `twinvpn_core::testing` exist and binds the mock
# platform (CD-5). Never shipped; `lab/` and `tests/` are the never-shipped paths.
twinvpn-core         = { version = "0.1.0", path = "../core/crates/twinvpn-core", features = ["test-support"] }
twinvpn-mgmt         = { version = "0.1.0", path = "../core/crates/twinvpn-mgmt" }
twinvpn-diag         = { version = "0.1.0", path = "../core/crates/twinvpn-diag" }
# The C ABI, so W-24 and W-25 can be asserted against the shipped vtable rather
# than against the header text alone. `twinvpn-ffi` declares an `rlib` target
# beside its `cdylib`/`staticlib`, so this links like any other crate.
twinvpn-ffi          = { version = "0.1.0", path = "../core/crates/twinvpn-ffi" }

# TwinLab, for the deterministic Env and the scenario catalogue.
twinlab              = { version = "0.1.0", path = "../lab/twinlab" }

serde_json = "1.0"
# The wire runtime the shipped Rust bindings use. Pinned to the same major the
# core workspace pins, so a fixture that round-trips here round-trips there.
prost = "0.13"
# The device relay frame's payload type, for the byte-layout agreement test.
bytes = "1"
