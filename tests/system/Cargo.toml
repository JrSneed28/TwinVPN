# twinvpn-system-tests — the tests that cross a domain boundary.
#
# Owner: test-engineering.
#
# Every other test in this repository lives inside one domain. These do not:
# each one composes at least two components that different agents wrote, which is
# where the defects this domain exists to find actually are.
[package]
name    = "twinvpn-system-tests"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description = "integration, chaos, compatibility and end-to-end tests that cross a domain boundary"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
twinvpn-types        = { workspace = true }
twinvpn-env          = { workspace = true }
twinvpn-schema       = { workspace = true }
twinvpn-crypto       = { workspace = true }
twinvpn-platform     = { workspace = true }
twinvpn-session      = { workspace = true }
twinvpn-trust        = { workspace = true }
twinvpn-path         = { workspace = true }
twinvpn-relay-client = { workspace = true }
twinvpn-tunnel       = { workspace = true }
twinvpn-route        = { workspace = true }
twinvpn-dns          = { workspace = true }
twinvpn-enforce      = { workspace = true }
twinvpn-gateway      = { workspace = true }
twinvpn-core         = { workspace = true }
twinvpn-mgmt         = { workspace = true }
twinvpn-diag         = { workspace = true }
twinvpn-ffi          = { workspace = true }
twinvpn-store        = { workspace = true }
futures-core         = "0.3"
twinlab              = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# The control plane itself, for the two tests that drive its real revoke path
# and its real store trait. A dev-dependency: no shipped crate gains it, and
# CD-I5 is untouched because nothing here is a data-plane crate.
twinvpn-control-plane = { workspace = true }
# The relay-health service, so the ONE `HealthState` R-14 collapsed the three
# copies into can be asserted identical from both ends — the device's and the
# service's. A dev-dependency, for the reason above: no shipped crate gains it.
twinvpn-relay-health = { workspace = true }
twinvpn-service-common = { workspace = true }
futures = "0.3"
prost      = { workspace = true }
bytes      = "1"
# The control-plane client, for the C2 event decoder's fuzz target. A
# dev-dependency: no shipped crate gains it, and CD-I5 is untouched because
# nothing here is a data-plane crate.
twinvpn-cp-client = { workspace = true }
# The Linux platform adapter, for the netlink / nft / restore-point fuzz targets.
# A dev-dependency: it is a `twinvpn-platform-*` crate and nothing shipped here
# gains it.
twinvpn-platform-linux = { workspace = true }

# ---------------------------------------------------------------------------
# The four test levels ownership.md §1 assigns to `tests/`, kept as four
# directories rather than one flat `tests/` folder so that a reader can see the
# level a file belongs to without opening it.
# ---------------------------------------------------------------------------

[[test]]
name = "e2e_session_lifecycle"
path = "../e2e/session_lifecycle.rs"

[[test]]
name = "e2e_fail_closed_leak"
path = "../e2e/fail_closed_leak.rs"

[[test]]
name = "integration_dual_stack_parity"
path = "../integration/dual_stack_parity.rs"

[[test]]
name = "integration_cross_component_agreement"
path = "../integration/cross_component_agreement.rs"

[[test]]
name = "chaos_outage_and_failover"
path = "../chaos/outage_and_failover.rs"

[[test]]
name = "compatibility_golden_vectors"
path = "../compatibility/golden_vectors.rs"


[[test]]
name = "e2e_scenario_matrix"
path = "../e2e/scenario_matrix.rs"

[[test]]
name = "e2e_composed_core"
path = "../e2e/composed_core.rs"

[[test]]
name = "chaos_journal_write_behind"
path = "../chaos/journal_write_behind.rs"

# §2.13's database outage, injected at the control plane's real store seam.
[[test]]
name = "chaos_store_outage"
path = "../chaos/store_outage.rs"

[[test]]
name = "integration_tunnel_wire_agreement"
path = "../integration/tunnel_wire_agreement.rs"

# A-06, which spans two crates that never link in production: the control plane
# produces a revocation and `twinvpn-trust` on a device consumes one.
[[test]]
name = "integration_revocation_at_the_peer"
path = "../integration/revocation_at_the_peer.rs"

# ---------------------------------------------------------------------------
# The fuzz level. Every decoder that reads bytes this device did not write.
# ---------------------------------------------------------------------------

[[test]]
name = "fuzz_wire_decoders"
path = "../fuzz/wire_decoders.rs"

[[test]]
name = "fuzz_statement_decoders"
path = "../fuzz/statement_decoders.rs"

[[test]]
name = "fuzz_persistence_decoders"
path = "../fuzz/persistence_decoders.rs"

[[test]]
name = "fuzz_handshake_and_platform_decoders"
path = "../fuzz/handshake_and_platform_decoders.rs"
