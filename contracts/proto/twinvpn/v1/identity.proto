// TwinVPN shared contracts — public device identity and trust material.
//
// Authority: ADR-0007 (§7.2 derivation, N-1..N-8 identity, N-21..N-28 rotation
// and revocation), docs/protocol.md §8.1/§8.3/§8.4, ADR-0003 §11 (B2 signed
// statements are deterministic CBOR in COSE_Sign1, carried as opaque bytes).
//
// ===========================================================================
// SECRET-FIELD PROHIBITION — normative, and the reason this file is short
// ===========================================================================
// I4: the DeviceKey private half never transits. ADR-0018 CB-5 row 1: identity
// authentication-path keys (IK, OwnerSigningKey, OwnerRootKey) are NEVER held
// by the core and never leave the secure element.
//
// This file therefore contains NO field, and no code path may add one, for:
//   - IK private material            - OwnerRootKey / OwnerSigningKey private halves
//   - TK (X25519 static) private half  - the 24-word recovery phrase or its entropy
//   - Secure Enclave / Android Keystore / TPM / DPAPI wrapped blobs
//   - PairSecret (ADR-0007 N-19: MUST NOT be transmitted, backed up, or replicated)
//   - EpochSeed plaintext (S-33: only HPKE seals addressed to a recipient exist)
//   - the store encryption key, or any vault-resident material
//
// A schema change adding any of the above is a contract-freeze violation, and
// contracts/tests/test_no_secret_fields.py fails the build on the field-name
// and comment patterns that would introduce one.
// ===========================================================================

syntax = "proto3";

package twinvpn.v1;

// A COSE_Sign1 signed statement, carried verbatim.
//
// ADR-0003 §11 B2 row: deterministic CBOR (RFC 8949 §4.2.1) inside COSE_Sign1
// (RFC 9052). The signature MUST be verified over the RECEIVED OCTETS; an
// implementation MUST NOT re-serialize before verifying. Non-canonical input
// MUST be REJECTED (PROTO.NON_CANONICAL_CBOR), never normalized — normalizing
// attacker input before verification is a signature-bypass pattern.
//
// The schema of what is inside is in contracts/cddl/twinvpn/v1/. It is
// deliberately NOT expressed in protobuf: protobuf has no normative canonical
// encoding (ADR-0003 §6), so a protobuf representation of a signed statement
// would be a second byte representation of a thing that must have exactly one
// (ADR-0003 §11 rule 1).
message SignedStatement {
  // Opaque COSE_Sign1 octets. Size-capped per statement type; see
  // contracts/docs/trust-boundaries.md.
  bytes cose_sign1 = 1;

  // Which CDDL type the payload claims to be. A HINT for dispatch only: the
  // authoritative type is the one inside the signed payload, and a verifier
  // MUST re-check it after verification rather than trusting this field.
  // An attacker controls this value.
  SignedStatementType statement_type = 2;
}

// The B2 statement inventory of ADR-0003 §11.5. Closed: a new signed statement
// type is added here and to the CDDL in the same change.
enum SignedStatementType {
  SIGNED_STATEMENT_TYPE_UNSPECIFIED = 0;
  SIGNED_STATEMENT_TYPE_PAIRING_ATTESTATION = 1;
  SIGNED_STATEMENT_TYPE_REVOCATION_STATEMENT = 2;
  SIGNED_STATEMENT_TYPE_DEVICE_IDENTITY_RECORD = 3;
  SIGNED_STATEMENT_TYPE_POLICY_BUNDLE = 4;
  SIGNED_STATEMENT_TYPE_ROUTE_ADVERTISEMENT = 5;
  SIGNED_STATEMENT_TYPE_EXIT_NODE_OFFER = 6;
  SIGNED_STATEMENT_TYPE_IDENTITY_SUCCESSION = 7;
  SIGNED_STATEMENT_TYPE_TUNNEL_KEY_BINDING = 8;
  SIGNED_STATEMENT_TYPE_OWNER_TRUST_ANCHOR = 9;
  SIGNED_STATEMENT_TYPE_OWNER_DELEGATION = 10;
  SIGNED_STATEMENT_TYPE_TRUST_EPOCH_BUNDLE = 11;
  SIGNED_STATEMENT_TYPE_RELAY_CAPABILITY_TOKEN = 12;
  SIGNED_STATEMENT_TYPE_RELAY_EPOCH_FLOOR = 13;
  SIGNED_STATEMENT_TYPE_RELAY_MAP = 14;
  SIGNED_STATEMENT_TYPE_LOG_HEAD = 15;
  SIGNED_STATEMENT_TYPE_NETWORK_CONTRACT = 16;
}

// Signature algorithm of an identity key. ADR-0007 N-1 fixes ES256 for the
// identity key in this epoch; the enum exists so a future algorithm is a
// registered value rather than a reinterpretation of an existing one.
enum IdentityKeyAlgorithm {
  IDENTITY_KEY_ALGORITHM_UNSPECIFIED = 0;
  // ES256 (P-256 / SHA-256), COSE alg -7. ADR-0007 N-1.
  IDENTITY_KEY_ALGORITHM_ES256 = 1;
}

// Key-agreement algorithm of the tunnel static key.
enum TunnelKeyAlgorithm {
  TUNNEL_KEY_ALGORITHM_UNSPECIFIED = 0;
  // X25519. ADR-0007 N-1.
  TUNNEL_KEY_ALGORITHM_X25519 = 1;
}

// The PUBLIC half of a device's identity. docs/architecture.md §3.3
// `DeviceIdentity`.
//
// A rotation creates a NEW DeviceIdentity at generation+1 linked to its
// predecessor by a dual-signed IdentitySuccession, and does NOT change
// `device_id` (ADR-0007 N-2, N-21) — otherwise S-08's immutable address
// allocation would break on every rotation.
message DeviceIdentity {
  // SHA-256("TwinVPN/DeviceIdentity/v1" || 0x00 || dCBOR(COSE_Key(IK_pub))),
  // untruncated. Exactly 32 bytes. DERIVED, self-certifying, verifiable offline
  // by any peer without contacting anything (ADR-0007 Q1).
  bytes identity_id = 1;

  // The `identity_id` of generation 0. Exactly 32 bytes. Stable for the
  // device's life. This is the device's permanent name.
  bytes device_id = 2;

  // Rotation generation. 0 at enrolment, +1 per IK rotation. MONOTONE: a peer
  // stores `highest_generation_seen` per device_id and MUST reject any
  // statement at or below the stored value (ADR-0007 N-22, N-26). A lower value
  // is AUTH.TRUST_EPOCH_ROLLBACK, refused rather than applied.
  uint32 generation = 3;

  // COSE_Key encoding of the ES256 identity public key. PUBLIC material only.
  bytes identity_public_key = 4;
  IdentityKeyAlgorithm identity_key_algorithm = 5;

  // COSE_Key encoding of the X25519 tunnel static public key. PUBLIC material.
  bytes tunnel_public_key = 6;
  TunnelKeyAlgorithm tunnel_key_algorithm = 7;

  // Rotation counter for the tunnel key. TK rotation does NOT change
  // DeviceIdentity (ADR-0007 N-21); this counter is tracked separately as
  // `highest_tk_generation_seen`. TK MUST be rotated at least every 180 days —
  // this is the mechanism that bounds an extracted tunnel key, and it replaced
  // certificate expiry in that role.
  uint32 tk_generation = 8;

  // The IK-signed TunnelKeyBinding over
  // {device_id, identity_id, tk_pub, tk_generation, not_after_ms}.
  //
  // ADR-0007 N-4: a peer MUST verify this before writing TK into TrustedPeer.
  // The check MUST NOT be skippable by configuration. A skipped check is a FULL
  // AUTHENTICATION BYPASS: it is what binds the X25519 tunnel key, which no
  // secure element can hold, to the hardware-held identity key that authorizes
  // it.
  SignedStatement tunnel_key_binding = 9;

  // Whether the identity private half is held by a hardware-backed store.
  //
  // ADR-0007 N-6: a peer MUST NOT treat an UNATTESTED `hardware_backed = true`
  // as evidence. This is a self-report; the attestation is the evidence, and
  // where the platform provides one it is verified at enrolment by the
  // approving OSK device. A downgrade of this flag MUST force IK rotation and
  // re-attestation, surfaced as AUTH.HARDWARE_BACKING_LOST (N-24).
  bool hardware_backed = 10;

  uint64 created_at_ms = 11;
}
