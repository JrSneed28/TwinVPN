// TwinVPN shared contracts — the Owner-signed policy bundle.
//
// Authority: docs/protocol.md §13.4, ADR-0009 §11.4 (the grant/deny asymmetry
// on expiry), ADR-0012 §11.10 (killswitch_floor), docs/architecture.md §3.3
// `AccessPolicy`, S-06/S-07.
//
// ===========================================================================
// WHOLE-STATE, MONOTONE, OWNER-SIGNED. NEVER A DELTA.
// ===========================================================================
// docs/protocol.md §15.1 E-3: "Delta-encoded policy requires exactly-once
// delivery to stay correct. EXACTLY-ONCE DELIVERY DOES NOT EXIST." The protocol
// therefore mandates whole-bundle transfer with a monotone policy_version,
// accepting the bandwidth cost, so that a device that missed an arbitrary
// number of updates converges on a SINGLE MESSAGE.
//
// A monotone version number alone is NOT enough for deltas: it DETECTS a gap
// without REPAIRING it.
// ===========================================================================

syntax = "proto3";

package twinvpn.v1;

import "twinvpn/v1/dns.proto";
import "twinvpn/v1/identity.proto";
import "twinvpn/v1/peer.proto";
import "twinvpn/v1/routing.proto";

// The minimum kill-switch enforcement the Owner requires of every device.
//
// ===========================================================================
// A FLOOR, NEVER A CEILING. THIS IS NORMATIVE AND STRUCTURAL.
// ===========================================================================
// docs/protocol.md §13.4 and ADR-0012 §11.10: `killswitch_floor` contributes
// ONLY to `policy_required_mode`, and the effective enforcement is
//
//     max(local_mode, policy_required_mode)
//
// THERE IS NO ENCODING OF THIS FIELD, OR OF ANY OTHER FIELD IN THIS BUNDLE,
// THAT LOWERS ENFORCEMENT BELOW THE DEVICE'S LOCAL SETTING, AND NO RECEIVER MAY
// IMPLEMENT ONE.
//
// This is the schema-level guarantee behind ADR-0012 KS-22 and
// docs/threat-model.md AD-7: A FULLY COMPROMISED COORDINATION SERVICE CAN MAKE
// A DEVICE MORE BLOCKED, NEVER LESS.
//
// The enum is ordered so that "higher value = stricter" and max() is a plain
// integer comparison — the ordering is the mechanism, not a convention.
// ===========================================================================
enum KillSwitchFloor {
  KILL_SWITCH_FLOOR_UNSPECIFIED = 0;
  // The Owner imposes no floor. The device's own local setting governs.
  KILL_SWITCH_FLOOR_NONE = 1;
  // Every device MUST enforce fail-closed for protected traffic.
  KILL_SWITCH_FLOOR_FAIL_CLOSED = 2;
}

// Where a device may egress, as policy.
message ExitPolicy {
  // Devices the Owner permits to be used as ExitNodes. Empty means none.
  repeated bytes permitted_exit_node_device_ids = 1;

  // Whether a device may engage an ExitNode at all.
  bool exit_node_use_permitted = 2;
}

// Which relay regions the TwinNet prefers or forbids.
//
// This is the DURABLE half of docs/protocol.md §6.2's bridge rule: "this
// TwinNet is configured to prefer region X" is durable policy, while the
// assignment hint itself is ephemeral advice. The whole interaction is never
// promoted to durable to satisfy the durable half.
message RelayRegionPolicy {
  repeated string preferred_region_ids = 1;
  repeated string forbidden_region_ids = 2;

  // Operator groups whose relays this TwinNet will bind. Empty means the
  // product default group.
  repeated string permitted_operator_group_ids = 3;
}

// The complete, signed, versioned policy document.
//
// STATE OWNERSHIP: S-06 / S-07. AUTHORED by the Owner authority via an OSK
// holding the POLICY power. The control plane WAREHOUSES AND DISTRIBUTES; IT
// CANNOT AUTHOR — otherwise a compromised coordination service could disable
// every kill switch in the fleet, which would make I1 and I3 jointly worthless.
//
// CONSISTENCY: MONOTONIC reads mandatory, eventual convergence acceptable. A
// device MUST reject any bundle with policy_version <= its high-water mark
// (ADR-0008 N-3). A bundle not verifiable against the pinned OwnerTrustAnchor
// (S-32) MUST BE REJECTED OUTRIGHT, WHATEVER ITS VERSION.
message PolicyBundle {
  string twinnet_id = 1;

  // Monotone. Replaying an older bundle is a POLICY ROLLBACK ATTACK — E4 in
  // docs/protocol.md §6's classification — which is why policy is durable and
  // why this field is the anti-downgrade control.
  uint64 policy_version = 2;

  // Stable identifier of the policy document lineage. Constant across versions.
  string policy_id = 3;

  // Peer-to-peer access rules.
  repeated PeerPermission access_rules = 4;

  DNSPolicy dns_policy = 5;

  // Route policy the Owner imposes. Note that a device's ACCEPTANCE of an
  // advertised route remains LOCAL (S-17, S-50): policy says what MAY be
  // accepted, and the Owner's local consent record says what IS.
  RoutePolicy route_policy = 6;

  ExitPolicy exit_policy = 7;
  RelayRegionPolicy relay_region_policy = 8;

  KillSwitchFloor killswitch_floor = 9;

  // ===================================================================
  // BEHAVIOUR ON EXPIRY IS NOT A POLICY INPUT AND IS NOT REMOTELY SELECTABLE.
  // ===================================================================
  // docs/protocol.md §13.4: it is FIXED by ADR-0009 §11.4's grant/deny
  // asymmetry — on expiry, GRANTS carried by the bundle SUSPEND and DENIALS
  // PERSIST, so an expired bundle can only ever become MORE RESTRICTIVE.
  //
  // An established Session is NEVER TORN DOWN by expiry (I5). Surfaced as
  // POLICY.EXPIRY.BUNDLE_EXPIRED.
  //
  // There is deliberately no `on_expiry` field here. Adding one would make the
  // fail-closed behaviour remotely selectable, which is the same hole
  // killswitch_floor's floor-not-ceiling rule exists to close.
  uint64 not_after_ms = 10;

  uint64 issued_at_ms = 11;

  // The Rule-B Owner-authority-signed original, deterministic CBOR in
  // COSE_Sign1. Verified over received octets against the pinned
  // OwnerTrustAnchor.
  //
  // NORMATIVE: the decoded fields above are a VIEW. Enforcement MUST read from
  // the verified payload. Until `signed` verifies, every field in this message
  // is attacker-controlled.
  SignedStatement signed = 12;
}

// A signed state document's availability notice or a pull result.
// docs/protocol.md §16 rows 39-40, ADR-0002 §11.4.
enum StateDocumentType {
  STATE_DOCUMENT_TYPE_UNSPECIFIED = 0;
  STATE_DOCUMENT_TYPE_POLICY_BUNDLE = 1;
  STATE_DOCUMENT_TYPE_OWNER_TRUST_ANCHOR = 2;
  STATE_DOCUMENT_TYPE_TRUST_EPOCH_BUNDLE = 3;
  STATE_DOCUMENT_TYPE_RELAY_MAP = 4;
  STATE_DOCUMENT_TYPE_RELAY_EPOCH_FLOOR = 5;
  STATE_DOCUMENT_TYPE_NETWORK_CONTRACT = 6;
  STATE_DOCUMENT_TYPE_MEMBERSHIP = 7;
}

// A reference sufficient to pull a document that was too large to push inline.
//
// ADR-0002 §11.4: documents <= 16 KiB are pushed inline; larger ones are
// announced by this reference and pulled via GetStateDocument. PULL IS ALWAYS
// AVAILABLE INDEPENDENTLY OF PUSH — a device MUST be able to reach a correct
// state USING PULL ALONE, with push serving only to reduce latency.
//
// That property is what makes ADR-0002's stream compaction safe: a device told
// "your backlog was shed, you are now at net_seq N" can always recover by
// declarative re-read.
message StateDocumentRef {
  StateDocumentType doc_type = 1;

  // Monotone per doc_type. The device holds a per-document-type high-water mark
  // (S-27) and rejects a lower version.
  uint64 version = 2;

  // SHA-256 of the document bytes, exactly 32 bytes. Verified ALONGSIDE the
  // signature, not instead of it: the digest proves the pull returned what was
  // announced, the signature proves the Owner authored it.
  bytes digest = 3;

  uint64 size_bytes = 4;
}
