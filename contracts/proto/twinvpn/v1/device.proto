// TwinVPN shared contracts — the Device record.
//
// Authority: docs/architecture.md §3.3 `Device`, S-02 (control plane is the
// authoritative writer of the DeviceIdentity public record and TwinNet
// membership), ADR-0007, ADR-0010 §11.1 (address plan), docs/protocol.md §8.1.

syntax = "proto3";

package twinvpn.v1;

import "twinvpn/v1/capability.proto";
import "twinvpn/v1/common.proto";
import "twinvpn/v1/identity.proto";

// The OS family a device runs on. Coarse by design: this is a
// PLATFORM-CLASS field, not a fingerprint. ADR-0015 Tier 2 admits
// `platform_class` and nothing finer, and this enum is that granularity.
enum DevicePlatform {
  DEVICE_PLATFORM_UNSPECIFIED = 0;
  DEVICE_PLATFORM_IOS = 1;
  DEVICE_PLATFORM_IPADOS = 2;
  DEVICE_PLATFORM_ANDROID = 3;
  DEVICE_PLATFORM_MACOS = 4;
  DEVICE_PLATFORM_WINDOWS = 5;
  DEVICE_PLATFORM_LINUX = 6;
  DEVICE_PLATFORM_OPENWRT = 7;
}

// A role a Device may act in. docs/protocol.md §8.1 `declared_roles`.
//
// Roles are DECLARED at registration and are properties of the Device, not
// separate entities: there is no `Gateway` object with its own identifier.
// A LANGateway and an ExitNode are a Device acting in a role, keyed by
// `device_id`. See contracts/docs/identifiers.md on why `gateway_id` does not
// exist.
enum DeviceRole {
  DEVICE_ROLE_UNSPECIFIED = 0;
  DEVICE_ROLE_CLIENT = 1;
  DEVICE_ROLE_GATEWAY = 2;
  DEVICE_ROLE_EXIT_NODE = 3;
  DEVICE_ROLE_LAN_GATEWAY = 4;
}

// Coarse platform description. docs/protocol.md §8.1 `platform`.
//
// PRIVACY: this is metadata about the device, warehoused by a SEMI-TRUSTED
// coordination service and readable by every peer in the TwinNet. It carries
// version strings because PROTO.VERSION_UNSUPPORTED must be able to say "update
// Study PC" rather than emit a bare number (I6), and it carries nothing else.
// It MUST NOT carry a hardware serial, an advertising identifier, an IMEI, a
// MAC address, an installed-software inventory, or a hostname beyond the
// Owner-chosen label on the Device record.
message DevicePlatformInfo {
  DevicePlatform platform = 1;

  // OS release, e.g. "17.4". Coarse enough to answer "does this build support
  // the feature", fine enough to reproduce a platform bug.
  string os_version = 2;

  // CPU architecture, e.g. "arm64", "x86_64", "mips".
  string arch = 3;

  // TwinVPN agent release. ADR-0018 V-A `core_version`, SemVer.
  //
  // Deliberately NOT accompanied by `abi_major`/`abi_minor`: ADR-0018 VR-2
  // states those MUST NOT appear on any wire, and a message carrying one is a
  // defect. The shell/core ABI is an in-process concern only.
  string agent_version = 4;
}

// A Device as the control plane records it and as peers see it.
//
// STATE OWNERSHIP: S-02. The control plane is the authoritative writer; every
// Device caches the member list. STRONG at the authority, MONOTONIC at the
// edge. Higher membership epoch wins; equal epoch with different content is
// rejected and refetched.
message Device {
  // 32 bytes. Derived, self-certifying, stable for life. Never assigned by a
  // server (docs/protocol.md §8.1: `device_id_echo` is an echo, and a device
  // MUST abort with AUTH.IDENTITY_MISMATCH on disagreement rather than adopt
  // the server's value).
  bytes device_id = 1;

  string twinnet_id = 2;

  // The current public identity. Rotation replaces this while `device_id`
  // stays fixed.
  DeviceIdentity identity = 3;

  // Owner-chosen display label, e.g. "Study PC". LDH per RFC 1035, lowercase,
  // IDNA2008 A-label if non-ASCII, <= 63 octets. Uniqueness within the TwinNet
  // is enforced by the control plane (S-02) because it becomes a DNS label
  // (ADR-0011 §11.3).
  string label = 4;

  DevicePlatformInfo platform = 5;

  // Canonically sorted, deduplicated. At most 4 entries.
  repeated DeviceRole roles = 6;

  // The device's own advertisement (S-19). EVENTUAL globally; the value
  // negotiated at handshake governs a Tunnel, and a later advertisement change
  // affects only NEW Tunnels.
  CapabilitySet capabilities = 7;

  // Supported epoch range (S-20).
  ProtocolVersion protocol_version = 8;

  // Overlay addresses. ADR-0010 R1 and docs/protocol.md §8.1: a device MUST
  // receive BOTH, even on a v4-only or v6-only network, because addressing
  // inside the TwinNet is independent of underlay reachability.
  //
  // Both fields are REQUIRED. A Device with one set and not the other is
  // malformed — that asymmetry is exactly how a v6-aware design degrades into a
  // v4-only one (ADR-0011 DN-13).
  //
  // Allocation: v4 is a /32 from 100.64.0.0/10 (RFC 6598) by the control-plane
  // allocator; v6 is a /128 derived as
  // prefix64 || truncate64(HKDF(DeviceKey_pub, "twinvpn-v6-iid")) with the U/L
  // bit cleared per RFC 7136, inside the pinned product ULA
  // fd7c:9e5d:2a10::/48. S-08: allocation is single-writer and effectively
  // immutable; a collision is refused AT ALLOCATION TIME, never resolved at
  // runtime.
  IPv4Address twinnet_address_v4 = 9;
  IPv6Address twinnet_address_v6 = 10;

  // TwinNet membership epoch at which this record was written. MONOTONIC.
  uint64 membership_epoch = 11;

  // Object version for ADR-0008 N-1 conditional writes.
  uint64 version = 12;

  uint64 created_at_ms = 13;

  // True once an Owner-signed RevocationRecord has been admitted for this
  // device. TERMINAL AND IRREVERSIBLE for this DeviceIdentity
  // (docs/architecture.md §3.3).
  //
  // ADR-0008 N-7: revocation is modelled as a monotone epoch plus a
  // NEVER-SHRINKING revoked set. This boolean may go false->true and MUST NOT
  // go true->false; an operation that would shrink the revoked set is rejected.
  // A mutable "revoked: true/false" is precisely the shape that permits
  // un-revocation by replaying an older record.
  bool revoked = 14;
}
