// TwinVPN shared contracts — common envelope, metadata, identifiers, time,
// versions, and canonical network address types.
//
// Authority:
//   docs/protocol.md §2  (the message envelope and its normative field rules)
//   docs/protocol.md §5  (ordering, causality, delivery)
//   ADR-0003 §11         (protobuf at B1/B3; deterministic CBOR at B2; caps)
//   ADR-0008 §11.1       (idempotency keys, monotone versions, preconditions)
//   ADR-0014 §11.1-11.2  (ProtocolEpoch; one number space, three axes)
//   ADR-0018 §11.12      (the three version numbers; VR-2 abi_* never on a wire)
//
// TRUST BOUNDARY: every message in this file is attacker-reachable. B1 bodies
// arrive over a mutually authenticated channel from a semi-trusted peer; B3
// bodies arrive pre-authentication through an untrusted rendezvous. Nothing
// here may be treated as valid before the validation rules in
// contracts/docs/trust-boundaries.md have run.

syntax = "proto3";

package twinvpn.v1;

// ---------------------------------------------------------------------------
// 1. Identifiers
// ---------------------------------------------------------------------------
//
// Every identifier below is OPAQUE to its consumers unless this file says
// otherwise. Generation authority, uniqueness scope, reuse and structure are
// specified normatively in contracts/docs/identifiers.md; the comments here are
// the wire-level restatement, not a second authority.
//
// Sizes are exact and MUST be validated on receipt. A length mismatch is
// PROTO.MALFORMED_MESSAGE, never a truncation or a pad.

// A `TwinNet`-scoped, self-certifying device identifier.
//
//   device_id = identity_id of generation 0
//   identity_id = SHA-256("TwinVPN/DeviceIdentity/v1" || 0x00 || dCBOR(COSE_Key(IK_pub)))
//
// ADR-0007 N-2. Exactly 32 bytes, untruncated. DERIVED on-device, never
// assigned by a server: RegisterDeviceResp.device_id_echo is an echo the device
// MUST compare against its own derivation and MUST NOT adopt
// (docs/protocol.md §8.1). Stable for the life of the device; unchanged by
// rotation. Never reused.
//
// The text form is "twd1" || base32-lower-nopad(device_id) and is a
// PRESENTATION form only. It MUST NOT appear in any field of this contract set.

// ---------------------------------------------------------------------------
// 2. Protocol and schema versions
// ---------------------------------------------------------------------------

// The single monotonic integer version space of ADR-0014 N-1.
//
// One number space, three independent positions in it (ADR-0014 §11.1):
//   V-1 wire/schema contract  — NOT versioned by this number; see SchemaDescriptor
//   V-2 peer protocol (C4/C5/C6) — negotiated per Tunnel, immutable for its life
//   V-3 control-plane API (C1/C2/C7) — fixed for the life of a control connection
//
// An additive schema change compatible under ADR-0003 MUST NOT bump this
// (ADR-0014 N-1, N-23). An epoch bump is required when and only when a
// receiver's required behaviour changes.
message ProtocolVersion {
  // Highest epoch this speaker supports. `uint32`, strictly monotone.
  uint32 v_max = 1;

  // Minimum Supported Protocol Version (MSPV). ADR-0014 N-2: the range
  // [v_min, v_max] MUST be contiguous with v_min <= v_max, MUST come from the
  // local build plus local policy only, and MUST NOT be narrowable by anything
  // the control plane supplies (ADR-0001 D4).
  uint32 v_min = 2;
}

// A single negotiated epoch. ADR-0014 N-3: a Tunnel negotiates exactly one
// epoch, immutable for the Tunnel's lifetime.
message NegotiatedProtocolVersion {
  uint32 epoch = 1;
}

// Identity of the schema artifact set a speaker was built against.
//
// ADR-0018 §11.12: the schema digest is a CONTENT IDENTITY, not a version, and
// is deliberately not a negotiated number. ADR-0003 §11 rule 4 requires the
// artifacts to be published immutably per release; this message carries the
// digest that names one such publication.
//
// This is diagnostic and build-provenance data. It MUST NOT be used as a
// compatibility gate — compatibility is decided by ProtocolVersion (V-2/V-3)
// and by ADR-0003's additive-field rules, never by comparing digests.
message SchemaDescriptor {
  // The frozen namespace of this contract set. Always "twinvpn.v1" for this
  // package. A new major namespace is a new directory, never a mutation here.
  string namespace = 1;

  // SHA-256 over the canonicalized artifact set (.proto + .cddl + registries),
  // exactly 32 bytes. Reproduced by `make contracts`.
  bytes schema_digest = 2;

  // Append-only version of the reason-code registry this build embeds
  // (ADR-0015 §11.2 rule 6).
  uint32 reason_registry_version = 3;
}

// ---------------------------------------------------------------------------
// 3. Time
// ---------------------------------------------------------------------------
//
// docs/protocol.md §2: `sender_time_ms` is ADVISORY ONLY. No protocol decision
// may depend on a peer's clock. ADR-0009 K-1/RQ-9: no security decision may
// depend on the device's clock being correct.
//
// Two clock kinds exist and they are never interchangeable. The type system
// enforces the distinction: a field carrying WallClockMillis MUST NOT be used
// to compute a timeout, and a field carrying MonotonicMicros MUST NOT be
// compared across devices or across a process restart.

// UTC milliseconds since the Unix epoch, as observed on the emitting host's
// wall clock. Advisory. Permitted uses:
//   - rendering to a human
//   - evaluating a signed statement's not_before_ms / not_after_ms against
//     LOCAL time with an explicit skew allowance, surfacing
//     AUTH.STATEMENT_EXPIRED on failure (docs/protocol.md §2)
//   - TTL expiry of ephemeral hints, where being wrong costs a wasted probe
// Prohibited uses: ordering, freshness proofs, retry/backoff scheduling, any
// protocol timeout, and any authorization decision.
message WallClockMillis {
  uint64 value = 1;
}

// Microseconds from an unspecified, host-local, strictly non-decreasing origin
// that is unaffected by NTP steps, timezone changes, and user clock edits.
//
// This is the ONLY clock permitted for: protocol timeouts, backoff and retry
// scheduling, RTT and quality measurement, liveness and dead-path detection,
// path-validation budgets, and freshness windows on locally held assertions.
//
// The origin is process-local and meaningless off-device. A MonotonicMicros
// value MUST NOT be transmitted between devices, compared across a process
// restart, or persisted and reloaded as if still valid. ADR-0022 requires the
// injected Clock to REPORT the wall-clock discontinuity across suspend rather
// than hide it, so a monotonic reading that spans a suspend is still ordered
// correctly while the wall clock beside it may jump.
message MonotonicMicros {
  uint64 value = 1;
}

// ---------------------------------------------------------------------------
// 4. Canonical network address types
// ---------------------------------------------------------------------------
//
// ADR-0010 R1: IPv4 and IPv6 are co-equal. No schema in this package may make
// IPv6 optional relative to IPv4, and no field may be interpretable as "v4
// present therefore dual-stack".
//
// Addresses are FIXED-WIDTH BINARY, never free-form strings. A textual address
// would admit "127.0.0.1 " , "::ffff:10.0.0.1", "010.0.0.1" and every other
// parser-divergence vector at a boundary ADR-0003 §7 requires to be safe on
// hostile input.

enum AddressFamily {
  ADDRESS_FAMILY_UNSPECIFIED = 0;
  ADDRESS_FAMILY_V4 = 1;
  ADDRESS_FAMILY_V6 = 2;
}

// Exactly 4 bytes, network byte order. Any other length is malformed.
message IPv4Address {
  bytes octets = 1;
}

// Exactly 16 bytes, network byte order. Any other length is malformed.
//
// An IPv4-mapped IPv6 address (::ffff:0:0/96) MUST be rejected here, not
// silently unmapped: accepting it would let one logical address arrive under
// two encodings and defeat every set-membership and prefix-match check that
// depends on a canonical form.
message IPv6Address {
  bytes octets = 1;

  // RFC 4007 scope zone index. REQUIRED and non-zero for link-local addresses
  // (fe80::/10); MUST be zero otherwise. docs/protocol.md §10.4: "IPv6
  // link-local host candidates MUST carry zone_index or they are unusable on
  // multi-interface hosts."
  uint32 zone_index = 2;
}

// Exactly one family is set. An IPAddress with neither set is malformed; the
// oneof makes "both" unrepresentable.
message IPAddress {
  oneof address {
    IPv4Address v4 = 1;
    IPv6Address v6 = 2;
  }
}

// A CIDR prefix. `prefix_len` is validated against the family: 0..32 for v4,
// 0..128 for v6.
//
// Normative canonical form: every bit below `prefix_len` MUST be zero. A
// non-canonical prefix (10.0.0.1/24) MUST be REJECTED, never normalized —
// normalizing attacker input before a policy check is how a rule intended to
// match one network comes to match another.
message IPPrefix {
  IPAddress address = 1;
  uint32 prefix_len = 2;
}

// A transport endpoint. docs/architecture.md §3.3 `Endpoint`.
message Endpoint {
  IPAddress address = 1;

  // 1..65535. Port 0 is malformed.
  uint32 port = 2;
}

// ---------------------------------------------------------------------------
// 5. Message metadata — the envelope
// ---------------------------------------------------------------------------

// Authentication material. docs/protocol.md §2 and §3.
//
// Exactly one of the two authentication modes applies to any given message:
//
//   Rule A — channel-authenticated. The message travels only over the mutually
//   authenticated channel between its origin and its final consumer.
//   `channel_binding` is set; no per-message signature exists.
//
//   Rule B — transitively forwarded. The message is forwarded, stored or
//   reconstructed by a third party. `signed_payload` + `detached_sig` +
//   `signer_key_id` are set, and the verifier MUST verify over the exact
//   received octets of `signed_payload` and MUST NOT re-serialize
//   (ADR-0003 §7, §11 B2 row).
//
// SECURITY: `signed_payload` is deterministic CBOR inside a COSE_Sign1
// envelope, carried here as opaque bytes precisely so that no protobuf
// re-encoding can ever sit between receipt and verification. Nothing in this
// package may parse `signed_payload` as protobuf.
message Auth {
  // Rule A. RFC 9266 `tls-exporter` value of the current control connection:
  // 32 bytes, label "EXPORTER-Channel-Binding", empty context, taken from the
  // TLS 1.3 handshake underlying QUIC (RFC 9001) or the direct TLS on the TCP
  // rungs. ADR-0002 N-2: a receiver MUST verify it against its own exporter and
  // MUST reject a mismatch with CONTROL.CHANNEL_BINDING_MISMATCH, treated as a
  // security event and never as a parse error.
  bytes channel_binding = 1;

  // Rule B. Detached signature over the octets of `signed_payload`.
  bytes detached_sig = 2;

  // Rule B. Opaque octets. Deterministic CBOR (RFC 8949 §4.2.1) in a COSE_Sign1
  // envelope (RFC 9052). The signature covers THESE BYTES VERBATIM.
  bytes signed_payload = 3;

  // Rule B. DeviceKey fingerprint of the signer, per ADR-0007.
  string signer_key_id = 4;

  // Signed statements only. Bounded lifetime is mandatory (ADR-0003 B2 row).
  // Evaluated against LOCAL time with an explicit skew allowance; failure is
  // AUTH.STATEMENT_EXPIRED, never a silent drop.
  uint64 not_before_ms = 5;
  uint64 not_after_ms = 6;
}

// Standardized metadata carried by every command and event that requires it.
//
// This message exists so that the fields below have ONE definition and one set
// of semantics. Each field's generation authority and use are normative and are
// restated in full in contracts/docs/identifiers.md.
message MessageMetadata {
  // ADR-0014 N-1. MUST be present on every message. A receiver that cannot
  // parse this field MUST drop the message and emit PROTO.UNPARSEABLE_ENVELOPE.
  // Not negotiated per message: fixed for the life of a connection.
  uint32 proto_version = 1;

  // 16-byte UUIDv7, time-sortable. GENERATED BY THE EMITTER, unique PER
  // EMISSION — including per retransmission of a logically identical request.
  // A retry reuses `idempotency_key`, never `message_id`. That separation is
  // what lets diagnostics distinguish "the client retried once" from "the
  // network duplicated it" (docs/protocol.md §2).
  bytes message_id = 2;

  // The `message_id` this message responds to or was caused by. Empty on an
  // origin message. Responses MUST echo the request's `message_id`; events
  // caused by a request SHOULD echo it, which is what makes an Owner-visible
  // causal trace possible (I6).
  bytes correlation_id = 3;

  // The `message_id` of the message whose PROCESSING produced this one, as
  // distinct from the message this one answers.
  //
  // `correlation_id` answers "what is this a reply to"; `causation_id` answers
  // "what made this happen". They differ whenever an event is emitted as a
  // second-order consequence: a PolicyBundleUpdated caused by a PutPolicyReq
  // carries that request's id in both, but a route withdrawal triggered by
  // processing a DeviceRevoked carries the revocation event's id in
  // `causation_id` and no `correlation_id` at all.
  //
  // Set by the emitter from the message it is currently processing. Never
  // invented, never inherited transitively — a causation chain is reconstructed
  // by following one link at a time, which is what keeps it a chain rather than
  // a claim.
  bytes causation_id = 4;

  // Opaque control-plane-sealed value. Devices STORE the newest one seen per
  // twinnet_id and ECHO it on every C1 request. Devices MUST NOT parse it
  // (docs/protocol.md §5.2) — any client-side interpretation becomes a
  // compatibility landmine across ADR-0014 version boundaries.
  //
  // Internally it is a sealed CBOR {twinnet_id, min_net_seq,
  // min_revocation_epoch, issued_at_ms} (ADR-0002 §11.3) carrying monotonic-read
  // constraints across replica failover. That structure is the control plane's
  // business and is deliberately not expressed in this schema.
  bytes causality_token = 5;

  // Emitter's wall clock. ADVISORY ONLY — see WallClockMillis. Never a guard.
  uint64 sender_time_ms = 6;

  // TwinNet scope. Every message is TwinNet-scoped; there is no cross-TwinNet
  // message and no global ordering across TwinNets (docs/protocol.md §15.2).
  string twinnet_id = 7;

  // The emitting principal: a device_id in its "twd1..." text form, or one of
  // the fixed infrastructure principals "coord", "rendezvous",
  // "relay:<region>".
  string sender_id = 8;

  // Durable log position within `twinnet_id`. NON-ZERO ONLY on a durable C2
  // event. Strictly increasing per TwinNet; it is the resume cursor.
  //
  // ADR-0002 N-3: allocated by a per-TwinNet monotone counter INSIDE the same
  // transaction that commits the state mutation it describes.
  uint64 net_seq = 9;

  // ADR-0008 N-4. REQUIRED on every mutating C1 request classified CEREMONY in
  // ADR-0008 §11.3. Client-generated, >= 128 bits of randomness, scoped by the
  // server to the authenticated DeviceIdentity.
  //
  // An idempotency key is NOT a capability (ADR-0008 §7.3): it confers no
  // authorization, and dedup lookup is scoped to the caller so one device
  // cannot probe or replay another's outcomes by guessing keys.
  bytes idempotency_key = 10;

  Auth auth = 11;
}

// ---------------------------------------------------------------------------
// 6. Conditional-write precondition
// ---------------------------------------------------------------------------

// ADR-0008 N-2: every mutating request is conditional on the version the caller
// believes it is updating; creation is conditional on non-existence.
//
// This is what closes the dedup-window expiry cliff (ADR-0008 N-6): a duplicate
// arriving after the 24 h window is evaluated against the precondition and
// therefore FAILS rather than re-executing.
message VersionPrecondition {
  oneof precondition {
    // The object MUST currently be at exactly this version.
    uint64 if_version = 1;
    // The object MUST NOT exist. Used for creation.
    bool if_absent = 2;
  }
}
