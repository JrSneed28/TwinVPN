name: T1 — rust

# ===========================================================================
# TIER MAPPING — docs/testing-strategy.md §6.1 and §6.2.
# ===========================================================================
# This workflow is TIER 1 and nothing else. T1 is defined by WHEN IT RUNS and
# WHAT IT BLOCKS: every push to a pull request and every commit on main, budget
# <= 15 MIN TO FIRST VERDICT with a HARD FAIL AT 25 MIN, blocking MERGE, on
# ephemeral runners with no lab and no real hardware.
#
# §6.2 lists T1's contents: levels 1 (unit), 2 (component), 3 (protocol/golden
# vectors), 4 (contract), 14-short (property), plus the domain-separation
# tripwire, the §3.5 L-3 lint, the redaction lint, and the ADR-0002 §11.8
# step-3 dependency-graph assertion. Levels 1, 2 and 14-short arrive here as
# `cargo test`; levels 3 and 4 are the contract gate in contracts.yml; the
# lints are the `arch-lint` job below.
#
# RULE C-1 IS BINDING: "when a tier exceeds its budget, the response is to move
# work down a tier or to parallelize it - NEVER to raise the budget silently.
# Raising a budget is a reviewed change to this table." The 25-minute
# `timeout-minutes` here is that hard fail, not a target.
#
# ===========================================================================
# WHAT IS NOT HERE, AND WHERE IT LIVES
# ===========================================================================
# ADR-0018 BM-3: Windows cannot be cross-built from Linux (the MSVC ABI is
# required for WFP, IP Helper and Authenticode) and macOS/iOS cannot be
# cross-built at all (Xcode licensing). BM-3 says T1 "fans the matrix across a
# Linux, a Windows and a macOS runner in parallel to stay inside the <= 15 min
# budget". Those two runners do not exist for this wave -
# docs/implementation/ownership.md §5 defers those shells to wave 2 with the
# reason stated - so this workflow covers the LINUX rows only and says so
# rather than implying the matrix is complete.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t1-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:

  # =========================================================================
  # Formatting. Cheapest possible verdict, so it runs alone and first.
  # =========================================================================
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: install pinned toolchain
        run: |
          # rust-toolchain.toml pins the exact version (ADR-0018 §11.3: "one
          # exact toolchain version ... advanced only by a reviewed commit that
          # re-runs the full §11.9 matrix"). `rustup show` materialises it.
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo fmt --version

      - name: fmt
        run: |
          for w in core services shells/linux lab; do
            echo "::group::fmt $w"
            (cd "$w" && cargo fmt --all -- --check)
            echo "::endgroup::"
          done

  # =========================================================================
  # Build, clippy and test — one job per workspace, in parallel.
  #
  # ADR-0018 §11.12 / ownership.md §1: four SEPARATE cargo workspaces, on
  # purpose, "so that no domain silently acquires another's dependency graph".
  # Splitting the CI matrix the same way means a failure names its workspace,
  # and a workspace's build time is its own domain's problem rather than
  # everyone's.
  # =========================================================================
  workspace:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    timeout-minutes: 25          # docs/testing-strategy.md §6.1: hard fail at 25
    strategy:
      fail-fast: false           # V7-adjacent: see every failing workspace at once
      matrix:
        workspace: [core, services, shells/linux, lab]
    steps:
      - uses: actions/checkout@v4

      - name: install pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo clippy --version

      # ------------------------------------------------------------------
      # NATIVE BUILD DEPENDENCIES — the thing that breaks first if a runner
      # image is trimmed.
      #
      # `rendezvous` and `presence` terminate TLS 1.3 with mutual RFC 7250
      # raw-public-key authentication, so `rustls` links `aws-lc-rs`, whose
      # `aws-lc-sys` build script prefers a CMake build of the C sources. It
      # has a fallback path and currently compiles on a host with no `cmake`
      # at all — but that is a property of this version's build script, not a
      # guarantee, and it is silent when it changes: the failure appears as a
      # C build error deep in a dependency, not as a missing-tool message.
      #
      # So the tool is installed explicitly rather than relied upon. `ubuntu-latest`
      # ships it today; naming it here means a trimmed image fails on THIS
      # line, with this comment next to it, instead of 200 lines into a
      # compile log.
      # ------------------------------------------------------------------
      - name: native build dependencies (aws-lc-sys)
        run: |
          if ! command -v cmake >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq cmake
          fi
          cmake --version | head -1

      # ------------------------------------------------------------------
      # CACHING, AND WHY THE KEY LOOKS LIKE THIS.
      #
      # "A cache key that can serve a stale toolchain is worse than no cache."
      # A stale cache does not fail loudly; it produces a GREEN BUILD OF THE
      # WRONG THING, which is the single worst outcome a CI cache can have.
      #
      # The key therefore binds every input that can change what the cache
      # contains:
      #
      #   runner.os / runner.arch  - artifacts are not portable across either
      #   rust-toolchain.toml      - ADR-0018 §11.3's exact pin. A toolchain
      #                              bump MUST invalidate every artifact, and
      #                              this is the file that records it
      #   <workspace>/Cargo.lock   - DP-1's committed lockfile. A dependency
      #                              change must not reuse the old build
      #   <workspace>/Cargo.toml   - feature and profile changes
      #   this workflow file       - a flag change (RUSTFLAGS, profile) alters
      #                              the artifacts and nothing else would catch
      #                              it
      #
      # THERE IS DELIBERATELY NO `restore-keys` PREFIX FALLBACK. A prefix
      # fallback is exactly the mechanism that serves a cache built with a
      # different toolchain or lockfile: it is what makes a cache "merely
      # fast" instead of correct. A miss here costs a cold build; a wrong hit
      # costs a false green.
      # ------------------------------------------------------------------
      - name: cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ matrix.workspace }}/target
          key: >-
            twinvpn-cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.workspace }}-${{
            hashFiles('rust-toolchain.toml') }}-${{
            hashFiles(format('{0}/Cargo.lock', matrix.workspace)) }}-${{
            hashFiles(format('{0}/Cargo.toml', matrix.workspace)) }}-${{
            hashFiles('.github/workflows/rust-t1.yml') }}

      # `--locked` refuses to move the lockfile. ADR-0018 DP-1 commits one
      # lockfile per workspace and forbids unbounded version ranges; a CI run
      # that silently updated it would make the lockfile decorative.
      - name: build
        run: cd "${{ matrix.workspace }}" && cargo build --locked --workspace --all-targets

      - name: clippy
        run: cd "${{ matrix.workspace }}" && cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: test
        run: cd "${{ matrix.workspace }}" && cargo test --locked --workspace

  # =========================================================================
  # The Swift shells are compiled by NOTHING, and that used to include CI.
  #
  # `shells/ios` and `shells/macos` import NetworkExtension, SystemExtensions,
  # SwiftUI, Security and Network, so a Linux Swift cannot TYPE-CHECK them and
  # will not until a Darwin SDK is present -- which for shells/macos means Apple
  # hardware, because the SDK licence confines it there (ADR-0018 BM-3, and
  # ownership.md 9.2).
  #
  # What a Linux Swift CAN do is PARSE them, and the difference between "nothing
  # checks this" and "a compiler checks its syntax" is not rhetorical: wiring
  # this lane found seven invalid string-literal line continuations in
  # shells/ios/TwinVPNTests that had reached main unnoticed.
  #
  # The claim this job makes is exactly "the Swift sources parse under the
  # pinned compiler", and `make swift-parse` is the one definition of it --
  # `make cross-check` calls the same target locally.
  # =========================================================================
  swift-parse:
    name: swift-parse (shells/ios, shells/macos -- SYNTAX ONLY)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: swift:6.1.2
    steps:
      - uses: actions/checkout@v4

      - name: parse the Swift shells
        id: parse
        run: make swift-parse

      - name: explain the failure
        if: failure() && steps.parse.outcome == 'failure'
        run: |
          echo "::error title=Swift sources do not parse::A file under shells/ios or shells/macos is not syntactically valid Swift 6.1.2. Owner: the shell's platform team."
          echo "This job proves SYNTAX ONLY. It does not type-check, does not link,"
          echo "and says nothing about whether the shell works -- see ownership.md 9.2."

  # =========================================================================
  # ADR-0018 T1 ARCHITECTURAL LINTS.
  #
  # STATUS: GREEN. core-foundation has landed core/xtask and all four checks
  # pass. This job was written to be RED before that happened, deliberately -
  # a real, named, blocking job rather than a conditional skip - and it stays
  # written that way, because:
  #
  #   - ADR-0018 CD-3 says the deny-list "IS THE ACTUAL MECHANISM" for the
  #     three-clock rule. A mechanism that is skipped is not a mechanism.
  #   - docs/testing-strategy.md B-19 BLOCKS A RELEASE when "the ADR-0002
  #     §11.8 dependency-graph assertion [is] absent OR DISABLED", and adds
  #     that "P15 passing at T3 does not substitute" - so I5 is undischarged
  #     with only one of the two.
  #   - ownership.md §6 rule 14 says report an unresolved conflict rather than
  #     resolving it locally. A `continue-on-error: true` here would resolve it
  #     locally, by pretending.
  #
  # A skipped check reads as green on the PR page. A red one that names its
  # owner and its ADR gets fixed.
  # =========================================================================
  arch-lint:
    name: arch-lint (ADR-0018 CD-3 / CD-I2 / CD-I5 / CB-3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            core/target
          key: >-
            twinvpn-cargo-${{ runner.os }}-${{ runner.arch }}-archlint-${{
            hashFiles('rust-toolchain.toml') }}-${{
            hashFiles('core/Cargo.lock') }}-${{
            hashFiles('core/Cargo.toml') }}-${{
            hashFiles('.github/workflows/rust-t1.yml') }}

      - name: run the architectural lints
        id: lints
        working-directory: core
        run: cargo run --locked -q -p xtask -- lint

      # A failure here must say WHOSE it is and WHICH ADR clause it discharges,
      # or it becomes a red square people learn to ignore.
      - name: explain the failure
        if: failure() && steps.lints.outcome == 'failure'
        run: |
          echo "::error title=ADR-0018 T1 architectural lints::core/xtask lint failed or is not implemented. Owner: core-foundation."
          echo "The four checks core/xtask owes (ADR-0018 §11.7, §11.8):"
          echo ""
          echo "  CD-3   deny SystemTime::now, Instant::now, getrandom, thread-local RNG"
          echo "         constructors, the runtime's time module and chrono now-constructors"
          echo "         EVERYWHERE outside twinvpn-env. CD-1 defines three NON-INTERCHANGEABLE"
          echo "         clock types and CD-3 says this deny-list 'is the actual mechanism'."
          echo "  CD-I2  only twinvpn-crypto may declare a cryptographic dependency."
          echo "  CD-I5  no data-plane crate may reach twinvpn-cp-client, directly or"
          echo "         transitively, and the reverse edge is equally denied. Only"
          echo "         twinvpn-core may name both. This is the artifact ADR-0002 §11.8"
          echo "         step 3 requires and docs/testing-strategy.md B-19 blocks a release"
          echo "         without - 'P15 passing at T3 does not substitute'."
          echo "  CB-3   #[cfg(target_os = ...)] outside twinvpn-platform-*."
          echo ""
          echo "This job is deliberately NOT skipped and NOT continue-on-error. A skipped"
          echo "check reads as green on the PR page; B-19 says I5 is undischarged while"
          echo "this check is 'absent OR DISABLED'."
          exit 1

  # =========================================================================
  # CROSS-TARGET COMPILE PROOF -- the four targets nothing else in this file
  # touches.
  #
  # G-16: `make cross-check` was run by NOTHING BUT A HUMAN TYPING IT, so every
  # claim this repository makes about Windows, macOS, iOS and Android compiling
  # at all rested on someone remembering a command. This job is that command,
  # on every pull request and every commit on main.
  #
  # `make gate` is deliberately NOT where this went. cross-check needs four
  # rustup targets a fresh clone does not have, so folding it into the gate
  # would fail every fresh clone -- which is why it was split out in the first
  # place. It stays split out; CI installs the targets instead.
  #
  # ONE DEFINITION, TWO CALLERS -- the W-20 / X-4 / R-14 rule the `swift-parse`
  # target already follows. Every lane lives in the Makefile and nowhere else;
  # this job adds only the environment the recipe's own guards look for, and
  # copies no lane into YAML where the two could drift.
  # =========================================================================
  cross-check:
    name: cross-check (win/mac/ios/android -- COMPILE ONLY)
    runs-on: ubuntu-latest
    timeout-minutes: 25          # docs/testing-strategy.md §6.1: hard fail at 25
    steps:
      - uses: actions/checkout@v4

      - name: install pinned toolchain and the four cross targets
        run: |
          # rust-toolchain.toml pins the version and lists `clippy`, but lists
          # no targets, so the four the recipe compiles for are added here --
          # against that same pinned toolchain, because `rustup target add`
          # follows the active one.
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy
          rustup target add \
            x86_64-pc-windows-msvc \
            aarch64-apple-darwin \
            aarch64-apple-ios \
            aarch64-linux-android
          rustc --version
          cargo clippy --version
          rustup target list --installed

      # ------------------------------------------------------------------
      # THE ANDROID `full` LANE'S C TOOLCHAIN, and why it is named here.
      #
      # That lane compiles `ring` for bionic with `CC=clang` and `AR=llvm-ar`
      # -- LITERAL PROGRAM NAMES handed to cc-rs. On the dev host both resolve
      # only because build/toolchain/env.sh puts the pinned Swift toolchain's
      # LLVM on PATH, and that toolchain does not exist on this runner.
      # Ubuntu's `llvm` metapackage is what provides the UNVERSIONED
      # /usr/bin/llvm-ar (a symlink to llvm-ar-<N>); the versioned name alone
      # would not satisfy cc-rs, which is handed the string `llvm-ar`.
      #
      # The Makefile lane is ALSO guarded on both and degrades to
      # "NOT CHECKED (no llvm-ar)". Installing them here is what stops this job
      # taking that branch: a green run has to mean the lane RAN, not that it
      # was skipped. If the log ever shows that line, this step regressed.
      # ------------------------------------------------------------------
      - name: android C toolchain (ring for aarch64-linux-android)
        run: |
          if ! command -v llvm-ar >/dev/null || ! command -v clang >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq llvm clang
          fi
          # Asserted with `command -v`, NOT with `llvm-ar --version | head -1`.
          # A step's default shell here is `bash -e`, with no `pipefail`: a
          # missing tool at the head of a pipe leaves the pipeline's status at
          # `head`'s zero, so the version print alone would pass silently and
          # the Makefile guard would then quietly report NOT CHECKED.
          for t in llvm-ar clang; do
            command -v "$t" >/dev/null || {
              echo "::error title=android C toolchain::$t is still missing after 'apt-get install llvm clang'. This is an ENVIRONMENT failure in this job, not a code failure - without it the Makefile lane reports NOT CHECKED and the job goes green on a lane that never ran."
              exit 1
            }
          done
          llvm-ar --version | head -1
          clang --version | head -1

      # The `workspace` job above explains this key at length; the same rules
      # apply, including NO `restore-keys` prefix fallback. What differs is the
      # breadth: this job compiles four workspaces, so the key binds all four
      # lockfiles and manifests rather than one.
      - name: cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            core/target
            shells/windows/target
            shells/macos/target
            shells/android/jni/target
          key: >-
            twinvpn-cargo-${{ runner.os }}-${{ runner.arch }}-crosscheck-${{
            hashFiles('rust-toolchain.toml') }}-${{
            hashFiles('core/Cargo.lock', 'shells/windows/Cargo.lock',
            'shells/macos/Cargo.lock', 'shells/android/jni/Cargo.lock') }}-${{
            hashFiles('core/Cargo.toml', 'shells/windows/Cargo.toml',
            'shells/macos/Cargo.toml', 'shells/android/jni/Cargo.toml') }}-${{
            hashFiles('.github/workflows/rust-t1.yml') }}

      - name: cross-check
        id: cross
        run: make cross-check

      # A failure here must say WHOSE it is, and a PASS must not be readable as
      # more than it is. Both belong in this step.
      - name: explain the failure
        if: failure() && steps.cross.outcome == 'failure'
        run: |
          echo "::error title=cross-check (compile-only proof)::A non-host target stopped compiling. Owner: the crate's platform team - ownership.md 9.1 (wave 2) / 10.1 (wave 3)."
          echo "WHAT THIS JOB PROVES, at exactly its strength and no further:"
          echo ""
          echo "  COMPILE ONLY. NOTHING IS LINKED AND NOTHING IS RUN. There is no"
          echo "  MSVC linker, no Darwin SDK, no WFP engine and no NetworkExtension"
          echo "  host on this runner. A green square here is a compile proof, never"
          echo "  a behaviour proof, and must not be reported as one."
          echo ""
          echo "  PARTIAL BY DESIGN. Several lanes print NOT CHECKED and still exit"
          echo "  0. The recipe's closing banner in the log above names the coverage"
          echo "  THIS RUN actually had; read it rather than the job's colour."
          echo "    windows twinvpnsvc core-host  NOT CHECKED on any GitHub runner:"
          echo "                                  it needs an MSVC header tree under"
          echo "                                  /mnt/c, which no runner has."
          echo "    macos twinvpn-bridge full     NOT CHECKED anywhere: ring needs"
          echo "                                  <TargetConditionals.h> and cc-rs"
          echo "                                  needs xcrun. Apple SDK, Apple"
          echo "                                  hardware. G-4 / G-6 / G-7."
          echo "    Swift                         NOT CHECKED here - no swiftc in"
          echo "                                  this image. The swift-parse job"
          echo "                                  covers it in a pinned container."
          echo "    Kotlin                        not compiled by this target at"
          echo "                                  all. ownership.md 9.2."
          echo "  The android full lane IS expected to RUN here - this job installs"
          echo "  llvm and clang for it. 'NOT CHECKED (no llvm-ar)' in the log is an"
          echo "  ENVIRONMENT regression in this job, not a code failure."
          echo ""
          echo "This job is deliberately NOT continue-on-error. A skipped check reads"
          echo "as green on the PR page, and ownership.md 6 rule 14 says a"
          echo "continue-on-error here would resolve a conflict by pretending."
          exit 1
