name: T1 — supply chain

# ===========================================================================
# WHY THIS IS T1 AND NOT NIGHTLY.
# ===========================================================================
# ADR-0018 §11.11 DP-6 is explicit: "Advisory, licence and duplicate-version
# checks run at T1." That is a decision, not a preference, and DP-9 gives the
# reason: "A malicious dependency or compromised pipeline defeats EVERY
# INVARIANT SIMULTANEOUSLY." A check that catches a hostile dependency the
# night after it merged has caught it in the wrong place.
#
# DP-9 also records that "the threat model currently has NO ADVERSARY OR THREAT
# ROW to bind [these mechanisms] to", and §11.16 (j) asks for one. That gap is
# still open; this workflow implements the mechanism DP-1..DP-8 specify and
# does not pretend the threat-model row exists.
#
# ===========================================================================
# WHAT DP-6 ASKS FOR, AND WHAT IS NOT AUTOMATABLE HERE
# ===========================================================================
# DP-6's dependency LEDGER records, per direct dependency: why it is present,
# who reviewed the last bump, whether it reaches a shipped artifact or only dev
# tooling, whether it contains `unsafe`, and whether it has a published audit.
# Four of those five are human judgements and no tool produces them. This
# workflow therefore runs the three MECHANICAL checks DP-6 names - advisory,
# licence, duplicate-version - and the DP-4 `unsafe` count, and leaves the
# ledger to review rather than faking it with a generated file.

on:
  push:
    # The repository's DEFAULT branch is fix/wave1-final-review-register and
    # there are no pull requests, so a filter naming only main and master
    # meant this workflow had never run: GitHub had not even registered it.
    branches: [main, master, fix/wave1-final-review-register]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t1-supply-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:

  advisories:
    name: cargo-deny (advisories, licences, duplicate versions)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # All EIGHT cargo workspaces in the tree, not the five the Makefile's
        # `WORKSPACES` names. Two separate omissions were corrected here:
        #
        # `tests` was missing and that was an oversight, not a policy — `lab` is
        # in the list and is just as unshipped, so "never ships" was not the
        # criterion being applied, and `tests` had two real findings of its own
        # the first time it was run through this gate.
        #
        # `shells/windows`, `shells/macos` and `shells/android/jni` are missing
        # from `WORKSPACES` for a good reason that does NOT apply here:
        # `ownership.md` §1 excludes them because neither compiles for
        # `x86_64-unknown-linux-gnu`, and that variable drives the host build,
        # test and clippy passes. **cargo-deny compiles nothing** — it reads the
        # manifests and the lockfile — so the reason to exclude them from the
        # host gate is not a reason to exclude them from the supply-chain gate.
        # They carry their own third-party graphs and their own lockfiles, and
        # leaving them out meant advisory, licence and wildcard drift in three
        # shipped artifacts with no CI signal at all. All three pass today.
        workspace:
          - core
          - services
          - shells/linux
          - shells/windows
          - shells/macos
          - shells/android/jni
          - lab
          - tests
    steps:
      - uses: actions/checkout@v4

      - name: install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # Pinned. An unpinned auditing tool is an auditing tool whose behaviour
      # can change without a diff - the same argument DP-2 makes about
      # source-vendoring, applied to the auditor itself.
      #
      # 0.16.4 -> 0.20.2, and the version is repeated in the cache key on
      # purpose: a stale cache that serves the OLD binary under a NEW pin is an
      # auditor that lies about which auditor it is.
      #
      # WHY 0.20.2. 0.16.4 emitted `bug[unresolved-workspace-dependency]` on
      # seven of `twinvpn-ffi`'s `{ workspace = true }` dependencies - a
      # cargo-deny defect, self-labelled `bug`, meaning those edges were never
      # actually audited. 0.20.2 resolves all of them. It also parses the
      # current advisory database, including the ~59 entries now carrying
      # CVSS 4.0 vectors, which is the property this pin has to keep having:
      # the advisory DB moves whether or not this repository does, so the
      # auditor pin is the one pin that has to be advanced deliberately rather
      # than left alone. MSRV 1.88 < the 1.90.0 in rust-toolchain.toml.
      #
      # The `[advisories] version`/`[licenses] version` = 2 schema in
      # build/deny.toml is unchanged and is still what 0.20.2 wants; the run
      # produces no deprecation diagnostics. Note that `--config` is a GLOBAL
      # option: it goes before `check`, not after it.
      - name: cache cargo-deny
        id: cache-deny
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}-${{ runner.arch }}

      - name: install cargo-deny
        if: steps.cache-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: check
        working-directory: ${{ matrix.workspace }}
        run: cargo deny --config "$GITHUB_WORKSPACE/build/deny.toml" check advisories licenses bans sources

  unsafe-count:
    name: DP-4 unsafe-block census
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------
      # DP-4: `#![forbid(unsafe_code)]` everywhere except an enumerated
      # allowlist - twinvpn-ffi (the boundary), twinvpn-platform-* (syscalls),
      # and twinvpn-crypto's locked-memory allocator (mlock/VirtualLock,
      # MADV_DONTDUMP, core dumps disabled, required by ADR-0001 L-STORE).
      # Every block carries a `// SAFETY:` justification.
      #
      # "CI COUNTS BLOCKS; A NET INCREASE REQUIRES A SECURITY-OWNER REVIEWER."
      # This job produces the count and the diff. It does not - and must not -
      # decide whether the increase is acceptable: that is a named human's job
      # under ADR-0018 DP-4, and a bot that approved it would be the review.
      #
      # COUNTS BLOCKS is the operative phrase, and the first version of this
      # step did not. It grepped for the WORD `unsafe`, so its 865 "occurrences"
      # were 628 blocks, 104 `unsafe fn` / `unsafe impl` / `unsafe extern`
      # DECLARATIONS - which DP-4 does not ask a `// SAFETY:` of, and which
      # clippy's own `missing_safety_doc` already governs - and 127 lines of
      # prose and string literal that merely mention the word. It then looked
      # for `SAFETY:` in a FIXED five-line window, which cannot see past this
      # repository's own multi-line justifications. The two errors compounded:
      # the first run to reach CI raised 230 annotations, of which 115 were
      # comments, 86 were declarations, and the rest were blocks whose
      # justification was real and simply too long to fit the window.
      #
      # The rule below counts blocks, blanks comments and literals before
      # looking, and searches upward to the first blank line or completed
      # statement instead of a fixed distance. It is pinned by a fixture that
      # runs before the tree does, because a text rule with no failing case is
      # a green square that means nothing.
      # ------------------------------------------------------------------
      - name: census
        run: |
          set -euo pipefail

          tmp="${RUNNER_TEMP:-$(mktemp -d)}"
          census="$tmp/dp4-census.py"

          # The rule, in one place. DP-4 asks for a justification on every unsafe BLOCK,
          # so this counts blocks -- not the word `unsafe`, which also appears in
          # `unsafe fn` and `unsafe impl` declarations, in prose comments, and inside
          # string literals. Comments and literals are blanked before the search, so a
          # file that merely TALKS about `unsafe { ... }` is not a finding.
          cat > "$census" <<'PY'
          """ADR-0018 DP-4: census of `unsafe` BLOCKS and their `// SAFETY:` justifications."""
          import re
          import sys
          from pathlib import Path

          RAW = re.compile(r'(?:b|c)?r(#*)"')
          CHAR = re.compile(r"'(?:\\.|[^\\'])'")
          BLOCK = re.compile(r"\bunsafe\s*\{")


          def scrub(src):
              """Blank every comment, string and char literal, preserving offsets."""
              out = list(src)
              i, n = 0, len(src)

              def blank(a, b):
                  for k in range(a, b):
                      if out[k] != "\n":
                          out[k] = " "

              while i < n:
                  if src.startswith("//", i):
                      j = src.find("\n", i)
                      j = n if j < 0 else j
                      blank(i, j)
                      i = j
                  elif src.startswith("/*", i):
                      depth, j = 1, i + 2
                      while j < n and depth:
                          if src.startswith("/*", j):
                              depth, j = depth + 1, j + 2
                          elif src.startswith("*/", j):
                              depth, j = depth - 1, j + 2
                          else:
                              j += 1
                      blank(i, j)
                      i = j
                  elif (m := RAW.match(src, i)) is not None:
                      close = '"' + m.group(1)
                      j = src.find(close, m.end())
                      j = n if j < 0 else j + len(close)
                      blank(i, j)
                      i = j
                  elif src[i] == '"':
                      j = i + 1
                      while j < n:
                          if src[j] == "\\":
                              j += 2
                          elif src[j] == '"':
                              j += 1
                              break
                          else:
                              j += 1
                      blank(i, j)
                      i = j
                  elif src[i] == "'" and (m := CHAR.match(src, i)) is not None:
                      blank(i, m.end())
                      i = m.end()
                  else:
                      i += 1
              return "".join(out)


          def justified(raw, bare, at):
              """True if `SAFETY:` is attached to the block on 0-based line `at`.

              Attached means: on the block's own line, or on a line above it, searching
              upwards and stopping at the first blank line or completed statement. The
              stop is what keeps the rule honest -- a `SAFETY:` written for some OTHER
              finished statement does not justify this block, however few lines away it
              is -- and searching to that stop rather than a fixed number of lines is
              what lets a justification be as long as it needs to be.
              """
              for k in range(at, -1, -1):
                  if "SAFETY:" in raw[k]:
                      return True
                  if k < at and (not raw[k].strip() or bare[k].rstrip().endswith(";")):
                      return False
              return False


          def census(roots):
              for root in roots:
                  # A root that is not there yields no blocks and no complaint, which is
                  # the one way this job could report a green zero while checking nothing.
                  if not Path(root).is_dir():
                      sys.exit(f"dp4-census: {root} is not a directory")
                  for path in sorted(Path(root).rglob("*.rs")):
                      src = path.read_text(encoding="utf-8", errors="replace")
                      code = scrub(src)
                      raw, bare = src.splitlines(), code.splitlines()
                      for m in BLOCK.finditer(code):
                          line = code.count("\n", 0, m.start()) + 1
                          yield str(path), line, justified(raw, bare, line - 1)


          for path, line, ok in census(sys.argv[1:]):
              print(f"{path}:{line}:{'OK' if ok else 'MISSING'}")
          PY

          # ------------------------------------------------------------------
          # SELF-CHECK, and it runs BEFORE the tree does.
          #
          # A census is only worth its verdict if the rule behind it can neither widen
          # into noise nor narrow into a green square that means nothing. The previous
          # rule did both at once -- it counted 865 "occurrences" of which 127 were
          # prose and 104 were declarations, and its five-line lookback could not see
          # past this repository's own multi-line justifications -- and nothing noticed,
          # because a text rule with no fixture has no failing case.
          #
          # So the fixture states both halves as code: every construct that must NOT be
          # a finding, and every one that must be. The expected output is exact. Adding
          # a case is a deliberate edit to both lists; drifting is not possible quietly.
          # ------------------------------------------------------------------
          fixture="$tmp/dp4-fixture"
          rm -rf "$fixture"
          mkdir -p "$fixture"
          cat > "$fixture/cases.rs" <<'RS'
          #![forbid(unsafe_code)]
          // Not findings: the word `unsafe` in prose, including `unsafe { }` written out
          // in a comment the way this line writes it, and every DECLARATION form.
          /// Doc comments say `unsafe { }` too.
          pub unsafe fn declared() {}
          unsafe impl Send for Thing {}
          unsafe trait Marker {}
          unsafe extern "C" {
              fn imported();
          }
          const TEXT: &str = "unsafe { still_not_a_block() }";
          const RAWTEXT: &str = r#"unsafe { nor_this() }"#;

          fn justified_directly() {
              // SAFETY: the comment sits against the block.
              unsafe { imported() }
          }

          fn justified_at_length() {
              // SAFETY: a justification worth reading is longer than five lines, which
              // is what the old window could see. This one is deliberately longer than
              // that so the fixture fails if anyone reintroduces a fixed lookback:
              // line four,
              // line five,
              // line six.
              let _ = unsafe { imported() };
          }

          fn justified_once_for_a_list() {
              let _ = [
                  // SAFETY: one justification, and the whole list is its subject.
                  unsafe { imported() },
                  unsafe { imported() },
              ];
          }

          fn justified_on_its_own_line() {
              unsafe { imported() } // SAFETY: trailing is still attached.
          }

          fn borrowed_from_a_finished_statement() {
              // SAFETY: this justifies the statement below it and nothing after it.
              let _ = 1;
              let _ = unsafe { imported() };
          }

          fn unjustified() {
              unsafe { imported() }
          }
          RS

          expected="$fixture/cases.rs:16:OK
          $fixture/cases.rs:26:OK
          $fixture/cases.rs:32:OK
          $fixture/cases.rs:33:OK
          $fixture/cases.rs:38:OK
          $fixture/cases.rs:44:MISSING
          $fixture/cases.rs:48:MISSING"

          actual="$(python3 "$census" "$fixture")"
          if [ "$actual" != "$expected" ]; then
            echo "::error title=DP-4 census self-check::The census rule no longer agrees with its own fixture. It has widened or narrowed; fix the rule or amend the fixture deliberately."
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          echo "self-check OK: the rule counts blocks, ignores declarations, prose and literals, and still fires on an unjustified block"

          # ------------------------------------------------------------------
          # The tree.
          # ------------------------------------------------------------------
          python3 "$census" core services shells lab > "$tmp/head.txt"
          head_count="$(wc -l < "$tmp/head.txt" | tr -d ' ')"
          echo "unsafe blocks on HEAD: ${head_count}"

          {
            echo "### DP-4 unsafe census"
            echo ""
            echo "\`unsafe\` **blocks** on HEAD: **${head_count}**"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

          missing=0
          while IFS= read -r hit; do
            file="${hit%%:*}"
            rest="${hit#*:}"
            line="${rest%%:*}"
            echo "::error file=${file},line=${line}::unsafe block without a // SAFETY: justification (ADR-0018 DP-4)"
            missing=$(( missing + 1 ))
          done < <(grep ':MISSING$' "$tmp/head.txt" || true)

          if [ "${missing}" -gt 0 ]; then
            echo "${missing} unsafe block(s) lack a // SAFETY: justification"
            exit 1
          fi

          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}"
            # The base ref is counted BY THE SAME SCRIPT, because a count produced by a
            # different rule cannot be subtracted from this one. `git archive` gives the
            # four roots as a tree without touching the worktree and without a checkout
            # to undo.
            base="$tmp/base"
            rm -rf "$base"
            mkdir -p "$base"
            git archive "origin/${GITHUB_BASE_REF}" core services shells lab | tar -x -C "$base"
            base_count="$(python3 "$census" "$base/core" "$base/services" "$base/shells" "$base/lab" | wc -l | tr -d ' ')"
            echo "unsafe blocks on ${GITHUB_BASE_REF}: ${base_count}"
            if [ "${head_count}" -gt "${base_count}" ]; then
              echo "::warning title=DP-4 net increase in unsafe::${base_count} -> ${head_count}. ADR-0018 DP-4 requires a SECURITY-owner reviewer for a net increase. This job reports; it does not approve."
              {
                echo ""
                echo "> **NET INCREASE** ${base_count} → ${head_count}. ADR-0018 DP-4 requires a SECURITY-owner reviewer."
              } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            fi
          fi

  base-image-pins:
    name: DP-2 base images pinned by digest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ------------------------------------------------------------------
      # DP-2 pins dependencies BY DIGEST, "not copied into the tree", because
      # source-vendoring "makes a dependency bump invisible in the diff, which
      # is exactly the review a supply-chain policy exists to force". A
      # container TAG has the same defect: `rust:1.90.0` is a mutable pointer.
      #
      # This step reports the gap rather than hiding it. It is a WARNING while
      # infra/docker/base-images.lock still carries tag-only entries; set
      # TWINVPN_REQUIRE_IMAGE_DIGESTS=1 to make it a failure once
      # build/verify/pin-base-images.sh has been run.
      # ------------------------------------------------------------------
      - name: check pins
        run: |
          set +e
          python3 build/verify/check-budgets.py --check-image-pins
          rc=$?
          set -e
          if [ "$rc" = "1" ]; then exit 1; fi
          if [ "$rc" = "2" ]; then
            echo "::warning title=DP-2 base images are tag-pinned only::Run build/verify/pin-base-images.sh on a host with registry access, then set TWINVPN_REQUIRE_IMAGE_DIGESTS=1 to gate."
          fi
