name: contract gate

# The Phase 2 CI contract gate.
#
# Parallel implementation MUST NOT merge if:
#   - schemas do not compile
#   - generated bindings are stale
#   - contract tests fail
#   - schema lint fails
#   - a prohibited breaking change is detected
#   - contract fixtures disagree across languages
#
# The contract package is an UPSTREAM DEPENDENCY of every implementation agent,
# so this workflow runs on every change to the repository, not only on changes
# under contracts/: a change elsewhere that assumes a contract shape must still
# be checked against the frozen contract.
#
# ---------------------------------------------------------------------------
# TIER MAPPING (added by `infrastructure`; no step below was changed).
# ---------------------------------------------------------------------------
# This workflow is TIER 1 in docs/testing-strategy.md §6.1's sense: it runs on
# every PR push and every commit on main, it blocks MERGE, and it needs no lab
# and no real hardware. Its 20-minute `timeout-minutes` sits inside T1's hard
# fail at 25 min.
#
# Within §6.2's T1 contents it supplies LEVELS 3 AND 4:
#
#   level 3  protocol / golden vectors  -> `make test-contracts`
#   level 4  contract: schema diff, producer/consumer, `reason_code` registry
#            append-only + completeness
#            -> `make contracts`, the staleness check, both breaking-change
#               checks, `check_registry_append_only.py`, `make verify-bindings`
#
# It also carries two of §6.5's release blockers as merge blockers, which is
# stronger than the tier table requires and is correct: B-4 (a non-append-only
# `reason_code` registry diff, or a registered code missing a required
# attribute) and B-5 (a breaking schema diff without the ProtocolVersion bump
# ADR-0014 requires).
#
# The remaining T1 contents live in sibling workflows, so that a failure names
# its own domain: `rust-t1.yml` (levels 1, 2, 14-short and the ADR-0018
# architectural lints), `supply-chain-t1.yml` (ADR-0018 DP-6), and
# `infra-t1.yml` (the compose topology and the redaction lint §6.2 names).
#
# NOTHING IN THIS FILE WAS WEAKENED, REORDERED OR REMOVED. It is the contract
# freeze gate; extending it means adding a sibling lane, not editing this one.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The breaking-change check needs the merge base, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --- 1. pinned toolchains ------------------------------------------------
      - name: bootstrap
        run: make bootstrap

      # The four language toolchains needed to COMPILE the generated bindings.
      # Cached because they are large and pinned - a cache hit is exactly the
      # same toolchain, by construction.
      - name: cache language toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.rustup
            ~/.local/jdk
            ~/.local/kotlinc
            ~/.local/swift
            ~/.local/sysroot
            ~/.dotnet
          key: twinvpn-toolchains-${{ runner.os }}-${{ hashFiles('build/toolchain/*.sh') }}

      - name: install language toolchains
        run: make toolchains

      # --- 2. schemas compile and lint ---------------------------------------
      - name: lint
        run: make lint

      # --- 3. deterministic generation, and staleness --------------------------
      # `make contracts` regenerates in place. The freshness check then fails if
      # `git status` is dirty under contracts/gen, which means the committed
      # bindings did not match a fresh generation.
      - name: contracts
        run: make contracts

      - name: generated bindings are not stale
        run: |
          if [ -n "$(git status --porcelain -- contracts/gen)" ]; then
            echo "::error::Generated bindings are STALE. Run 'make contracts' and commit contracts/gen."
            git --no-pager diff --stat -- contracts/gen
            exit 1
          fi
          echo "generated bindings are current"

      # --- 4. breaking-change detection ---------------------------------------
      # Against the frozen baseline if one exists, and additionally against the
      # target branch on a pull request, so a break is caught even before the
      # first freeze.
      - name: breaking-change check (frozen baseline)
        run: make contracts-breaking

      - name: breaking-change check (against target branch)
        if: github.event_name == 'pull_request'
        run: |
          ./node_modules/.bin/buf breaking contracts \
            --against ".git#branch=origin/${{ github.base_ref }},subdir=contracts"

      # --- 5. registries are append-only --------------------------------------
      # A code or capability may be added or deprecated; it may never be renamed,
      # removed, or have its semantics changed once ACTIVE.
      - name: registries are append-only
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_registry_append_only.py "origin/${{ github.base_ref }}"

      # --- 6. the generated bindings COMPILE ----------------------------------
      # A byte-diff proves the bindings are current; only a compile proves they
      # are usable. ADR-0018 §11.12's "a schema change that a language binding
      # cannot express fails at merge" is a compile claim, not a diff claim.
      # CI=true makes a missing toolchain a FAILURE rather than a skip.
      - name: generated bindings compile
        env:
          CI: 'true'
        run: make verify-bindings

      # --- 7. contract tests, including cross-language fixture agreement ------
      - name: contract tests
        run: make test-contracts

      # --- 8. the freeze gate -------------------------------------------------
      - name: freeze gate
        run: python3 scripts/freeze_gate.py

      # --- 9. no production implementation has landed prematurely --------------
      - name: contract freeze is still in force
        run: python3 scripts/check_freeze_scope.py
