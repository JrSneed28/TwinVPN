name: First Implementation Wave — acceptance gate

# ===========================================================================
# WHAT THIS WORKFLOW IS
# ===========================================================================
# The First Implementation Wave does not pass on a reviewer's agreement. It
# passes when each of its blockers is closed by EXECUTABLE EVIDENCE, produced
# by a named job whose result a reader can go and look at.
#
# So every blocker gets its own visible job, and the four platforms are FOUR
# JOBS rather than one opaque matrix cell -- a single red platform must be
# nameable from the checks list without opening a log.
#
#   core-crypto            F-1  the crypto core is used by the real data path
#   pairing-mi             F-2  pairing exists in the shipped composition
#   mutation-proof         F-5  the mutation/proof obligations are executed --
#                               DEFERRED past Wave 1, still runs, no longer
#                               gates; see the block on `needs:` below
#   windows-link-run       Windows compiles, links, loads, invokes, transitions
#   macos-link-run         macOS   "
#   ios-link-run           iOS     "
#   android-link-run       Android "
#   linux-link-run         Linux, already PASSing, re-run only as regression
#
#   windows-killswitch     WINDOWS-WFP-KILLSWITCH, in a disposable nested guest
#                          on the hosted windows-2025 runner, oracle in-box
#   android-16k            ANDROID-16K-PAGE-SIZE, on Google's 16 KB emulator
#   ios-acceptance         IOS-FAILCLOSED-CONFIGURATION +
#                          IOS-PROFILE-REMOVAL-HONESTY, hosted simulator
#   macos-pf-anchor        MACOS-PF-BOOT-ANCHOR, hosted macos-26 as root
#   macos-signature        MACOS-PRODUCTION-SIGNATURE -- a DIFFERENT claim
#
#   Two criteria have NO EXECUTOR and no job: IOS-NE-FAIL-CLOSED (a packet
#   tunnel provider cannot run in the simulator; every device farm strips the
#   entitlement) and MACOS-SYSEXT-LIFECYCLE (activation needs Apple's
#   packet-tunnel-provider-systemextension grant and an approval a CI job
#   cannot give). Their rows read NOT-EXECUTED with that reason and count
#   against eligibility; see docs/implementation/remote-acceptance-
#   infrastructure.md.
#
#   first-wave-acceptance  the conjunction, computed from evidence
#
# `first-wave-acceptance` is the only job whose verdict means anything on its
# own. It RUNS on every path, including one where a job it needs went red, so
# that the report naming which rows are red always exists -- but it can only be
# GREEN when `build/acceptance/report.py` exits zero, and that re-derives each
# platform verdict from that platform's own machine-readable evidence rather
# than trusting the job that wrote it. A red platform job leaves no evidence or
# leaves failing evidence, and either way the row is not PASS.
#
# ===========================================================================
# WHAT A HOSTED LINK/RUN JOB CANNOT PROVE
# ===========================================================================
# A hosted link/run job proves compiling, linking, loading and invoking. It
# does not prove privileged platform behaviour: WFP arming on Windows, a real
# system extension on macOS, a real packet tunnel on iOS, 16 KiB page mapping
# on Android. Those are SEPARATE jobs with SEPARATE evidence files, and the
# separation is deliberate -- a simulator run must never stand in for one of
# them.
#
# ===========================================================================
# EVERY PLATFORM CRITERION IS IN THIS FILE, AND WAS NOT ALWAYS
# ===========================================================================
# The four privileged criteria used to live in
# `first-implementation-wave-privileged.yml`, ran on four PHYSICAL MACHINES,
# and were imported into this run with `gh run download --commit`. Two problems
# with that, and only one of them was about hardware:
#
#   * a cross-run import is a place where evidence from a different run can
#     arrive. The import step had to re-check each file's own commit precisely
#     because the mechanism could not guarantee whose evidence it had. It is
#     gone: every criterion runs here, and `actions/download-artifact` reads
#     this run and only this run.
#   * local or user-owned hardware is no longer an acceptable dependency, and
#     since 2026-09-02 neither is any self-hosted runner, cloud Mac, virtual
#     iPhone service, public oracle host or standing sentinel host. Every
#     criterion with an executor is a GitHub-hosted, ENVIRONMENT-ATTESTED probe
#     -- a nested Hyper-V guest on windows-2025 with the leak oracle and its
#     sentinel in-box, Google's 16 KB emulator image, the iOS simulator, a
#     root macos-26 runner -- and each carries an `environment` map that
#     `build/acceptance/report.py` checks BEFORE it reads any test result.
#
# AND THE EGRESS CLAIMS ARE ADJUDICATED OFF-DEVICE. A kill-switch criterion
# cannot be graded by the platform under test: a filter set that was never
# installed and an extension that died both leave the platform's own status API
# saying "protected" while packets leave. `lab/twinoracle` runs somewhere the
# device can only reach by emitting a packet that left it, and
# `first-wave-acceptance` fetches its verdict FROM THE ORACLE rather than from
# anything a platform job uploaded.
# ===========================================================================

on:
  pull_request:
  push:
    # The integration branch is this repository's DEFAULT branch right now, so
    # listing only main/master would mean no push to the branch under test ever
    # triggered this gate -- it would have run on workflow_dispatch alone and
    # looked configured while proving nothing on merge.
    branches: [main, master, 'fix/wave1-final-review-register']
  workflow_dispatch:
  # ONE NIGHTLY, DECIDING EVERY ROW.
  #
  # There used to be two: 05:00 for the privileged workflow and 07:00 here, two
  # hours later so this run could import the other's artifacts. The gap was
  # load-bearing and silent -- move either time and the join breaks with no
  # error, and a commit that moved in between produced a report with four
  # permanently NOT-EXECUTED rows.
  #
  # Every criterion is in this workflow now, so there is nothing to join and
  # nothing to schedule around.
  schedule:
    - cron: '0 5 * * *'

# Minimal token. Nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  # Cancel in progress, unconditionally.
  #
  # The previous form kept push runs -- 'a verdict on the integration branch is
  # not disposable' -- which is a fine principle and was the wrong mechanism:
  # combined with self-hosted jobs that queue for 24h it deadlocked the gate
  # against itself, and every superseded push run is in any case testing a
  # commit that a newer one already supersedes. The durable verdict is the
  # acceptance report committed at the tip, not a run of an overtaken commit.
  group: first-wave-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:

  # =========================================================================
  # F-1 -- the cryptographic core must be used by the real data path.
  #
  # Blocking. The tests this runs are written so that they FAIL IF THE WIRING
  # IS REMOVED: that is the property under test, not the crypto primitives,
  # which were already reviewed as sound.
  # =========================================================================
  core-crypto:
    name: core-crypto
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: toolchain versions
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
          uname -a

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: fwg-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}

      - name: make test-crypto-integration
        run: make test-crypto-integration

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-crypto-report
          path: |
            build/acceptance/*.json
            build/acceptance/*.md
          if-no-files-found: ignore

  # =========================================================================
  # F-2 -- pairing must exist in the shipped product.
  #
  # The point of this job is that it drives the SAME COMPOSITION the shipped
  # application uses. A test that calls `install_pairing_enrolment` directly
  # is explicitly not evidence here.
  # =========================================================================
  pairing-mi:
    name: pairing-mi
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: toolchain versions
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: fwg-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}

      - name: make test-pairing-integration
        run: make test-pairing-integration

  # =========================================================================
  # F-5 -- mutation/proof coverage.
  #
  # This job exists to publish NUMBERS. "Mutation tests pass" is not an
  # acceptable output and the gate script refuses to print it: the report
  # distinguishes killed / survived / timeout / unviable / missing / not-
  # executed, and a missing mutant is never counted as killed.
  # =========================================================================
  mutation-proof:
    name: mutation-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          # The mutant rig builds with `git worktree add` at an explicit
          # revision, so the full history must be present.
          fetch-depth: 0

      - name: toolchain versions
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: fwg-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}

      - name: make test-mutation
        run: make test-mutation

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: |
            build/proof/mutation-report.json
            build/proof/obligations.tsv
            build/proof/register.tsv
          if-no-files-found: error

  # =========================================================================
  # Linux -- already has executed PASS evidence.
  #
  # Re-run as a REGRESSION check only, because this wave changes shared-core
  # code that Linux links. It is not this wave's new evidence and is not
  # re-proved beyond that.
  # =========================================================================
  linux-link-run:
    name: linux-link-run
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: toolchain versions
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: fwg-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
      - name: make ci-linux
        run: make ci-linux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-linux
          path: build/ci/evidence/linux.json
          if-no-files-found: error

  # =========================================================================
  # WINDOWS -- hosted. Compile, link the real shared core, cross the
  # production FFI boundary, drive a lifecycle transition, shut down.
  # A compilation-only job is insufficient and `make ci-windows` fails if it
  # cannot record a transition.
  # =========================================================================
  windows-link-run:
    name: windows-link-run
    # PINNED. `windows-latest` moves between images, and an image move that
    # changed the MSVC toolset would change what this evidence is about with no
    # diff to point at.
    runs-on: windows-2025
    # A cold cargo build of the core plus the shell for MSVC is the long pole.
    # 90 minutes is a hard fail, not a target: docs/testing-strategy.md rule C-1
    # says a tier that exceeds its budget moves work down a tier, never raises
    # the budget silently.
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        # `build/ci/ci-windows.sh` is bash and Windows runners have it. It
        # refuses to run anywhere but Windows, so this line is load-bearing:
        # PowerShell would not find the script at all and the failure would read
        # as a missing file.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # The toolchain versions the evidence records. Printed here as well as by
      # the script, so a reader of the log sees them before the first compile
      # error rather than after it.
      - name: toolchain versions
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
          rustc -vV | grep '^host:'
          cmd //c ver
          vswhere='/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe'
          if [ -x "$vswhere" ]; then
            "$vswhere" -latest -products '*' -property installationVersion
            ls "$("$vswhere" -latest -products '*' -property installationPath | tr -d '\r' | sed 's|\\\\|/|g; s|^C:|/c|')/VC/Tools/MSVC"
          else
            echo "vswhere.exe absent: the MSVC toolset version cannot be reported"
          fi

      # No `restore-keys` prefix fallback, for the reason `.github/workflows/
      # rust-t1.yml` gives at length: a prefix fallback is exactly the mechanism
      # that serves a cache built with a different toolchain or lockfile, and a
      # wrong hit is a green build of the wrong thing.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            core/target
            shells/windows/target
          key: fwg-windows-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'core/Cargo.lock', 'shells/windows/Cargo.lock', 'build/ci/ci-windows.sh') }}

      - name: make ci-windows
        run: make ci-windows

      # ARTIFACTS, and what may never be in them.
      #
      # `build/ci/logs/windows/` carries the test binary's stdout and, on a
      # privileged run, the WFP state dump. It carries NO private device key, NO
      # pairing secret, NO authentication token, NO tunnel plaintext and NO
      # packet capture: this job establishes no tunnel and moves no packet, and
      # ADR-0015 §11.4 classes an address SENSITIVE so nothing in this shell
      # logs one. The paths are enumerated rather than globbed from the repo
      # root, so a future file cannot be swept in by accident.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-windows
          path: |
            build/ci/evidence/windows.json
            build/ci/logs/windows/lifecycle.log
          # `error`, not `ignore`: a missing evidence file means the script did
          # not reach its own write, and a silently empty artifact would let the
          # acceptance report read NOT-EXECUTED without anyone noticing why.
          if-no-files-found: error

      # Linker and load diagnostics, on failure only. Separated from the
      # evidence artifact so that a green run uploads the smallest thing that is
      # still evidence.
      - name: linker and image diagnostics
        if: failure()
        run: |
          # This step runs only after a failure, so the command below is
          # EXPECTED to fail and its status is captured rather than propagated.
          # `set +e` is used instead of `|| true` so that the intent is visible:
          # the exit code is read and reported, not discarded.
          mkdir -p build/ci/logs/windows
          set +e
          ( cd shells/windows && cargo build --locked --workspace --all-targets -v ) \
            > build/ci/logs/windows/linker.log 2>&1
          status=$?
          set -e
          echo "verbose rebuild exited $status; tail of build/ci/logs/windows/linker.log:"
          tail -60 build/ci/logs/windows/linker.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-windows-link-run
          path: build/ci/logs/windows/**
          if-no-files-found: ignore

  # =========================================================================
  # macOS -- hosted. Real macOS shared-core/native boundary, NetworkExtension
  # targets built and the shared core linked, XCTest smoke run.
  #
  # This job does NOT claim a full NetworkExtension lifecycle PASS: hosted
  # runners have no signing identity or entitlements for activation. That
  # claim belongs to `macos-privileged-lifecycle` below and nowhere else.
  # =========================================================================
  macos-link-run:
    name: macos-link-run
    # PINNED. Not `macos-latest`: R-32's failure mode is "it does not build for
    # that target any more", arriving one silent runner-image update at a time.
    runs-on: macos-26
    # The whole job: two cargo builds for two arches with `ring` compiled from
    # C, an xcodegen run, two xcodebuild invocations. 90 minutes is the hard
    # fail, not a target. Rule C-1: a budget is raised by a reviewed change, not
    # silently.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The FALLBACK, if `--print-xcode-path` reports the pin is absent from the
      # image. Uncomment and keep the version in step with
      # `TWINVPN_XCODE_VERSION` in build/ci/ci-common-apple.sh.
      # - uses: maxim-lobanov/setup-xcode@v1
      #   with:
      #     xcode-version: '26.6'

      - name: select the pinned Xcode and print every toolchain version
        run: |
          # The pin lives in build/ci/ci-common-apple.sh and nowhere else.
          #
          # RESOLVED FIRST, into a variable. Inlining the command substitution
          # into `xcode-select -s "$(...)"` discards the resolver's exit status
          # and hands `xcode-select` an empty string, so the job died with
          # `invalid developer directory ''` instead of with the resolver's own
          # message naming the pin and every Xcode the runner does have.
          # `bash -e` fails the assignment when the resolver fails.
          XCODE_DEV_DIR="$(build/ci/ci-macos.sh --print-xcode-path)"
          sudo xcode-select -s "$XCODE_DEV_DIR"
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk macosx --show-sdk-path
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          sw_vers

      - name: install xcodegen
        # Both Apple shells keep an XcodeGen spec rather than a committed
        # .xcodeproj (shells/macos/project.yml's header says why). Without the
        # generator there is no project to build.
        run: brew install --quiet xcodegen

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: fwg-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}

      - name: make ci-macos
        run: make ci-macos

      - name: collect crash reports
        if: failure()
        # A crash inside the extension or the test host is the most informative
        # artifact this job can produce and it is deleted with the runner. It is
        # COPIED rather than uploaded from its home directory so the upload step
        # below cannot be pointed at ~/Library by accident.
        run: |
          mkdir -p build/ci/logs/macos/crashes
          cp -R ~/Library/Logs/DiagnosticReports/* build/ci/logs/macos/crashes/ 2>/dev/null \
            || echo "no crash reports"

      # The gate's input. `error` is deliberate and stays: a run that reached
      # the end without evidence must not be read as a pass.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-macos
          # ENUMERATED, never `path: .`. See the header for what must never be
          # uploaded from an Apple runner.
          path: |
            build/ci/evidence/macos.json
            build/ci/logs/macos/lifecycle-native.log
            build/ci/logs/macos/xctest.log
          if-no-files-found: error
          retention-days: 14

      # The diagnostics, on failure only, and `ignore` so a job that died before
      # producing any cannot stack a second red on the real failure.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-macos-link-run
          # ENUMERATED to the log tree this job writes. Never `path: .`, never
          # `~/Library/Keychains`, never `~/Library/MobileDevice`.
          path: |
            build/ci/logs/macos/**
          if-no-files-found: ignore
          retention-days: 14

  # =========================================================================
  # iOS -- hosted SIMULATOR. Builds the real app target and the real packet-
  # tunnel/NetworkExtension target, links the approved shared core into the
  # production targets, boots a simulator, runs the real XCTest integration
  # target across the production bridge.
  #
  # SIMULATOR EVIDENCE IS NOT DEVICE EVIDENCE. `ios-device-lifecycle` below is
  # the physical-device job and the two are never conflated.
  # =========================================================================
  ios-link-run:
    name: ios-link-run
    # PINNED. Not `macos-latest`.
    runs-on: macos-26
    # Four cargo builds (two triples x two profiles) with `ring` compiled from
    # C, an xcodegen run, a device-SDK build, a simulator boot and a test run.
    # 90 minutes is the hard fail, not a target (rule C-1).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The FALLBACK, if the pinned Xcode is not side-by-side on the image.
      # Keep the version in step with build/ci/ci-common-apple.sh.
      # - uses: maxim-lobanov/setup-xcode@v1
      #   with:
      #     xcode-version: '26.6'

      - name: select the pinned Xcode and print every toolchain version
        run: |
          # RESOLVED FIRST, into a variable. Inlining the command substitution
          # into `xcode-select -s "$(...)"` discards the resolver's exit status
          # and hands `xcode-select` an empty string, so the job died with
          # `invalid developer directory ''` instead of with the resolver's own
          # message naming the pin and every Xcode the runner does have.
          # `bash -e` fails the assignment when the resolver fails.
          XCODE_DEV_DIR="$(build/ci/ci-ios.sh --print-xcode-path)"
          sudo xcode-select -s "$XCODE_DEV_DIR"
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun simctl list runtimes
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          sw_vers

      - name: install xcodegen
        run: brew install --quiet xcodegen

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: fwg-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}

      - name: make ci-ios
        run: make ci-ios

      - name: collect simulator crash reports
        if: failure()
        # Only OUR bundles, and only the crash reports. The rest of the
        # CoreSimulator tree holds the App Group container the vault lives in
        # (ADR-0020 §11.9), and it is never copied out.
        run: |
          mkdir -p build/ci/logs/ios/crashes
          find ~/Library/Logs/DiagnosticReports \
               ~/Library/Developer/CoreSimulator/Devices/*/data/Library/Logs/DiagnosticReports \
               -name '*TwinVPN*' -type f -exec cp {} build/ci/logs/ios/crashes/ \; 2>/dev/null \
            || echo "no crash reports"

      - name: shut the simulator down
        if: always()
        # A booted simulator left behind is state the next run inherits, and
        # rule C-5 binds a verdict to a snapshot rather than to whatever the
        # previous job left running. `--cleanup` is idempotent and succeeds with
        # nothing booted.
        run: build/ci/ci-ios.sh --cleanup

      # The gate's input. `error` is deliberate and stays: a run that reached
      # the end without evidence must not be read as a pass.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-ios
          # ENUMERATED, never `path: .`. See the header.
          path: |
            build/ci/evidence/ios.json
            build/ci/logs/ios/xctest.log
          if-no-files-found: error
          retention-days: 14

      # The diagnostics, on failure only, and `ignore` so a job that died before
      # producing any cannot stack a second red on the real failure.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-ios-link-run
          # ENUMERATED to the log tree this job writes. NEVER the CoreSimulator
          # tree — see the header.
          path: |
            build/ci/logs/ios/**
          if-no-files-found: ignore
          retention-days: 14

  # =========================================================================
  # ANDROID -- hosted emulator. Real app, real JNI .so packaged into the APK,
  # instrumentation tests across the production native bridge, VpnService and
  # application lifecycle transitions, ABI packaging verified.
  #
  # JVM/Robolectric tests alone are explicitly NOT sufficient and `make
  # ci-android` fails rather than degrading to them.
  # =========================================================================
  android-link-run:
    name: android-link-run
    # PINNED. The emulator needs KVM, which the hosted `ubuntu-24.04` image
    # provides and `ubuntu-latest` may not once it moves.
    runs-on: ubuntu-24.04
    # Four ABIs of `ring` + `quinn` from cold, a Gradle assemble of debug,
    # androidTest and release, an emulator boot and an instrumentation run.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Without this the emulator falls back to software rendering AND software
      # CPU, and the boot exceeds any sane timeout. The rule makes /dev/kvm
      # world-accessible to the runner user.
      - name: enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # JDK 21, matching `build/toolchain/env.sh`'s TWINVPN_JDK_VERSION=21.0.5
      # and `shells/android/gradle/libs.versions.toml`'s header. NOT optional:
      # `app/build.gradle.kts` sets `jvmTarget = JVM_21`, and the runner image's
      # default JAVA_HOME is older -- a Gradle run under it fails with an
      # unsupported-target error that reads as a Kotlin problem.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: toolchain versions
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
          java -version
          gradle --version | sed -n '1,8p'
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -1

      # `ci-android.sh` reads ANDROID_NDK_HOME first. The runner image sets both
      # it and ANDROID_NDK_LATEST_HOME, and they can differ: pinning the script
      # to the LATEST one here makes the r27+ that C-12's 16 KiB alignment wants
      # the version that is actually used, rather than whichever the image
      # happened to make default.
      - name: pin the NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.gradle/caches
            ~/.gradle/wrapper
            build/ci/android-target
          key: >-
            fwg-android-${{ hashFiles('rust-toolchain.toml',
            'core/Cargo.lock', 'shells/android/jni/Cargo.lock',
            'shells/android/**/*.gradle.kts',
            'shells/android/gradle/libs.versions.toml',
            'build/ci/ci-android.sh') }}

      - name: make ci-android
        run: make ci-android

      # ARTIFACTS, and what may never be in them.
      #
      # `logcat.txt` is a device log: reason codes, package names, stack traces.
      # It carries NO private device key, NO pairing secret, NO authentication
      # token, NO tunnel plaintext and NO packet capture. `NativeLinkRunTest`
      # never calls `VpnService.establish()`, so no tunnel exists to capture,
      # and ADR-0015 §11.4 classes an address SENSITIVE so nothing in this shell
      # logs one. It is uploaded on FAILURE only; a green run uploads the
      # evidence file and the normalised transition list and nothing else.
      #
      # `gradle-assemble.log` is the Gradle run's own stdout AND stderr, which
      # is where `* What went wrong:` lives. Run 33288074040 failed at
      # `:app:processDebugAndroidTestManifest` and uploaded NOTHING -- "No files
      # were found with the provided path" -- because that log did not exist and
      # the other three are written only after a device is reached. It carries
      # dependency coordinates, task names and repository URLs, and no
      # credential: the build resolves from `google()` and `mavenCentral()`
      # anonymously (`shells/android/settings.gradle.kts`) and this job holds no
      # signing secret.
      #
      # `if-no-files-found: warn`, not `ignore`: on a FAILED run this list being
      # empty is itself the defect above, and it must be visible rather than
      # silent. It does not fail the step, because the job has already failed
      # for a better reason and an artifact error would bury it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-android
          path: |
            build/ci/evidence/android.json
            build/ci/logs/android/lifecycle.log
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        # `always()`, not `failure()`. A `timeout-minutes` expiry is a
        # CANCELLATION, on which `failure()` is false -- so the run that most
        # needs `emulator.log` was exactly the run that would not upload it.
        if: always()
        with:
          name: diagnostics-android-link-run
          path: |
            build/ci/logs/android/gradle-assemble.log
            build/ci/logs/android/instrumentation.log
            build/ci/logs/android/logcat.txt
            build/ci/logs/android/emulator.log
            build/ci/logs/android/avdmanager.log
          if-no-files-found: warn

      # The emulator is a background process this job started. Killing it on
      # every path keeps a self-hosted runner usable for the next workflow and
      # costs nothing on a hosted one.
      - name: stop the emulator and remove the packages
        if: always()
        run: build/ci/ci-android.sh --cleanup

  # =========================================================================
  # THE FOUR CRITERIA THAT USED TO NEED HARDWARE ON SOMEBODY'S DESK
  # =========================================================================
  # They lived in `first-implementation-wave-privileged.yml` and were discharged
  # by four physical machines: a Windows rig, a Mac mini, an iPhone on a cable,
  # and a 16 KiB-page Android phone with an unlocked bootloader. That made the
  # wave's last blockers a purchasing decision.
  #
  # They are now remotely executable, and they live HERE -- in the same workflow
  # as the aggregator that reads them. That is not tidiness. While they were a
  # separate workflow, `first-wave-acceptance` had to import their artifacts
  # across runs with `gh run download --commit`, and a cross-run import is a
  # place where evidence from a DIFFERENT run can arrive: the import had to
  # re-check each file's own commit precisely because the mechanism could not
  # guarantee it otherwise. One workflow, one run, one `download-artifact`, and
  # that whole class of mistake is gone.
  #
  # WHAT REPLACED `needs:` FOR THE TWO SELF-HOSTED JOBS. A `needs:` on a job
  # whose runner label is not registered does not fail -- it QUEUES, for up to
  # twenty-four hours, and the gate sits pending instead of returning a verdict.
  # A check that cannot go red is not a gate. So each self-hosted job is gated
  # on a REPOSITORY VARIABLE that says the rig exists. Unset, the job SKIPS;
  # `first-wave-acceptance` runs under `always()` and its `needs:` are satisfied
  # by a skip; no evidence file is produced; and `report.py` reads the row as
  # NOT-EXECUTED, which counts against Phase 5 eligibility exactly as a failure
  # does. Immediately, and by name.

  # =========================================================================
  # WINDOWS-WFP-KILLSWITCH -- hosted windows-2025 as L1, the device under test
  # in a disposable nested Hyper-V guest built per run, the leak oracle and
  # its sentinel in-box on a routed internal segment. No self-hosted runner,
  # no golden disk, no public oracle, no standing sentinel host, no variable.
  # See build/ci/jobs/windows-killswitch-hosted.yml and
  # docs/implementation/remote-acceptance-infrastructure.md sections 1, 2 and 6.
  # =========================================================================
  windows-killswitch:
    name: windows-killswitch
    # HOSTED, and pinned. `windows-latest` moves between images, and an image
    # move that dropped the Hyper-V role would change what this job is about
    # with no diff to point at.
    runs-on: windows-2025
    # A cold cargo build of the shell plus the core test binary is the long
    # pole; the ISO download and the DISM apply add ten to twenty minutes.
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: toolchain versions
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version
          python --version
          (Get-Service vmms).Status
          Get-VMSwitch | Format-Table Name, SwitchType

      # Mirrors `windows-link-run`: no `restore-keys` prefix fallback, because a
      # prefix fallback is exactly the mechanism that serves a cache built with
      # a different toolchain or lockfile, and a wrong hit is a green build of
      # the wrong thing. `lab/target` is here too -- the leak oracle now builds
      # in this job rather than living on a machine somebody provisioned.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            core/target
            shells/windows/target
            lab/target
          key: fwg-killswitch-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'core/Cargo.lock', 'shells/windows/Cargo.lock', 'lab/Cargo.lock', 'build/ci/ci-windows-killswitch.sh') }}

      # BEFORE the guest image is built, so a runner that cannot host one says
      # so in two minutes rather than after a 5 GB download.
      - name: preflight
        run: scripts\twinvpn-l1.ps1 -Action preflight

      # The observer. It runs on this host, beside the guest, on a segment the
      # guest reaches only through its default route.
      - name: build the leak oracle
        run: cargo build --locked --release -p twinoracle
        working-directory: lab

      # Windows 11 Enterprise LTSC 2024 Evaluation, SHA-256 pinned in
      # `scripts/twinvpn-l1-image.ps1`, applied to a VHDX with
      # `Expand-WindowsImage` and made bootable with `bcdboot`. No Windows Setup
      # pass, and the ISO is deleted once the image exists.
      - name: build the disposable guest image
        run: scripts\twinvpn-l1.ps1 -Action build-image

      - name: kill-switch sequence in a disposable nested guest
        run: |
          scripts\twinvpn-l1.ps1 -Action run `
            -RepoPath    '${{ github.workspace }}' `
            -EvidenceOut '${{ github.workspace }}\build\ci\evidence'

      # STEP 10, AND IT IS NOT ENOUGH THAT THE CONTROLLER ALSO DOES IT.
      #
      # `-Action run` destroys the guest in a `finally`, which covers a throw.
      # It does NOT cover this job being CANCELLED: a `timeout-minutes` expiry
      # kills pwsh outright and a `finally` never runs. The guest that survives
      # that holds a differencing disk AND has installed persistent WFP filters
      # (CB-6), so it is a machine nobody can log into over the network. It also
      # stops the oracle, the DNS relay and the sentinel and removes the two
      # internal switches and their firewall rules.
      #
      # `-Action destroy` is idempotent and succeeds with nothing to destroy, so
      # it costs nothing on the normal path. The VM name is a constant rather
      # than a per-invocation GUID for exactly this reason: the old default
      # computed a fresh name here and tore down nothing.
      - name: destroy the disposable guest and the lab fabric
        if: always()
        run: scripts\twinvpn-l1.ps1 -Action destroy

      # THE EVIDENCE, AND THE ORACLE'S OWN REPORT BESIDE IT.
      #
      # `build/ci/evidence/oracle/<session>.json` used to be fetched from the
      # external oracle by a later job. An in-box oracle dies with this runner,
      # so the lane writes the oracle's answer unmodified and it is uploaded
      # here; `report.py` reads it from that directory either way.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-windows-killswitch
          path: |
            build/ci/evidence/windows-killswitch.json
            build/ci/evidence/oracle/*.json
          # `warn`, not `ignore`. A criterion job that finished without writing
          # its evidence file is a real defect -- the script did not reach its
          # own write -- and `ignore` made that indistinguishable from a job that
          # was never going to produce one. It stays non-fatal because the row is
          # already going to read NOT-EXECUTED, and a second red here would bury
          # the first.
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # The guest transcript, the oracle's stdout and stderr, the sentinel's
          # log and the precondition output. Source addresses of OUR OWN
          # beacons, timestamps and counts: no key, no pairing secret, no token,
          # no tunnel plaintext, no capture. Uploaded on success as well as
          # failure, because a run that is blocked on product wiring is the
          # normal outcome today and its logs are the point.
          name: diagnostics-windows-killswitch
          path: build/ci/logs/windows/**
          if-no-files-found: ignore

  android-16k:
    name: android-16k
    # HOSTED. This is the whole point of the change: Google ships an official
    # 16 KB page-size emulator image, so the criterion no longer needs a Pixel
    # with an unlocked bootloader and a wiped data partition -- which no device
    # farm will provide and which made the row undischargeable in the cloud.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: pin the NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      # The signing material for the RELEASE-CONFIGURED APK. The criterion
      # installs the release build, not the debug one, and
      # `app/build.gradle.kts` gives the release signing config no silent
      # fallback -- so a run without these fails naming them rather than quietly
      # installing a debug artifact and recording "release" in the evidence.
      #
      # THIS IS AN ACCEPTANCE-ONLY KEYSTORE. It exists so the 16 KiB criterion
      # can install a release-configured artifact; it is not the Play release
      # identity and must never sign a shipped build. Nothing below prints,
      # echoes or logs any of the four values -- the base64 goes straight from
      # the environment into a file, and the three passwords are handed to
      # Gradle by the step that runs it.
      - name: stage the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.TWINVPN_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::TWINVPN_RELEASE_KEYSTORE_B64 is not configured; ANDROID-16K-PAGE-SIZE installs the release-configured APK (this is the acceptance-only keystore, never the Play identity) and cannot substitute a debug build"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          echo "TWINVPN_RELEASE_KEYSTORE=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.gradle/caches
            ~/.gradle/wrapper
            build/ci/android-target
          key: fwg-android16k-${{ hashFiles('rust-toolchain.toml', 'core/Cargo.lock', 'shells/android/jni/Cargo.lock', 'shells/android/**/*.gradle.kts', 'shells/android/gradle/libs.versions.toml', 'build/ci/ci-android.sh') }}

      - name: 16 KiB page-size lifecycle on the official emulator image
        env:
          TWINVPN_RELEASE_STORE_PASSWORD: ${{ secrets.TWINVPN_RELEASE_STORE_PASSWORD }}
          TWINVPN_RELEASE_KEY_ALIAS: ${{ secrets.TWINVPN_RELEASE_KEY_ALIAS }}
          TWINVPN_RELEASE_KEY_PASSWORD: ${{ secrets.TWINVPN_RELEASE_KEY_PASSWORD }}
        # ONE invocation. `--reset` does not stop the run -- it clears the
        # stale AVD, evidence and logs and then falls through -- so calling the
        # script twice would build, boot and instrument twice.
        run: build/ci/ci-android.sh --reset --pagesize16k

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-android-16k
          path: build/ci/evidence/android-16k.json
          # `warn`, not `ignore`: a criterion job that finished without
          # writing its evidence file did not reach its own write, and
          # that is worth seeing. Non-fatal, because the row already
          # reads NOT-EXECUTED and a second red would bury the first.
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-android-16k
          path: |
            build/ci/logs/android/gradle-assemble.log
            build/ci/logs/android/instrumentation.log
            build/ci/logs/android/logcat.txt
            build/ci/logs/android/emulator.log
            build/ci/logs/android/zipalign.log
            # `ci-android.sh` §2d's preflight gate. It prints the missing
            # classes in the clear, so this is for the OTHER failure: an
            # apkanalyzer whose column layout moved, where the whole dump is
            # what says which column the class name went to.
            build/ci/logs/android/preflight/
          if-no-files-found: warn

      - name: stop the emulator and remove the packages
        if: always()
        run: build/ci/ci-android.sh --cleanup

  # =========================================================================
  # IOS-FAILCLOSED-CONFIGURATION + IOS-PROFILE-REMOVAL-HONESTY -- hosted
  # SIMULATOR. Apple's own statement (DTS, forum thread 101663, unchanged
  # through Xcode 26) is that a packet tunnel provider cannot run in the
  # simulator, because the simulator uses the macOS kernel for networking. So
  # this job starts no tunnel, exercises no OS enforcement and claims no
  # egress. What it proves is the half that is TwinVPN's to prove: that the
  # app installs exactly the NETunnelProviderProtocol and on-demand rules that
  # earn the OS's documented drop-when-not-connected behaviour, that the app
  # half and the extension half agree on it, and that after the observation
  # the OS delivers on configuration removal (no configuration; NEVPNStatus
  # .invalid) the app reports NOT PROTECTED and makes no continued kill-switch
  # claim. Every assertion reads in-process object state, and the evidence
  # says so: `execution: simulator`, `real_network_extension_invoked: false`,
  # `os_enforcement_exercised: false`. `build/acceptance/report.py` pins those
  # values, so a simulator file can never satisfy the device row
  # IOS-NE-FAIL-CLOSED, which has no executor today and reads NOT-EXECUTED
  # with that reason.
  #
  # The Corellium lane this replaces could not perform three of the five
  # injections its criterion named, ran its probe on the controller rather
  # than the device, and never established that a provider runs on a
  # Corellium instance at all. It was removed on 2026-09-02.
  # =========================================================================
  ios-acceptance:
    name: ios-acceptance
    # PINNED. Not `macos-latest`, for the reason `ios-link-run` gives.
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: select the pinned Xcode and print every toolchain version
        run: |
          XCODE_DEV_DIR="$(build/ci/ci-ios.sh --print-xcode-path)"
          sudo xcode-select -s "$XCODE_DEV_DIR"
          xcodebuild -version
          swift --version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list runtimes
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          sw_vers

      - name: install xcodegen
        run: brew install --quiet xcodegen

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: fwg-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}

      # Two xcodebuild invocations, one per row, so neither row carries the
      # other's test count or transitions. A zero test count is refused by the
      # lane itself before the adjudicator ever sees it.
      - name: the two simulator acceptance suites
        run: build/ci/ci-ios.sh --acceptance

      - name: collect simulator crash reports
        if: failure()
        run: |
          mkdir -p build/ci/logs/ios/crashes
          find ~/Library/Logs/DiagnosticReports \
               ~/Library/Developer/CoreSimulator/Devices/*/data/Library/Logs/DiagnosticReports \
               -name '*TwinVPN*' -type f -exec cp {} build/ci/logs/ios/crashes/ \; 2>/dev/null \
            || echo "no crash reports"

      - name: shut the simulator down
        if: always()
        run: build/ci/ci-ios.sh --cleanup

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-ios-acceptance
          path: |
            build/ci/evidence/ios-failclosed-configuration.json
            build/ci/evidence/ios-profile-removal.json
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-ios-acceptance
          path: |
            build/ci/logs/ios/**
          if-no-files-found: ignore
          retention-days: 14

  # =========================================================================
  # MACOS-PF-BOOT-ANCHOR -- hosted macos-26, as root. The KS-19 boot anchor
  # installed by the package and EVALUATED by pf, plus the bridge tests run as
  # root so Apple's pf parses the rendered anchor. Needs nothing an operator
  # configures. See build/ci/jobs/macos-pf-anchor.yml.
  # =========================================================================
  macos-pf-anchor:
    name: macos-pf-anchor
    # PINNED, not `macos-latest`. Same image as `macos-link-run`, so the Xcode
    # 26.6 pin in build/ci/ci-common-apple.sh is known to resolve on it.
    runs-on: macos-26
    # A universal-2 core build with `ring` compiled from C, an xcodegen run and
    # an xcodebuild test, plus the install and the pf work. Rule C-1: a budget
    # is raised by a reviewed change, not silently.
    timeout-minutes: 75
    permissions:
      contents: read
    # The fork guard only. There is no variable to gate on, which is the point:
    # nothing an operator has to configure stands between this row and a
    # verdict. A fork's pull request is still excluded, because it runs on a
    # runner this repository does not control the provisioning of.
    if: >-
      ${{ github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      # The pin lives in build/ci/ci-common-apple.sh and nowhere else. Resolved
      # into a variable first so a missing Xcode fails with the resolver's own
      # message rather than with `invalid developer directory ''`.
      #
      # `sudo xcode-select -s` is SYSTEM-WIDE, which is what lets the lane run
      # `sudo xcodebuild` later without carrying `DEVELOPER_DIR` across the
      # privilege boundary.
      - name: select the pinned Xcode and print every toolchain version
        run: |
          XCODE_DEV_DIR="$(build/ci/ci-macos.sh --print-xcode-path)"
          sudo xcode-select -s "$XCODE_DEV_DIR"
          xcodebuild -version
          swift --version
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          sw_vers
          csrutil status || true

      - name: install xcodegen
        # Both Apple shells keep an XcodeGen spec rather than a committed
        # .xcodeproj, so the generator is a prerequisite and not a convenience.
        run: brew install --quiet xcodegen

      # The same cache key as `macos-link-run`: the two jobs build the same
      # crates for the same targets on the same image, so a shared key is a hit
      # rather than two copies of one download.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: fwg-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}

      # A KNOWN-CLEAN START. The image should carry no TwinVPN enforcement, and
      # if it somehow does, the run must not inherit it and then report on it.
      # Non-fatal here: a host with nothing to remove is the expected case.
      - name: reset to a known-clean state
        run: build/ci/ci-macos-pf-anchor.sh --cleanup || true

      - name: install the boot anchor and prove pf evaluates it
        run: build/ci/ci-macos-pf-anchor.sh

      # EVERY EXIT PATH, including a cancellation and a timeout. This one is
      # NOT `|| true`: it reads the kernel back and fails the job when TwinVPN
      # enforcement is still installed, which on a self-hosted Mac is the
      # difference between a clean host and one that inherits our firewall.
      - name: remove the boot anchor and return the runner's pf
        if: always()
        run: build/ci/ci-macos-pf-anchor.sh --cleanup

      # The gate's input. `warn`, not `error`: the row already reads
      # NOT-EXECUTED when the file is absent, and a second red would bury the
      # first — the failure mode `macos-link-run`'s header records from run
      # 33283744937.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-macos-pf-anchor
          path: build/ci/evidence/macos-pf-anchor.json
          if-no-files-found: warn
          retention-days: 14

      # The measurements themselves, always — not only on failure. This lane's
      # whole subject is what pf said, and a GREEN row whose pfctl output nobody
      # kept is a row that cannot be re-read later. ENUMERATED, never `path: .`.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-macos-pf-anchor
          path: |
            build/ci/logs/macos/pf-anchor-install.log
            build/ci/logs/macos/ksd-apply.log
            build/ci/logs/macos/ksd-status.log
            build/ci/logs/macos/pf-*.txt
            build/ci/logs/macos/xctest-root.log
          if-no-files-found: ignore
          retention-days: 14

  # =========================================================================
  # MACOS-PRODUCTION-SIGNATURE -- hosted. Pure artifact inspection; see
  # build/ci/jobs/macos-signature-hosted.yml for the reasoning that moved it
  # off the EC2 Mac and for why it skips by name without a notarized URL.
  # =========================================================================
  macos-signature:
    name: macos-signature
    # PINNED, not `macos-latest`: R-32's failure mode is "it does not build for
    # that target any more", arriving one silent runner-image update at a time.
    # `macos-26` is the image `macos-link-run` and `ios-link-run` already use,
    # so the Xcode 26.6 pin in build/ci/ci-common-apple.sh is known to resolve.
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    # Two conditions, and they are different refusals. The first is "this row
    # has nothing to inspect" — see the header. The second is the fork guard:
    # a fork's pull request cannot read `vars` or `secrets` at all.
    if: >-
      ${{ vars.TWINVPN_NOTARIZED_APP_URL != ''
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
    env:
      TWINVPN_TEAM_ID: ${{ vars.TWINVPN_TEAM_ID }}
      # MEASURED WHERE IT CAN BE, DECLARED WHERE IT CANNOT. The script reads
      # `RUNNER_ENVIRONMENT` — GitHub's own answer, whose vocabulary is exactly
      # the evidence schema's — and this variable exists only to override it on
      # a host that is neither hosted nor self-hosted. It is deliberately unset
      # here so the runner speaks for itself.
      TWINVPN_RUNNER_KIND: ${{ vars.TWINVPN_RUNNER_KIND }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      # The pin lives in build/ci/ci-common-apple.sh and nowhere else.
      # RESOLVED FIRST, into a variable: inlining the substitution into
      # `xcode-select -s "$(...)"` discards the resolver's exit status and hands
      # `xcode-select` an empty string, so the job dies with "invalid developer
      # directory ''" instead of with the resolver's own message.
      #
      # `stapler` ships with Xcode, so this step is what pins the tool this
      # criterion's stapling check actually runs.
      - name: select the pinned Xcode
        run: |
          XCODE_DEV_DIR="$(build/ci/ci-macos.sh --print-xcode-path)"
          sudo xcode-select -s "$XCODE_DEV_DIR"
          xcodebuild -version
          sw_vers
          # RECORDED, not gated. The evidence carries both; the criterion's
          # subject is the artifact, not the host.
          csrutil status || true
          spctl --status || true

      # The SIGNED, NOTARIZED product, published by the release pipeline. NOT a
      # CI build: a build produced here would be signed by whatever identity the
      # runner holds and notarized by nobody, and checking its signature would
      # tell us about the runner rather than about the product.
      - name: fetch the notarized product and verify it against its pinned digest
        env:
          APP_URL: ${{ vars.TWINVPN_NOTARIZED_APP_URL }}
          APP_TOKEN: ${{ secrets.TWINVPN_NOTARIZED_APP_TOKEN }}
          APP_SHA256: ${{ vars.TWINVPN_NOTARIZED_APP_SHA256 }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::TWINVPN_NOTARIZED_APP_URL is not configured; MACOS-PRODUCTION-SIGNATURE is about the artifact users download and must not be handed a CI build"
            exit 1
          fi
          # This criterion's entire subject is "the bytes a user would
          # download", so a run that cannot name those bytes has not made the
          # claim. A truncated transfer also fails `codesign --verify` for a
          # reason that has nothing to do with signing, which is the confusing
          # red this turns into a legible one.
          if [ -z "$APP_SHA256" ]; then
            echo "::error::TWINVPN_NOTARIZED_APP_SHA256 is not configured. MACOS-PRODUCTION-SIGNATURE is a claim about a specific published artifact; without a pinned SHA-256 the row would be about whatever that URL served today."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/product"
          curl -sSL --fail-with-body \
            ${APP_TOKEN:+-H "Authorization: Bearer $APP_TOKEN"} \
            -o "$RUNNER_TEMP/product/TwinVPN.zip" "$APP_URL"
          . build/ci/digest.sh
          twinvpn_verify_digest "$RUNNER_TEMP/product/TwinVPN.zip" "$APP_SHA256" TwinVPN.app.zip
          # Handed to the script so the EVIDENCE records the digest that was
          # actually gated on, rather than one recomputed later from a file that
          # by then has been expanded, quarantined and re-signed by nothing.
          echo "TWINVPN_ARCHIVE_SHA256=$APP_SHA256" >> "$GITHUB_ENV"
          ditto -x -k "$RUNNER_TEMP/product/TwinVPN.zip" "$RUNNER_TEMP/product"

      - name: signature, notarization and stapling
        run: build/ci/ci-macos-signature.sh "$RUNNER_TEMP/product/TwinVPN.app"

      # A hosted runner is destroyed after the job, so this is no longer the
      # load-bearing step it was on a long-lived shared Mac. It stays because it
      # is also what a developer reproducing this on their own machine should
      # do, and because "the runner is ephemeral" is a property of the fleet
      # rather than of this job.
      - name: remove the downloaded product
        if: always()
        run: rm -rf "$RUNNER_TEMP/product"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-macos-signature
          path: build/ci/evidence/macos-signature.json
          # `warn`, not `ignore`: a criterion job that finished without writing
          # its evidence file did not reach its own write, and that is worth
          # seeing. Non-fatal, because the row already reads NOT-EXECUTED and a
          # second red would bury the first.
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-macos-signature
          # ENUMERATED, never `path: .`. NEVER ~/Library/Keychains and never
          # ~/Library/MobileDevice.
          path: build/ci/logs/macos/sig-*.log
          if-no-files-found: ignore
          retention-days: 14

  first-wave-acceptance:
    name: first-wave-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      # For the cross-run artifact read below, and for nothing else. A fork
      # PR's token is read-only whatever this says, so it cannot be widened
      # from outside.
      actions: read
    needs:
      - core-crypto
      - pairing-mi
      - linux-link-run
      - windows-link-run
      - macos-link-run
      - ios-link-run
      - android-link-run
      # THE FIVE PLATFORM-CRITERION JOBS ARE NOW IN `needs:`, WHICH THE FOUR
      # THEY REPLACED COULD NOT BE.
      #
      # The old privileged jobs lived in another workflow and were kept out of
      # `needs:` because a job whose self-hosted label is unregistered QUEUES
      # for twenty-four hours rather than failing, and the gate would sit
      # pending instead of returning a verdict.
      #
      # Since 2026-09-02 every job here is hosted and cannot queue at all. Only
      # `macos-signature` is gated on a variable (the notarized product's URL,
      # an Apple Developer Program fact), so it SKIPS by name when unset. A
      # skipped `needs:` is satisfied under `always()`, so the gate still
      # returns promptly, and the skipped job wrote no evidence, so its row
      # reads NOT-EXECUTED and counts against eligibility exactly as a failure
      # does. The two criteria with no executor have no job at all; report.py
      # names why.
      - windows-killswitch
      - android-16k
      - ios-acceptance
      - macos-pf-anchor
      - macos-signature
    # `always()`, so the report is PRINTED rather than skipped.
    #
    # Without it a single red `needs:` job skips this one, and the artifact
    # that names WHICH rows are red -- the only machine-readable answer to
    # "what is left" -- is never produced. Run 33306033416 is the example:
    # seven jobs green, `mutation-proof` red, `first-wave-acceptance` skipped,
    # no acceptance report anywhere in the run. The job still goes red when the
    # report is not eligible, because `report.py` exits non-zero.
    if: always()
    #
    # AND `always()` IS WHY THE LAST STEP OF THIS JOB EXISTS.
    #
    # `always()` means every entry in `needs:` above is satisfied by a job that
    # FAILED, was CANCELLED, or was SKIPPED. A skip is the ordinary outcome for
    # the three self-hosted jobs -- they are gated on a repository variable
    # precisely so that an unregistered runner skips instead of queueing for
    # twenty-four hours -- so a run with no rigs provisioned at all reaches this
    # job with every `needs:` "satisfied" and nothing having been proved.
    #
    # That leaves the gate's redness resting entirely on
    # `build/acceptance/report.py`, which grades EVIDENCE FILES. It is a good
    # mechanism and it is not a complete one: a job that never ran wrote no file,
    # `core-crypto` and `pairing-mi` write no platform evidence at all, and
    # "unprovisioned" and "the runner died" produce identical silence. Job
    # results are the only place that information exists.
    #
    # So the final step reads `toJSON(needs)` and requires `success` from every
    # one of them -- not `skipped`, not `cancelled`, not `failure`, not absent.
    # A specialized runner being unavailable makes this check RED and names the
    # variable or the label responsible. GREEN BY ABSENCE is the failure mode
    # that whole arrangement exists to make unreachable.
    #
    # `mutation-proof` IS IN THIS WORKFLOW AND IS NOT IN `needs:`, FOR AN
    # UNRELATED REASON. Do not read the two as the same case. The privileged
    # jobs are still required and are enforced through their evidence rows;
    # B-1 is DEFERRED PAST WAVE 1 by the integration lead (2026-08-30), because
    # `mutation-gate.sh` §5 discharges a proof obligation only on the
    # conjunction of an `IMPLEMENTED` register row and every specified mutant
    # killed, and `build/proof/register.tsv` holds 21 PARTIAL and 1
    # NOT-RUNNABLE and zero IMPLEMENTED -- so B-1 is 0/22 on the oracle half
    # whatever the mutant count does, and no sequencing inside Wave 1 closes
    # it. The job still runs, still goes red, and still uploads its report;
    # it has only lost its gating edge, and `report.py` marks the F-5 row
    # deferred rather than counting it toward eligibility.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: toolchain versions
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          python3 --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: fwg-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}

      # Every platform job wrote one evidence file and uploaded it. Collect
      # them all back into build/ci/evidence/ so the report reads real files
      # rather than a job's word for it.
      - uses: actions/download-artifact@v4
        # TOLERANT. THIS AND THE `mutation-report` DOWNLOAD BELOW ARE THE ONLY
        # TWO `continue-on-error` IN THIS FILE, AND BOTH ARE COLLECTION STEPS.
        #
        # `download-artifact` ERRORS when its pattern matches nothing, and on a
        # run where every rig is unprovisioned that is the normal case. Letting
        # it kill the job would destroy the one thing `always()` was added to
        # produce: the report naming WHICH rows are red.
        #
        # It cannot turn a red into a green, and that is the test this
        # tolerance had to pass. A download that fails leaves the evidence
        # directory empty; report.py reads an absent file as NOT-EXECUTED,
        # which counts against eligibility exactly as a failure does; and the
        # `require-job-results` step at the end of this job fails on any
        # `needs:` result that is not `success` regardless of what was or was
        # not downloaded. Every path through a failed download is red.
        #
        # It is COLLECTION, not verification. No `continue-on-error` remains on
        # any step of this workflow that decides anything.
        continue-on-error: true
        with:
          pattern: evidence-*
          path: build/ci/evidence-download
          merge-multiple: true

      # TOLERANT since B-1 lost its `needs:` edge, and for the same reason as
      # the step above: `mutation-proof` may still be RUNNING when this job
      # starts -- it is allowed 180 minutes and this one 45 -- so its artifact
      # is frequently absent, `report.py` reads that as NOT-EXECUTED on the
      # DEFERRED F-5 row, and a deferred row must not take the gate down.
      #
      # Same test as above: it cannot turn a red into a green. F-5 is deferred,
      # so its row counts toward nothing either way; `require-job-results` does
      # not list `mutation-proof` because it is not in `needs:` and re-imposing
      # it here would undo the deferral by the back door.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mutation-report
          path: build/proof

      # THE OLD CROSS-RUN IMPORT IS GONE, AND ITS ABSENCE IS THE POINT.
      #
      # There used to be a step here that asked GitHub for the most recent
      # completed run of `first-implementation-wave-privileged.yml` at this head
      # SHA and downloaded its `evidence-*` artifacts. It worked, and it was a
      # standing hazard: `gh run download` reaches into ANOTHER RUN, so the step
      # had to re-check each file's own recorded commit precisely because the
      # mechanism could not guarantee whose evidence it had fetched.
      #
      # Every platform criterion now runs in THIS workflow, so `download-artifact`
      # above -- which reads this run and only this run -- collects all of it.
      # The class of mistake where a row is flipped by evidence from a different
      # run is not mitigated; it is unreachable.
      #
      # `report.py` still binds every file to `GITHUB_SHA` and to
      # `GITHUB_RUN_ID`, because defence in depth costs nothing here and a
      # locally-run report should be held to the same rule.

      - name: collect platform evidence
        run: |
          mkdir -p build/ci/evidence build/ci/evidence/oracle
          # Oracle session reports written by an in-box lane travel as
          # `oracle/<session>.json` inside that lane's evidence artifact; they
          # go where report.py reads them, not into the platform-evidence dir.
          find build/ci/evidence-download -path '*/oracle/*.json' -exec cp {} build/ci/evidence/oracle/ \;
          find build/ci/evidence-download -name '*.json' -not -path '*/oracle/*' -exec cp {} build/ci/evidence/ \;
          ls -la build/ci/evidence/ build/ci/evidence/oracle/

      # THE JOB OUTCOMES, WRITTEN WHERE report.py CAN READ THEM.
      #
      # report.py grades EVIDENCE FILES, and a job that never got as far as
      # writing one leaves nothing behind. Its row then says "no evidence",
      # which is equally true of a job that failed in setup, a job its own
      # timeout cancelled, and a job that was SKIPPED because its self-hosted
      # runner is not registered -- three different problems and one sentence,
      # with the most dangerous of them, the skip, looking the most like routine
      # absence.
      #
      # `needs.<job>.result` is the only place that distinction exists, and it
      # exists ONLY inside this workflow -- nothing report.py can read on its own
      # and nothing a platform job could have written about itself. So it is
      # flattened to a job -> result map here, before the report runs, and
      # `build/acceptance/job_results.py` turns each outcome into the sentence
      # the row deserves.
      #
      # It is written BEFORE `make test-first-wave-gate`, and its absence is
      # meaningful: report.py reads a missing file as "this is not a GitHub run"
      # (a laptop, a docs check) rather than as "every job passed".
      - name: record every job's outcome for the report
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          mkdir -p build/ci/evidence
          python3 - <<'PY'
          import json, os, pathlib
          needs = json.loads(os.environ["NEEDS"])
          results = {job: (v or {}).get("result") for job, v in needs.items()}
          out = pathlib.Path("build/ci/evidence/job-results.json")
          out.write_text(json.dumps(results, indent=2, sort_keys=True) + "\n")
          for job, result in sorted(results.items()):
              print(f"{job:<22} {result}")
          PY

      # THE ORACLE'S OWN REPORTS, FETCHED FROM THE ORACLE.
      #
      # This is the step that makes the egress criteria evidence rather than
      # self-report. Each platform evidence file NAMES a leak-oracle session id;
      # this asks the oracle for that session's report over its control API and
      # writes it where `report.py` reads it.
      #
      # It is fetched HERE, in the aggregator, rather than uploaded by the
      # platform job -- because the platform job is the defendant. A job that
      # leaked could upload a report saying it did not; it cannot make the
      # oracle say so.
      #
      # `continue-on-error` IS GONE FROM THIS STEP, AND ITS ABSENCE IS THE
      # CHANGE.
      #
      # The tolerance this step needs is about the ORACLE -- unconfigured,
      # unreachable, or a session it has forgotten -- and every one of those is
      # already handled INSIDE the script below: the unconfigured case exits 0
      # with a warning, and a per-session fetch failure is warned and skipped.
      # A missing oracle report is then read by report.py as a FAILED row, never
      # as a pass, so the tolerance is expressed where it belongs and is visible
      # to a reader of the script rather than hidden in a step attribute.
      #
      # What `continue-on-error` was additionally swallowing was a crash in the
      # Python below -- a genuine defect in this file, which would have produced
      # zero oracle reports while the step showed green with a warning. That now
      # fails the job at the line responsible.
      - name: fetch the leak-oracle reports for this run's sessions
        env:
          TWINVPN_ORACLE_URL: ${{ vars.TWINVPN_ORACLE_URL }}
          TWINVPN_ORACLE_TOKEN: ${{ secrets.TWINVPN_ORACLE_TOKEN }}
        run: |
          mkdir -p build/ci/evidence/oracle
          if [ -z "${TWINVPN_ORACLE_URL:-}" ] || [ -z "${TWINVPN_ORACLE_TOKEN:-}" ]; then
            echo "no external leak oracle is configured; in-box lanes upload their" \
                 "own session reports under build/ci/evidence/oracle/ and those are" \
                 "what report.py adjudicates -- $(ls build/ci/evidence/oracle/ 2>/dev/null | wc -l | tr -d ' ') present"
            exit 0
          fi
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          base = os.environ["TWINVPN_ORACLE_URL"].rstrip("/")
          token = os.environ["TWINVPN_ORACLE_TOKEN"]
          out = pathlib.Path("build/ci/evidence/oracle")
          for f in sorted(pathlib.Path("build/ci/evidence").glob("*.json")):
              try:
                  ev = json.loads(f.read_text())
              except json.JSONDecodeError:
                  continue
              ref = ev.get("leak_oracle")
              if not isinstance(ref, dict) or not ref.get("session_id"):
                  continue
              sid = ref["session_id"]
              url = f"{base}/v1/sessions/{sid}/report"
              proc = subprocess.run(
                  ["curl", "-sS", "--fail-with-body", "--max-time", "30",
                   "-H", f"Authorization: Bearer {token}", url],
                  capture_output=True, text=True)
              if proc.returncode != 0:
                  print(f"::warning::the oracle would not return session {sid}: "
                        f"{proc.stdout.strip()[:200]}")
                  continue
              # WRITTEN VERBATIM, then parsed only to LOG the verdict. The file
              # report.py grades is the oracle's own bytes; a body this step
              # could not parse is still written, because "the oracle answered
              # something we did not understand" is evidence report.py must get
              # to refuse rather than a reason to write nothing and let the row
              # read as an absent adjudicator.
              (out / f"{sid}.json").write_text(proc.stdout)
              try:
                  verdict = json.loads(proc.stdout).get("verdict")
              except json.JSONDecodeError:
                  verdict = "<unparseable body; report.py will refuse the row>"
              print(f"fetched oracle report for session {sid} ({verdict})")
          PY


      # THE COMMITTED REPORT IS DELETED FIRST, AND THAT IS THE POINT.
      #
      # `build/acceptance/first-wave-acceptance.{json,md}` are tracked, so a copy
      # from whenever someone last ran the report locally is sitting in the
      # checkout. The upload below globs that path. In run 33352434440 the make
      # target died before `report.py` ran, and the artifact went out carrying a
      # report from commit c896d823 that even says "DIRTY WORKTREE -- not release
      # evidence" -- presented, by its filename and its artifact name, as this
      # run's answer.
      #
      # Stale evidence offered as current is the exact failure this gate exists
      # to prevent, so remove it and let `if-no-files-found: error` on the upload
      # turn "no report was produced" into a loud, visible failure instead of a
      # quiet substitution.
      - name: make test-first-wave-gate
        run: |
          rm -f build/acceptance/first-wave-acceptance.json \
                build/acceptance/first-wave-acceptance.md
          make test-first-wave-gate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-wave-acceptance-report
          path: |
            build/acceptance/first-wave-acceptance.json
            build/acceptance/first-wave-acceptance.md
            build/ci/evidence/*.json
            build/ci/evidence/oracle/*.json
            build/proof/mutation-report.json
          if-no-files-found: error

      # ==================================================================
      # THE LAST WORD, AND IT IS DELIBERATELY LAST.
      # ==================================================================
      # It runs AFTER the report is generated and AFTER the report is uploaded,
      # so that a run whose provisioning is incomplete still leaves behind the
      # artifact naming which rows are red. Failing earlier would trade the
      # gate's legibility for nothing: the job goes red either way.
      #
      # `if: always()` so it also runs when `make test-first-wave-gate` already
      # failed. The job is red by then, but this step is what says WHICH runner
      # or WHICH repository variable is missing, and that sentence is the only
      # actionable output of a run with no rigs provisioned.
      #
      # What it enforces, from `toJSON(needs)`, which nothing else in the run can
      # see: every required job returned `success`. Not `skipped` -- the ordinary
      # result of an unregistered self-hosted label or a false
      # `TWINVPN_*_ENABLED`. Not `cancelled` -- a timeout expiry or a superseding
      # run. Not `failure`. Not absent from `needs:` at all, which is what
      # happens when somebody edits the dependency list and a criterion silently
      # stops being required.
      #
      # The remedy text lives in `build/ci/require-job-results.py` beside the
      # job list, so the two cannot drift, and that file self-checks with
      # `--self-check`.
      - name: every required job must have SUCCEEDED
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 build/ci/require-job-results.py
