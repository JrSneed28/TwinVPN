name: First Implementation Wave — acceptance gate

# ===========================================================================
# WHAT THIS WORKFLOW IS
# ===========================================================================
# The First Implementation Wave does not pass on a reviewer's agreement. It
# passes when each of its blockers is closed by EXECUTABLE EVIDENCE, produced
# by a named job whose result a reader can go and look at.
#
# So every blocker gets its own visible job, and the four platforms are FOUR
# JOBS rather than one opaque matrix cell -- a single red platform must be
# nameable from the checks list without opening a log.
#
#   core-crypto            F-1  the crypto core is used by the real data path
#   pairing-mi             F-2  pairing exists in the shipped composition
#   mutation-proof         F-5  the mutation/proof obligations are executed
#   windows-link-run       Windows compiles, links, loads, invokes, transitions
#   macos-link-run         macOS   "
#   ios-link-run           iOS     "
#   android-link-run       Android "
#   linux-link-run         Linux, already PASSing, re-run only as regression
#   first-wave-acceptance  the conjunction, via `needs:`
#
# `first-wave-acceptance` is the only job whose verdict means anything on its
# own, and it cannot be green unless every job it needs was green, because
# GitHub will not run it otherwise and the report it prints re-derives each
# platform verdict from that platform's own machine-readable evidence rather
# than trusting the job that wrote it.
#
# ===========================================================================
# WHAT A HOSTED RUNNER CANNOT PROVE
# ===========================================================================
# A hosted runner proves linking and execution. It does not prove privileged
# platform behaviour: WFP/driver/service activation on Windows, a signed
# NetworkExtension on macOS, an on-device packet tunnel on iOS. Those are
# SEPARATE required jobs on self-hosted runners, below, and they are separate
# on purpose: a simulator run and a device run are different evidence and this
# file must not let one stand in for the other.
# ===========================================================================

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

# Minimal token. Nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  # Stale PR runs are cancelled; a verdict on the integration branch is not
  # disposable and is allowed to finish.
  group: first-wave-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:

  # =========================================================================
  # F-1 -- the cryptographic core must be used by the real data path.
  #
  # Blocking. The tests this runs are written so that they FAIL IF THE WIRING
  # IS REMOVED: that is the property under test, not the crypto primitives,
  # which were already reviewed as sound.
  # =========================================================================
  core-crypto:
    name: core-crypto
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: toolchain versions
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
          uname -a

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: fwg-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}

      - name: make test-crypto-integration
        run: make test-crypto-integration

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-crypto-report
          path: |
            build/acceptance/*.json
            build/acceptance/*.md
          if-no-files-found: ignore

  # =========================================================================
  # F-2 -- pairing must exist in the shipped product.
  #
  # The point of this job is that it drives the SAME COMPOSITION the shipped
  # application uses. A test that calls `install_pairing_enrolment` directly
  # is explicitly not evidence here.
  # =========================================================================
  pairing-mi:
    name: pairing-mi
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: toolchain versions
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: fwg-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}

      - name: make test-pairing-integration
        run: make test-pairing-integration

  # =========================================================================
  # F-5 -- mutation/proof coverage.
  #
  # This job exists to publish NUMBERS. "Mutation tests pass" is not an
  # acceptable output and the gate script refuses to print it: the report
  # distinguishes killed / survived / timeout / unviable / missing / not-
  # executed, and a missing mutant is never counted as killed.
  # =========================================================================
  mutation-proof:
    name: mutation-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          # The mutant rig builds with `git worktree add` at an explicit
          # revision, so the full history must be present.
          fetch-depth: 0

      - name: toolchain versions
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: fwg-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}

      - name: make test-mutation
        run: make test-mutation

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: |
            build/proof/mutation-report.json
            build/proof/obligations.tsv
            build/proof/register.tsv
          if-no-files-found: error

  # =========================================================================
  # Linux -- already has executed PASS evidence.
  #
  # Re-run as a REGRESSION check only, because this wave changes shared-core
  # code that Linux links. It is not this wave's new evidence and is not
  # re-proved beyond that.
  # =========================================================================
  linux-link-run:
    name: linux-link-run
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: toolchain versions
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: fwg-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
      - name: make ci-linux
        run: make ci-linux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-linux
          path: build/ci/evidence/linux.json
          if-no-files-found: error

  # =========================================================================
  # WINDOWS -- hosted. Compile, link the real shared core, cross the
  # production FFI boundary, drive a lifecycle transition, shut down.
  # A compilation-only job is insufficient and `make ci-windows` fails if it
  # cannot record a transition.
  # =========================================================================
  windows-link-run:
    name: windows-link-run
    # PINNED. `windows-latest` moves between images, and an image move that
    # changed the MSVC toolset would change what this evidence is about with no
    # diff to point at.
    runs-on: windows-2025
    # A cold cargo build of the core plus the shell for MSVC is the long pole.
    # 90 minutes is a hard fail, not a target: docs/testing-strategy.md rule C-1
    # says a tier that exceeds its budget moves work down a tier, never raises
    # the budget silently.
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        # `build/ci/ci-windows.sh` is bash and Windows runners have it. It
        # refuses to run anywhere but Windows, so this line is load-bearing:
        # PowerShell would not find the script at all and the failure would read
        # as a missing file.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # The toolchain versions the evidence records. Printed here as well as by
      # the script, so a reader of the log sees them before the first compile
      # error rather than after it.
      - name: toolchain versions
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
          rustc -vV | grep '^host:'
          cmd //c ver
          vswhere='/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe'
          if [ -x "$vswhere" ]; then
            "$vswhere" -latest -products '*' -property installationVersion
            ls "$("$vswhere" -latest -products '*' -property installationPath | tr -d '\r' | sed 's|\\\\|/|g; s|^C:|/c|')/VC/Tools/MSVC"
          else
            echo "vswhere.exe absent: the MSVC toolset version cannot be reported"
          fi

      # No `restore-keys` prefix fallback, for the reason `.github/workflows/
      # rust-t1.yml` gives at length: a prefix fallback is exactly the mechanism
      # that serves a cache built with a different toolchain or lockfile, and a
      # wrong hit is a green build of the wrong thing.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            core/target
            shells/windows/target
          key: fwg-windows-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'core/Cargo.lock', 'shells/windows/Cargo.lock', 'build/ci/ci-windows.sh') }}

      - name: make ci-windows
        run: make ci-windows

      # ARTIFACTS, and what may never be in them.
      #
      # `build/ci/logs/windows/` carries the test binary's stdout and, on a
      # privileged run, the WFP state dump. It carries NO private device key, NO
      # pairing secret, NO authentication token, NO tunnel plaintext and NO
      # packet capture: this job establishes no tunnel and moves no packet, and
      # ADR-0015 §11.4 classes an address SENSITIVE so nothing in this shell
      # logs one. The paths are enumerated rather than globbed from the repo
      # root, so a future file cannot be swept in by accident.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-windows
          path: |
            build/ci/evidence/windows.json
            build/ci/logs/windows/lifecycle.log
          # `error`, not `ignore`: a missing evidence file means the script did
          # not reach its own write, and a silently empty artifact would let the
          # acceptance report read NOT-EXECUTED without anyone noticing why.
          if-no-files-found: error

      # Linker and load diagnostics, on failure only. Separated from the
      # evidence artifact so that a green run uploads the smallest thing that is
      # still evidence.
      - name: linker and image diagnostics
        if: failure()
        run: |
          # This step runs only after a failure, so the command below is
          # EXPECTED to fail and its status is captured rather than propagated.
          # `set +e` is used instead of `|| true` so that the intent is visible:
          # the exit code is read and reported, not discarded.
          mkdir -p build/ci/logs/windows
          set +e
          ( cd shells/windows && cargo build --locked --workspace --all-targets -v ) \
            > build/ci/logs/windows/linker.log 2>&1
          status=$?
          set -e
          echo "verbose rebuild exited $status; tail of build/ci/logs/windows/linker.log:"
          tail -60 build/ci/logs/windows/linker.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-windows-link-run
          path: build/ci/logs/windows/**
          if-no-files-found: ignore

  # =========================================================================
  # macOS -- hosted. Real macOS shared-core/native boundary, NetworkExtension
  # targets built and the shared core linked, XCTest smoke run.
  #
  # This job does NOT claim a full NetworkExtension lifecycle PASS: hosted
  # runners have no signing identity or entitlements for activation. That
  # claim belongs to `macos-privileged-lifecycle` below and nowhere else.
  # =========================================================================
  macos-link-run:
    name: macos-link-run
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: toolchain versions
        run: |
          sudo xcode-select -s "$(build/ci/ci-macos.sh --print-xcode-path)"
          xcodebuild -version
          swift --version
          rustup show active-toolchain || rustup toolchain install
          rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: fwg-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
      - name: make ci-macos
        run: make ci-macos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-macos
          path: |
            build/ci/evidence/macos.json
            build/ci/logs/macos/**
          if-no-files-found: error

  # =========================================================================
  # iOS -- hosted SIMULATOR. Builds the real app target and the real packet-
  # tunnel/NetworkExtension target, links the approved shared core into the
  # production targets, boots a simulator, runs the real XCTest integration
  # target across the production bridge.
  #
  # SIMULATOR EVIDENCE IS NOT DEVICE EVIDENCE. `ios-device-lifecycle` below is
  # the physical-device job and the two are never conflated.
  # =========================================================================
  ios-link-run:
    name: ios-link-run
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: toolchain versions
        run: |
          sudo xcode-select -s "$(build/ci/ci-ios.sh --print-xcode-path)"
          xcodebuild -version
          xcrun simctl list runtimes
          rustup show active-toolchain || rustup toolchain install
          rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: fwg-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
      - name: make ci-ios
        run: make ci-ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-ios
          path: |
            build/ci/evidence/ios.json
            build/ci/logs/ios/**
          if-no-files-found: error

  # =========================================================================
  # ANDROID -- hosted emulator. Real app, real JNI .so packaged into the APK,
  # instrumentation tests across the production native bridge, VpnService and
  # application lifecycle transitions, ABI packaging verified.
  #
  # JVM/Robolectric tests alone are explicitly NOT sufficient and `make
  # ci-android` fails rather than degrading to them.
  # =========================================================================
  android-link-run:
    name: android-link-run
    # PINNED. The emulator needs KVM, which the hosted `ubuntu-24.04` image
    # provides and `ubuntu-latest` may not once it moves.
    runs-on: ubuntu-24.04
    # Four ABIs of `ring` + `quinn` from cold, a Gradle assemble of debug,
    # androidTest and release, an emulator boot and an instrumentation run.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Without this the emulator falls back to software rendering AND software
      # CPU, and the boot exceeds any sane timeout. The rule makes /dev/kvm
      # world-accessible to the runner user.
      - name: enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # JDK 21, matching `build/toolchain/env.sh`'s TWINVPN_JDK_VERSION=21.0.5
      # and `shells/android/gradle/libs.versions.toml`'s header. NOT optional:
      # `app/build.gradle.kts` sets `jvmTarget = JVM_21`, and the runner image's
      # default JAVA_HOME is older -- a Gradle run under it fails with an
      # unsupported-target error that reads as a Kotlin problem.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: toolchain versions
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
          java -version
          gradle --version | sed -n '1,8p'
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -1

      # `ci-android.sh` reads ANDROID_NDK_HOME first. The runner image sets both
      # it and ANDROID_NDK_LATEST_HOME, and they can differ: pinning the script
      # to the LATEST one here makes the r27+ that C-12's 16 KiB alignment wants
      # the version that is actually used, rather than whichever the image
      # happened to make default.
      - name: pin the NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.gradle/caches
            ~/.gradle/wrapper
            build/ci/android-target
          key: fwg-android-${{ hashFiles('rust-toolchain.toml', 'core/Cargo.lock', 'shells/android/jni/Cargo.lock', 'shells/android/**/*.gradle.kts', 'shells/android/gradle/libs.versions.toml', 'build/ci/ci-android.sh') }}

      - name: make ci-android
        run: make ci-android

      # ARTIFACTS, and what may never be in them.
      #
      # `logcat.txt` is a device log: reason codes, package names, stack traces.
      # It carries NO private device key, NO pairing secret, NO authentication
      # token, NO tunnel plaintext and NO packet capture. `NativeLinkRunTest`
      # never calls `VpnService.establish()`, so no tunnel exists to capture,
      # and ADR-0015 §11.4 classes an address SENSITIVE so nothing in this shell
      # logs one. It is uploaded on FAILURE only; a green run uploads the
      # evidence file and the normalised transition list and nothing else.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-android
          path: |
            build/ci/evidence/android.json
            build/ci/logs/android/lifecycle.log
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-android-link-run
          path: |
            build/ci/logs/android/instrumentation.log
            build/ci/logs/android/logcat.txt
            build/ci/logs/android/emulator.log
          if-no-files-found: ignore

      # The emulator is a background process this job started. Killing it on
      # every path keeps a self-hosted runner usable for the next workflow and
      # costs nothing on a hosted one.
      - name: stop the emulator and remove the packages
        if: always()
        run: build/ci/ci-android.sh --cleanup

  # =========================================================================
  # PRIVILEGED / PHYSICAL LIFECYCLE -- self-hosted.
  #
  # These prove what a hosted runner cannot. They are separate jobs so that a
  # hosted PASS can never be read as a privileged PASS.
  #
  # Each starts from a resettable environment, never echoes signing secrets,
  # cleans tunnel/route/firewall state on EVERY exit path (`if: always()`), and
  # uploads diagnostics on failure. A failed lifecycle test must not leave the
  # runner's networking stack corrupted for the next workflow.
  #
  # They are gated on the runner label existing: a repository without the
  # runner gets a NOT-EXECUTED row in the acceptance report, which counts
  # against Phase 5 eligibility exactly as a failure does. That is deliberate
  # -- an absent runner is an absence of evidence, not a pass.
  # =========================================================================
  windows-privileged-lifecycle:
    name: windows-privileged-lifecycle
    runs-on: [self-hosted, Windows, twinvpn-vpn-lifecycle]
    # Shorter than the hosted job on purpose: the rig keeps a warm cargo cache,
    # and a privileged run that hangs is a runner left with filters installed.
    # Timing out is how it gets to `--cleanup`.
    timeout-minutes: 60
    permissions:
      contents: read
    # A fork's pull request must never reach a self-hosted runner: the job would
    # execute unreviewed code as a privileged account on a machine inside the
    # network. This is the standard guard and it is not optional here.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: toolchain versions
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
          rustc -vV | grep '^host:'
          cmd //c ver
          sc.exe query state= all | grep -i twinvpn || echo "no TwinVPN service registered"

      # A privileged run that starts dirty proves nothing: filters left by the
      # previous run would make "the ruleset was reclaimed" true for the wrong
      # reason. `--reset` FAILS rather than cleaning, because a rig that needs
      # cleaning at the start was not restored and its state is unknown.
      - name: reset to a known-clean state
        run: build/ci/ci-windows.sh --reset

      - name: privileged WFP, driver and service lifecycle
        run: build/ci/ci-windows.sh --privileged

      # EVERY exit path, including a timeout and a cancelled run. A failed
      # lifecycle test must not leave the runner's networking stack blocked for
      # the next workflow. `--cleanup` never fails the job, so it cannot mask
      # the real failure above it.
      - name: tear down tunnel, routes and firewall state
        if: always()
        run: build/ci/ci-windows.sh --cleanup

      # DIAGNOSTICS ON FAILURE ONLY, and enumerated rather than globbed.
      #
      # `wfp-state-after.xml` is `netsh wfp show state`: filter and provider
      # definitions plus the host's own addresses. It carries NO private device
      # key, NO pairing secret, NO authentication token, NO tunnel plaintext and
      # NO packet capture -- this job captures no traffic and establishes no
      # session. The evidence file is deliberately NOT uploaded under an
      # `evidence-*` name: `build/acceptance/report.py` reads exactly
      # `build/ci/evidence/windows.json`, and two jobs uploading that name would
      # let whichever finished last decide what the report says.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-windows-privileged
          path: |
            build/ci/logs/windows/lifecycle.log
            build/ci/logs/windows/windows-host.log
            build/ci/logs/windows/wfp-state-after.xml
          if-no-files-found: ignore

      # The privileged evidence, under its own name so it can be read beside the
      # hosted file without replacing it.
      - name: publish the privileged evidence under its own name
        if: always()
        run: |
          if [ -f build/ci/evidence/windows.json ]; then
            mv build/ci/evidence/windows.json build/ci/evidence/windows-privileged.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-windows-privileged
          path: build/ci/evidence/windows-privileged.json
          if-no-files-found: ignore

  macos-privileged-lifecycle:
    name: macos-privileged-lifecycle
    runs-on: [self-hosted, macOS, twinvpn-vpn-lifecycle]
    timeout-minutes: 60
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: reset to a known-clean state
        run: build/ci/ci-macos.sh --reset
      - name: privileged NetworkExtension lifecycle
        run: build/ci/ci-macos.sh --privileged
      - name: tear down tunnel, routes and firewall state
        if: always()
        run: build/ci/ci-macos.sh --cleanup
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-macos-privileged
          path: build/ci/logs/macos/**
          if-no-files-found: ignore

  ios-device-lifecycle:
    name: ios-device-lifecycle
    runs-on: [self-hosted, macOS, twinvpn-ios-device]
    timeout-minutes: 60
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: reset to a known-clean state
        run: build/ci/ci-ios.sh --reset
      # xcodebuild against the PROVISIONED PHYSICAL DEVICE. This is not the
      # simulator job and its evidence file is written separately.
      - name: on-device packet-tunnel lifecycle
        run: build/ci/ci-ios.sh --device
      - name: tear down tunnel, routes and firewall state
        if: always()
        run: build/ci/ci-ios.sh --cleanup
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-ios-device
          path: build/ci/logs/ios/**
          if-no-files-found: ignore

  android-device-lifecycle:
    name: android-device-lifecycle
    runs-on: [self-hosted, Linux, twinvpn-android-device]
    # The rig keeps warm cargo and Gradle caches and boots no emulator, so this
    # is shorter than the hosted job. Timing out is how a wedged `adb` reaches
    # the cleanup step instead of leaving the device with a test package on it.
    timeout-minutes: 60
    permissions:
      contents: read
    # A fork's pull request must never reach a self-hosted runner attached to a
    # real device: the job would install and execute unreviewed code on it.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: toolchain versions
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
          java -version
          gradle --version | sed -n '1,8p'
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -1
          # The device this evidence is about. Named in the log before anything
          # is installed, so a reader can tell which silicon answered.
          if [ -z "${ANDROID_SERIAL:-}" ]; then
            echo "::error::ANDROID_SERIAL is unset; the rig must name the attached device"
            exit 1
          fi
          adb devices -l
          adb shell getprop ro.product.model
          adb shell getprop ro.build.version.release
          adb shell getprop ro.product.cpu.abi
          echo "page size: $(adb shell getconf PAGE_SIZE | tr -d '\r')"

      # A device carrying the previous run's install would let a stale APK
      # answer. `--reset` removes both packages and clears the local evidence
      # and logs.
      - name: reset to a known-clean state
        run: build/ci/ci-android.sh --reset --privileged

      - name: on-device native bridge and application lifecycle
        run: build/ci/ci-android.sh --privileged

      # EVERY exit path, including a timeout and a cancelled run. A device left
      # with the test package installed and the service running is a device the
      # next run cannot trust.
      - name: uninstall the packages and release the device
        if: always()
        run: build/ci/ci-android.sh --cleanup --privileged

      # DIAGNOSTICS ON FAILURE ONLY, and enumerated rather than globbed.
      #
      # `logcat.txt` carries reason codes, package names and stack traces from a
      # REAL user device. It carries NO private device key, NO pairing secret,
      # NO authentication token, NO tunnel plaintext and NO packet capture:
      # `NativeLinkRunTest` never calls `VpnService.establish()`, the identity
      # key never leaves the Keystore (ADR-0018 §11.16 (c)), and ADR-0015 §11.4
      # classes an address SENSITIVE so nothing in this shell logs one.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-android-device
          path: |
            build/ci/logs/android/instrumentation.log
            build/ci/logs/android/logcat.txt
          if-no-files-found: ignore

      # The device evidence, under its own name. `build/acceptance/report.py`
      # reads exactly `build/ci/evidence/android.json`, so uploading this as
      # `evidence-android` would let whichever job finished last decide what the
      # report says -- and a hosted emulator PASS must never be readable as a
      # physical-device PASS, nor the reverse.
      - name: publish the device evidence under its own name
        if: always()
        run: |
          if [ -f build/ci/evidence/android.json ]; then
            mv build/ci/evidence/android.json build/ci/evidence/android-device.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-android-device
          path: build/ci/evidence/android-device.json
          if-no-files-found: ignore

  # =========================================================================
  # THE CONJUNCTION.
  #
  # `needs:` is the mechanism: this job does not run at all unless every
  # blocker job above succeeded, so it cannot report green over a red one.
  # It then re-derives every platform verdict from that platform's own
  # machine-readable evidence, so a job that writes PASS with no lifecycle
  # transition is caught here rather than believed.
  #
  # It ends by asserting Phase 5 eligibility, which is COMPUTED from the rows
  # and never set by hand.
  # =========================================================================
  first-wave-acceptance:
    name: first-wave-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs:
      - core-crypto
      - pairing-mi
      - mutation-proof
      - linux-link-run
      - windows-link-run
      - macos-link-run
      - ios-link-run
      - android-link-run
    # THE THREE PRIVILEGED JOBS ARE REQUIRED, AND ARE DELIBERATELY NOT IN
    # `needs:`.
    #
    # They run on self-hosted runners. A `needs:` on a job whose runner label
    # is not registered does not fail -- it QUEUES, for up to twenty-four
    # hours, and the gate sits pending instead of returning a verdict. A check
    # that cannot go red is not a gate.
    #
    # So the requirement is enforced where it can be enforced promptly: each
    # privileged job writes its own evidence file with `privileged: true`, and
    # build/acceptance/report.py has a required row per file. No runner means
    # no file means NOT-EXECUTED, which counts against Phase 5 eligibility
    # exactly as a failure does -- immediately, and by name.
    #
    # This is strictly stronger than `needs:` would be, not a relaxation: a
    # self-hosted job that runs and goes green still cannot satisfy the row
    # unless it also recorded a real privileged lifecycle.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: toolchain versions
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          python3 --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: fwg-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}

      # Every platform job wrote one evidence file and uploaded it. Collect
      # them all back into build/ci/evidence/ so the report reads real files
      # rather than a job's word for it.
      - uses: actions/download-artifact@v4
        with:
          pattern: evidence-*
          path: build/ci/evidence-download
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: mutation-report
          path: build/proof
        continue-on-error: false

      - name: collect platform evidence
        run: |
          mkdir -p build/ci/evidence
          find build/ci/evidence-download -name '*.json' -exec cp {} build/ci/evidence/ \;
          ls -la build/ci/evidence/

      - name: make test-first-wave-gate
        run: make test-first-wave-gate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-wave-acceptance-report
          path: |
            build/acceptance/first-wave-acceptance.json
            build/acceptance/first-wave-acceptance.md
            build/ci/evidence/*.json
            build/proof/mutation-report.json
          if-no-files-found: error
