# twinvpn-crypto - the ONLY crate permitted a cryptographic dependency (ADR-0018 CD-I2)
#
# Owner: core-security. This manifest is owned by that agent; the WORKSPACE manifest
# at core/Cargo.toml is owned by the integration lead and must not be edited here.
[package]
name    = "twinvpn-crypto"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description = "the ONLY crate permitted a cryptographic dependency (ADR-0018 CD-I2)"

[dependencies]
twinvpn-types         = { workspace = true }
twinvpn-env           = { workspace = true }
twinvpn-schema        = { workspace = true }
thiserror             = { workspace = true }
snow                  = { workspace = true }
# `static_secrets` is required because the L-DATA static key is, by definition,
# static: ADR-0001 §7.2 has one X25519 static per device, hardware-wrapped and
# unsealed into the locked allocator, and `EphemeralSecret` cannot represent it.
# A per-crate feature, not a workspace-manifest change.
x25519-dalek          = { workspace = true, features = ["static_secrets"] }
ed25519-dalek         = { workspace = true }
p256                  = { workspace = true }
chacha20poly1305      = { workspace = true }
blake2                = { workspace = true }
sha2                  = { workspace = true }
hkdf                  = { workspace = true }
zeroize               = { workspace = true }
subtle                = { workspace = true }
rand_core             = { workspace = true }
ciborium              = { workspace = true }
coset                 = { workspace = true }
bytes                 = { workspace = true }
libc                  = { workspace = true }

[features]
# Deterministic signing fixtures for other crates' tests. CD-I2 covers
# dev-dependencies, so a crate that needs a signature in a test takes it from
# here rather than naming `p256` itself. Never enabled in a shipped build.
test-support = []

[dev-dependencies]
proptest              = { workspace = true }
# `test-support` gives the virtual clock an `Env` needs in a test. It is never
# enabled in a shipped build; `core/README.md` §3 records that.
twinvpn-env           = { workspace = true, features = ["test-support"] }
