# twinvpn-diag - the Tier-0 ring, event emission, redaction classification and bundle assembly (ADR-0015)
#
# Owner: core-composition. This manifest is owned by that agent; the WORKSPACE manifest
# at core/Cargo.toml is owned by the integration lead and must not be edited here.
[package]
name    = "twinvpn-diag"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description = "the Tier-0 ring, event emission, redaction classification and bundle assembly (ADR-0015)"

# Only what is actually used. A manifest that names an unused dependency makes
# a false statement about the graph, and CD-I2 and CD-I5 are graph checks.
[dependencies]
twinvpn-types         = { workspace = true }
twinvpn-env           = { workspace = true }
twinvpn-schema        = { workspace = true }
thiserror             = { workspace = true }
prost                 = { workspace = true }

[build-dependencies]
serde_json            = { workspace = true }

[dev-dependencies]
proptest              = { workspace = true }
