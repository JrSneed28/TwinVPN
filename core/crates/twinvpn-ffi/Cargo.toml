# twinvpn-ffi - the twinvpn.h C ABI. The ONLY crate on the DP-4 unsafe allowlist besides twinvpn-crypto
#
# Owner: core-composition. This manifest is owned by that agent; the WORKSPACE manifest
# at core/Cargo.toml is owned by the integration lead and must not be edited here.
[package]
name    = "twinvpn-ffi"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description = "the twinvpn.h C ABI. The ONLY crate on the DP-4 unsafe allowlist besides twinvpn-crypto"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

# The core's PROFILE, forwarded — nothing in this crate is switched by it. F-1
# makes the ABI a permanent obligation, so the surface is the same either way;
# what differs is which core sits behind it. `default = ["full"]` keeps every
# existing build identical, and `core-lite` (ADR-0018 §11.12, S-46) is the
# profile that drops `twinvpn-cp-client` and with it `quinn` -> `rustls` ->
# `ring`, whose build script needs an NDK C toolchain this host does not have.
# Without the pair `shells/android/jni` is compiled by nothing at all.
# `ownership.md` §11, G-4/G-6.
[features]
default   = ["full"]
full      = ["twinvpn-core/full"]
core-lite = ["twinvpn-core/core-lite"]

[dependencies]
twinvpn-core          = { workspace = true }
twinvpn-types         = { workspace = true }
twinvpn-env           = { workspace = true }
twinvpn-platform      = { workspace = true }
twinvpn-schema        = { workspace = true }
twinvpn-diag          = { workspace = true }
twinvpn-mgmt          = { workspace = true }
futures-core          = { workspace = true }
prost                 = { workspace = true }

# The iOS adapter, LINKED rather than called. `ownership.md` §10.4 puts the
# Swift bridge in `twinvpn-platform-ios`, and `shells/ios/Scripts/build-core.sh`
# builds exactly ONE archive — this crate's `staticlib`, renamed
# `libtwinvpn_core.a`. Without this edge every `twinvpn_ios_*` symbol the Swift
# side calls (`twinvpn_ios_bridge_register`, `twinvpn_ios_sink_push`, and the
# three `tw_host_vtable` entries in `twinvpn_platform_ios::hostvtable`) is
# undefined at the shell's link step.
#
# The direction is the composition root naming a platform implementation, which
# is the one CD-I5 permits; the inverse — a `twinvpn-platform-*` crate naming
# `twinvpn-core` — is what CD-I5 forbids and is not what this is. Target-gated,
# so no other target pays for it.
[target.'cfg(target_os = "ios")'.dependencies]
twinvpn-platform-ios  = { workspace = true }

[dev-dependencies]
twinvpn-core          = { workspace = true, features = ["test-support"] }
# For the one M-1 test that reads the ABI's event frame the way a NON-RUST shell
# reads it: as a length prefix and then plain JSON. Asserting that through
# `twinvpn-mgmt`'s own types would only prove the encoder agrees with itself.
serde_json            = { workspace = true }
