# twinvpn-platform-windows - the Windows implementation of the twinvpn-platform trait
# (CB-3 permits `cfg` here; CD-3 permits the platform time/entropy primitives here).
#
# Owner: desktop-windows. This manifest is owned by that domain; the WORKSPACE
# manifest at core/Cargo.toml is owned by the integration lead.
[package]
name    = "twinvpn-platform-windows"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description = "the Windows implementation of the twinvpn-platform trait (CB-3 permits cfg here)"

[features]
# The in-memory `sys::fake`, which is what lets the transactional layers above
# the syscall shim run their tests on a host that is not Windows. Off by
# default and unreachable from `WindowsPlatformAdapter::new`, so no production
# build can bind an enforcement engine that lives in a HashMap.
test-support = []

[dependencies]
twinvpn-types    = { workspace = true }
twinvpn-env      = { workspace = true }
twinvpn-platform = { workspace = true }
thiserror        = { workspace = true }
tokio            = { workspace = true, features = ["net", "rt", "sync", "io-util"] }
tracing          = { workspace = true }
futures-core     = { workspace = true }
serde_json       = { workspace = true }
zeroize          = { workspace = true }

# The version is pinned in the WORKSPACE manifest, which is the integration
# lead's; the feature list is this crate's, because a feature is what decides
# which syscalls exist and that is a property of this adapter and not of the
# workspace. Each is named for the surface it opens.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",                     # HANDLE, WIN32_ERROR, BOOL
  "Win32_NetworkManagement_IpHelper",     # MIB_IPFORWARD_ROW2, the notify APIs
  "Win32_NetworkManagement_Ndis",         # NET_LUID_LH
  "Win32_Networking_WinSock",             # sockets, SOCKADDR_INET, setsockopt
  "Win32_NetworkManagement_WindowsFilteringPlatform", # WFP: the whole Fwpm* surface
  "Win32_System_Rpc",                     # RPC_C_AUTHN_*, which FwpmEngineOpen0 takes
  "Win32_System_SystemInformation",       # GetSystemTimeAsFileTime, the wall clock
  "Win32_System_WindowsProgramming",      # QueryInterruptTimePrecise and its unbiased twin
  "Win32_System_Registry",                # the NRPT rules live in the registry
  "Win32_System_LibraryLoader",           # Wintun is loaded dynamically
  "Win32_System_Threading",               # the Wintun session's wait event
  "Win32_System_IO",                      # OVERLAPPED, for the notify callbacks
  "Win32_Security",                       # SECURITY_ATTRIBUTES, the SID types
  "Win32_Security_Cryptography",          # BCryptGenRandom, NCrypt*, DPAPI-NG
  "Win32_System_Memory",                  # VirtualLock, for CB-5's locked pages
] }

[dev-dependencies]
# TEST-ONLY, and deliberately not a dependency. This adapter takes ADR-0011
# §11.9's known-DoH endpoint list INJECTED (CD-2) and holds no copy of it, so the
# production crate graph is unchanged. `wfp::filters`' tests reach for
# `twinvpn_enforce::doh` because asserting the rendered filters against the
# registry's REAL contents -- rather than a fixture that can drift from
# `contracts/registry/encrypted_resolvers.json` -- is the only version of the
# test that would have failed on the defect F-3 records.
twinvpn-enforce = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "sync", "io-util", "macros"] }
# Integration-lead correction. `tests/enforcement.rs` is `#![cfg(feature =
# "test-support")]`, and the feature is off by default -- correctly, since it
# binds an in-memory engine no production build may reach. But `make test` runs
# `cargo test --workspace` with no features, so those 32 tests reported a
# cheerful `0 passed` and the gate never ran the enforcement suite at all. A
# self-referential dev-dependency turns the feature on for THIS crate's own test
# targets and for nothing else: production builds and every dependent still see
# it off. Same reasoning as CD-3's: a test that is never seen to run is not a
# mechanism.
twinvpn-platform-windows = { version = "0.1.0", path = ".", features = ["test-support"] }
