# twinvpn-trust - identity, pairing attestation, revocation and the Owner root-of-trust chain (ADR-0007)
#
# Owner: core-security. This manifest is owned by that agent; the WORKSPACE manifest
# at core/Cargo.toml is owned by the integration lead and must not be edited here.
[package]
name    = "twinvpn-trust"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description = "identity, pairing attestation, revocation and the Owner root-of-trust chain (ADR-0007)"

[dependencies]
twinvpn-types         = { workspace = true }
twinvpn-env           = { workspace = true }
twinvpn-schema        = { workspace = true }
twinvpn-crypto        = { workspace = true }
twinvpn-store         = { workspace = true }
twinvpn-platform      = { workspace = true }
thiserror             = { workspace = true }
bytes                 = { workspace = true }
prost                 = { workspace = true }

[features]
# Test scaffolding only. Never enabled in a shipped build.
test-support = ["twinvpn-crypto/test-support"]

[dev-dependencies]
proptest              = { workspace = true }
twinvpn-trust         = { version = "0.1.0", path = ".", features = ["test-support"] }
