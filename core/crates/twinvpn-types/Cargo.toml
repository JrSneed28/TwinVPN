# twinvpn-types - domain newtypes, identifiers, address types and the canonical ConnectionState
#
# Owner: core-foundation. This manifest is owned by that agent; the WORKSPACE manifest
# at core/Cargo.toml is owned by the integration lead and must not be edited here.
#
# ADR-0018 §11.7 puts this crate at the root of the dependency arrows, so it
# depends on NO other workspace crate and its runtime dependency set is three
# crates that implement no domain logic of their own:
#
#   thiserror  the error derive
#   zeroize    memory hygiene - the scrub behind ChannelBinding's ZeroizeOnDrop
#   subtle     constant-time comparison for ChannelBinding::verify_against
#
# `zeroize` and `subtle` are NOT cryptographic implementations - neither has a
# cipher, hash, KDF, signature scheme or key exchange in it - so CD-I2 does not
# restrict them to `twinvpn-crypto`. Integration-lead ruling, 2026-08-27; the
# reasoning is recorded at the exemption in core/xtask/src/checks.rs.
#
# `serde_json` appears only under [build-dependencies]: build.rs compiles the
# frozen reason-code registry into a static table, and none of it is linked into
# the artifact.
[package]
name    = "twinvpn-types"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description = "domain newtypes, identifiers, address types and the canonical ConnectionState"

[dependencies]
thiserror             = { workspace = true }
zeroize               = { workspace = true }
subtle                = { workspace = true }

[build-dependencies]
serde_json            = { workspace = true }

# `twinvpn-schema` here is a DEV-dependency and nothing else — F-6.
#
# Eleven enums in this crate mirror a frozen `twinvpn.v1` enum by hand, and until
# `tests/contract_enum_equivalence.rs` existed nothing linked them to
# `contracts/gen`. The generated bindings are not a crate of their own: they are
# `include!`d by `twinvpn-schema`, which depends on this crate, so a normal
# dependency in the other direction is a cycle Cargo will not build — which is
# exactly why the enums were mirrored by hand in the first place.
#
# The dev edge is the exception the workspace has already ruled on.
# `xtask::manifest::Package::non_dev_dependencies` computes CD-I5 over non-dev
# edges only, because "a dev-dependency is not a path between the planes in any
# shipped artifact — it exists only while a test binary is being built", and
# `ownership.md` §10.8 M-5 records that counting dev edges made the
# architecture's own falsification tests unwritable by the crates that had to
# write them. The §11.7 arrow is unchanged: this crate's SHIPPED dependency set
# is still thiserror + zeroize + subtle, and `cargo tree -e normal` shows no
# workspace crate.
[dev-dependencies]
proptest              = { workspace = true }
twinvpn-schema        = { workspace = true }
