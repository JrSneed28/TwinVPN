# twinvpn-platform-macos - the macOS/Darwin implementation of the twinvpn-platform
# trait (CB-3 permits `cfg` here; CD-3 permits the platform time/entropy primitives).
#
# Owner: desktop-macos. This manifest is owned by that domain; the WORKSPACE
# manifest at core/Cargo.toml is owned by the integration lead.
#
# THE HOST THIS IS DEVELOPED ON IS LINUX. Everything above the syscall shim is
# deliberately target-free so that `cargo test -p twinvpn-platform-macos` EXECUTES
# it here: the pf anchor text and its `pfctl` read-back parse, the route
# programme, the NEPacketTunnelNetworkSettings document, the resolver programme,
# the PF_ROUTE message decoder, the mach timebase arithmetic, the errno /
# OSStatus / SCError mapping and the power-event state machine all run on Linux.
# `make cross-check` type-checks the whole crate for aarch64-apple-darwin against
# the real Darwin sys crates with `-D warnings`, which is a COMPILE proof and
# never a behaviour proof.
[package]
name    = "twinvpn-platform-macos"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description = "the macOS implementation of the twinvpn-platform trait (CB-3 permits cfg here)"

[dependencies]
twinvpn-types    = { workspace = true }
twinvpn-env      = { workspace = true }
twinvpn-platform = { workspace = true }
thiserror        = { workspace = true }
libc             = { workspace = true }
socket2          = { workspace = true }
tokio            = { workspace = true, features = ["net", "rt", "sync", "io-util"] }
tracing          = { workspace = true }
futures-core     = { workspace = true }
serde_json       = { workspace = true }
zeroize          = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys      = { workspace = true }
# `OSX_10_15` is what exposes `kSecUseDataProtectionKeychain`, which ADR-0020's
# macOS system-extension row requires (`kSecUseDataProtectionKeychain = true`).
# The default feature set is `OSX_10_13`, on which the symbol does not exist and
# the data-protection keychain cannot be selected at all. The version floor this
# implies -- macOS 10.15 -- is far below the Apple-silicon and T2 hardware that
# row is about, so it costs nothing.
security-framework-sys   = { workspace = true, features = ["OSX_10_15"] }
system-configuration-sys = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "sync", "io-util", "macros"] }
# CD-5 calls the mock "the payoff": with every shell deleted and a mock adapter
# bound, the core must still make every decision correctly (CB-2's falsification
# test). `tests/lifecycle.rs` runs the macOS adapter and the mock through the SAME
# trait object, so a property that holds for one and not the other is a decision
# that leaked into this adapter.
twinvpn-platform = { workspace = true, features = ["mock"] }
futures-util     = { workspace = true }
