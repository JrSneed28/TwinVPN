# twinvpn-store - record envelopes, AEAD, namespaces, migration, monotone-floor rejection, recovery (ADR-0020)
#
# Owner: core-security. This manifest is owned by that agent; the WORKSPACE manifest
# at core/Cargo.toml is owned by the integration lead and must not be edited here.
[package]
name    = "twinvpn-store"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description = "record envelopes, AEAD, namespaces, migration, monotone-floor rejection, recovery (ADR-0020)"

[dependencies]
twinvpn-types         = { workspace = true }
twinvpn-env           = { workspace = true }
twinvpn-schema        = { workspace = true }
twinvpn-crypto        = { workspace = true }
twinvpn-platform      = { workspace = true }
thiserror             = { workspace = true }
bytes                 = { workspace = true }
prost                 = { workspace = true }
tracing               = { workspace = true }

[features]
# Test scaffolding only. Never enabled in a shipped build.
test-support = ["twinvpn-env/test-support", "twinvpn-platform/mock"]

[dev-dependencies]
proptest              = { workspace = true }
twinvpn-store         = { version = "0.1.0", path = ".", features = ["test-support"] }
futures-core          = { workspace = true }
