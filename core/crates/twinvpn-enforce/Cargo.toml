# twinvpn-enforce - kill-switch latch, reconciler and desired-ruleset computation (ADR-0012)
#
# Owner: core-dataplane. This manifest is owned by that agent; the WORKSPACE manifest
# at core/Cargo.toml is owned by the integration lead and must not be edited here.
[package]
name    = "twinvpn-enforce"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description = "kill-switch latch, reconciler and desired-ruleset computation (ADR-0012)"

[dependencies]
# The known-encrypted-resolver registry is embedded with `include_str!` and
# parsed here (see `doh`). No file is read at runtime, so this does not give the
# crate an I/O surface.
serde_json            = { workspace = true }
twinvpn-types         = { workspace = true }
twinvpn-env           = { workspace = true }
twinvpn-schema        = { workspace = true }
twinvpn-platform      = { workspace = true }
# ADR-0012 §11.13's `ruleset_digest` is a hash, and CD-I2 puts every
# cryptographic implementation behind this crate. `twinvpn_crypto::sha256` is the
# same entry point `twinvpn-store`'s `Vault::digest` uses, so there is one hash
# here rather than a second one grown locally.
twinvpn-crypto        = { workspace = true }
twinvpn-route         = { workspace = true }
twinvpn-dns           = { workspace = true }
thiserror             = { workspace = true }

[dev-dependencies]
proptest              = { workspace = true }
