# twinvpn-platform-android - the Android (bionic, VpnService) implementation of
# the twinvpn-platform trait (CB-3 permits `cfg` here; CD-3 permits the platform
# time/entropy primitives).
#
# Owner: mobile-android. This manifest is owned by that domain; the WORKSPACE
# manifest at core/Cargo.toml is owned by the integration lead.
#
# ADR-0018 §11.9 row 3 / build/budgets.toml: the core artifact for this target is
# a CDYLIB, <= 6 MB stripped PER ABI, 16 KiB load alignment (C-12). Every
# dependency added here is spent against that ceiling, per ABI.
[package]
name    = "twinvpn-platform-android"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description = "the Android implementation of the twinvpn-platform trait (CB-3 permits cfg here)"

# ADR-0018 §11.9 row 3: the shipped artifact for this target is a CDYLIB, and
# `NativeBridge`'s `System.loadLibrary("twinvpn_platform_android")` is what loads
# it. Without this line cargo produced an `rlib` only, so
# `libtwinvpn_platform_android.so` did not exist -- the file
# `shells/android/README.md` §3.2 tells a builder to copy, and the first library
# the app loads at startup. A missing ABI is ADR-0018 VR-4's packaging defect;
# a missing LIBRARY was the same defect one level up, and it was invisible
# because nothing on the host ever asked for the artifact.
#
# `rlib` is kept beside it: `twinvpn-platform-android`'s own tests and the four
# crates that name it by path need one, and dropping it would turn a
# type-checkable dependency into a linkage.
[lib]
crate-type = ["cdylib", "rlib"]

# The `Java_…` JNI symbols and the JVM-backed hostcalls, ON by default so the
# shipped CDYLIB above is unchanged.
#
# It exists so `shells/android/jni` can link this crate with
# `default-features = false` and get `hostvtable`'s three W-7 capabilities
# WITHOUT a second copy of `bridge::entry`'s `#[no_mangle]` symbols. Both
# libraries are loaded into one process, so a duplicate `Java_…` name would be
# resolved by load order and would carry its own, separate adapter registry.
# See `src/bridge/mod.rs` for the full note.
[features]
default    = ["jvm-bridge"]
jvm-bridge = []

[dependencies]
twinvpn-types    = { workspace = true }
twinvpn-env      = { workspace = true }
twinvpn-platform = { workspace = true }
thiserror        = { workspace = true }
libc             = { workspace = true }
socket2          = { workspace = true }
tokio            = { workspace = true, features = ["net", "rt", "sync", "io-util"] }
tracing          = { workspace = true }
futures-core     = { workspace = true }
serde_json       = { workspace = true }
zeroize          = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni         = { workspace = true }
ndk-context = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "sync", "io-util", "macros"] }
twinvpn-platform = { workspace = true, features = ["mock"] }

# CB-2's falsification test, run rather than asserted. `ownership.md` §10.5 rule
# 1 requires every row of the mobile matrix that CAN be a host-runnable test over
# the mock adapter to BE one, and three of those rows -- roaming producing
# MIGRATING, a revoked peer, a restored connection -- are decisions the CORE
# makes rather than translations this adapter performs. `tests/matrix.rs`
# therefore drives the real `twinvpn-session` machine.
#
# No cycle: `twinvpn-session` depends on `twinvpn-platform`, the TRAIT crate, and
# on no `twinvpn-platform-*` implementation, so the arrows of ADR-0018 §11.7 are
# unchanged. Confined to a NON-Android cfg because the falsification test is a
# host test by construction -- there is no device in `make test` -- which also
# keeps `make cross-check` light.
#
# `twinvpn-core` is DELIBERATELY ABSENT, and the reason is a finding rather than
# a preference. `twinvpn_core::session_loop::event_for_change` is the function
# that turns a `NetworkChange` into an `EV_*`, and joining this crate's facts to
# the machine's verdict in ONE test would need it. But `cargo run -p xtask --
# lint` reads `cargo metadata`'s dependency list WITHOUT filtering on kind, so a
# dev-dependency on `twinvpn-core` -- which names both planes -- fails CD-I5 for
# this crate. `core/xtask` is `core-foundation`'s and is not this domain's to
# change, so the test asserts the two halves separately and cites where the join
# is already covered (`twinvpn-core`'s own `session_loop` tests). Reported.
[target.'cfg(not(target_os = "android"))'.dev-dependencies]
twinvpn-session = { workspace = true }
twinvpn-env     = { workspace = true, features = ["test-support"] }
