# twinvpn-platform-linux - the Linux/OpenWrt implementation of the twinvpn-platform trait (CB-3 permits cfg here)
#
# Owner: desktop-linux. This manifest is owned by that agent; the WORKSPACE manifest
# at core/Cargo.toml is owned by the integration lead and must not be edited here.
[package]
name    = "twinvpn-platform-linux"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description = "the Linux/OpenWrt implementation of the twinvpn-platform trait (CB-3 permits cfg here)"

[dependencies]
twinvpn-types         = { workspace = true }
twinvpn-env           = { workspace = true }
twinvpn-platform      = { workspace = true }
thiserror             = { workspace = true }
libc                  = { workspace = true }
socket2               = { workspace = true }
# `net` for the AsyncFd readiness driver the UDP and netlink sockets run on;
# `rt`/`sync` for the shutdown latch. NOT `time`: CD-3 bans the runtime's own
# time module outside `twinvpn-env`'s binding, and every deadline in this crate
# is the core's, composed from `twinvpn_env::Timer`.
tokio                 = { workspace = true, features = ["net", "rt", "sync", "io-util"] }
tracing               = { workspace = true }
futures-core          = { workspace = true }
serde_json            = { workspace = true }
zeroize               = { workspace = true }

[dev-dependencies]
# TEST-ONLY, and deliberately not a dependency. This adapter takes ADR-0011
# §11.9's known-DoH endpoint list INJECTED (CD-2) and holds no copy of it, so the
# production crate graph is unchanged and the arrow still points one way. The
# nft.rs tests reach for `twinvpn_enforce::doh` because asserting the rendered
# rules against the registry's REAL contents -- rather than a fixture that can
# drift from `contracts/registry/encrypted_resolvers.json` -- is the only version
# of the test that would have failed on the defect F-3 records.
twinvpn-enforce       = { workspace = true }
tokio                 = { workspace = true, features = ["net", "rt", "rt-multi-thread", "sync", "io-util", "macros"] }
