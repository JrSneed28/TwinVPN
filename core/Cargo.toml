# The TwinVPN shared core.
#
# ADR-0018 §11.12: "/core/ one cargo workspace, all twinvpn-* crates".
# ADR-0018 §11.7 fixes the crate set and the dependency arrows between them.
#
# ============================================================================
# THIS MANIFEST IS OWNED BY THE INTEGRATION LEAD.
# ============================================================================
# Implementation agents own their own crate directories and their own
# per-crate Cargo.toml. They MUST NOT edit this file: it is the shared manifest
# that CLAUDE.md reserves to the integration owner, and two writers here is the
# concurrency failure the worktree split exists to prevent. A crate that needs a
# new workspace-level dependency asks the integration lead for it.
[workspace]
resolver = "2"
members = [
  "crates/twinvpn-types",
  "crates/twinvpn-env",
  "crates/twinvpn-schema",
  "crates/twinvpn-platform",
  "crates/twinvpn-crypto",
  "crates/twinvpn-store",
  "crates/twinvpn-trust",
  "crates/twinvpn-cp-client",
  "crates/twinvpn-tunnel",
  "crates/twinvpn-path",
  "crates/twinvpn-relay-client",
  "crates/twinvpn-route",
  "crates/twinvpn-dns",
  "crates/twinvpn-enforce",
  "crates/twinvpn-gateway",
  "crates/twinvpn-session",
  "crates/twinvpn-diag",
  "crates/twinvpn-mgmt",
  "crates/twinvpn-core",
  "crates/twinvpn-ffi",
  "crates/twinvpn-platform-linux",
  "crates/twinvpn-platform-windows",
  "crates/twinvpn-platform-macos",
  "crates/twinvpn-platform-ios",
  "crates/twinvpn-platform-android",
  "xtask",
]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
rust-version = "1.90"
license    = "Apache-2.0"
repository = "https://github.com/twinvpn/twinvpn"

# ---------------------------------------------------------------------------
# Workspace dependencies. Every version is pinned to a single minor line so the
# lockfile is the only place a version can move, and ADR-0018 §11.11's
# supply-chain policy has one place to audit.
#
# CD-I2 (ADR-0018 §11.7): ONLY `twinvpn-crypto` may declare a dependency on a
# cryptographic implementation. The crypto entries below exist so that crate can
# name them; `cargo xtask lint` fails the build if any other crate does.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# -- intra-workspace --------------------------------------------------------
twinvpn-types          = { path = "crates/twinvpn-types" }
twinvpn-env            = { path = "crates/twinvpn-env" }
twinvpn-schema         = { path = "crates/twinvpn-schema" }
twinvpn-platform       = { path = "crates/twinvpn-platform" }
twinvpn-crypto         = { path = "crates/twinvpn-crypto" }
twinvpn-store          = { path = "crates/twinvpn-store" }
twinvpn-trust          = { path = "crates/twinvpn-trust" }
twinvpn-cp-client      = { path = "crates/twinvpn-cp-client" }
twinvpn-tunnel         = { path = "crates/twinvpn-tunnel" }
twinvpn-path           = { path = "crates/twinvpn-path" }
twinvpn-relay-client   = { path = "crates/twinvpn-relay-client" }
twinvpn-route          = { path = "crates/twinvpn-route" }
twinvpn-dns            = { path = "crates/twinvpn-dns" }
twinvpn-enforce        = { path = "crates/twinvpn-enforce" }
twinvpn-gateway        = { path = "crates/twinvpn-gateway" }
twinvpn-session        = { path = "crates/twinvpn-session" }
twinvpn-diag           = { path = "crates/twinvpn-diag" }
twinvpn-mgmt           = { path = "crates/twinvpn-mgmt" }
twinvpn-core           = { path = "crates/twinvpn-core" }
twinvpn-platform-linux = { path = "crates/twinvpn-platform-linux" }
twinvpn-platform-windows = { path = "crates/twinvpn-platform-windows" }
twinvpn-platform-macos = { path = "crates/twinvpn-platform-macos" }
twinvpn-platform-ios   = { path = "crates/twinvpn-platform-ios" }
twinvpn-platform-android = { path = "crates/twinvpn-platform-android" }

# -- general ----------------------------------------------------------------
thiserror       = "2.0"
bytes           = "1.10"
prost           = "0.13"
prost-types     = "0.13"
serde           = { version = "1.0", features = ["derive"] }
serde_json      = "1.0"
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
arrayvec        = "0.7"
hex             = "0.4"
socket2         = "0.6"
libc            = "0.2"

# -- per-target platform FFI. Declared here so the wave-2 and wave-3 adapter
# crates name a pinned version like every other dependency; each is reachable
# ONLY from a [target.'cfg(...)'] block in the adapter that needs it, so a Linux
# build never resolves them. CB-3 keeps them out of every other crate.
windows-sys              = "0.61"
core-foundation-sys      = "0.8"
security-framework-sys   = "2.14"
system-configuration-sys = "0.6"
# wave 3, Android only. `jni` is the JNI calling convention, not a decision
# surface: CB-2 confines it to marshalling between the Kotlin shell and this
# adapter. `ndk-context` yields the JavaVM/Context the shell registered, so the
# adapter never discovers ambient state (CD-2).
jni                      = "0.21"
ndk-context              = "0.1"

# -- async ------------------------------------------------------------------
# CD-1/CD-2: the runtime is a capability behind `twinvpn-env`. No crate outside
# `twinvpn-env` and the shells may reach for tokio's time or rng modules; the
# `xtask lint` deny-list enforces it.
tokio      = { version = "1.48", default-features = false }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

# -- cryptography: CD-I2 restricts these to `twinvpn-crypto` ----------------
# `default-features = false` is load-bearing and NOT a size optimisation.
#
# snow 0.10's `std` feature list contains `ring/std`, written without the `?`,
# so enabling `std` force-enables the optional `ring` dependency -- and `ring`
# builds C. That single edge is why `twinvpn-core` could not be cross-compiled
# for x86_64-pc-windows-msvc or aarch64-apple-darwin on a Linux host: `ring`'s
# build script refuses a GNU compiler for an MSVC target and needs `lib.exe`,
# and it fails before reaching a line of our code. Both wave-2 shells hit it
# independently and each had to push its core-hosting code outside
# `make cross-check`.
#
# The primitives are unchanged. ADR-0001 §11 fixes X25519, ChaCha20-Poly1305 and
# BLAKE2s, and the default resolver supplies exactly those through
# curve25519-dalek, chacha20poly1305 and blake2 -- the same crates
# `core/Cargo.toml` already pins for `twinvpn-crypto` under CD-I2. What changes
# is which implementation computes them, not which ones they are.
snow               = { version = "0.10", default-features = false, features = [
  "default-resolver", "use-curve25519", "use-chacha20poly1305", "use-blake2",
  "use-sha2", "use-getrandom",
] }
x25519-dalek       = "3.0"
ed25519-dalek      = "3.0"
p256               = "0.14"
chacha20poly1305   = "0.11"
blake2             = "0.11"
sha2               = "0.11"
hkdf               = "0.13"
rand_core          = "0.9"
ciborium           = "0.2"
coset              = "0.4"

# -- NOT restricted by CD-I2, though they sit in this section --------------
# CD-I2's text is "a dependency on a cryptographic IMPLEMENTATION", and
# ADR-0018 §11.7 states its purpose: it is "P2's static half", so a reviewer
# asking WHAT CRYPTOGRAPHY DO WE USE has exactly one crate to read.
#
# Neither of these two answers that question. `zeroize` is memory hygiene - a
# volatile write and a compiler fence. `subtle` is constant-time comparison
# primitives. Neither implements a cipher, a hash, a KDF, a signature scheme or
# a key exchange, so neither adds a line to what that reviewer is looking for.
#
# Reading CD-I2 to forbid them makes the security WORSE, which cannot be what a
# rule that exists to make cryptography auditable intends: without `zeroize` a
# secret's scrub is an elidable `fill(0)`, and without `subtle` a channel-binding
# comparison is data-dependent with no compiler barrier. Both were live residuals
# in this workspace before this ruling.
#
# Integration-lead ruling, 2026-08-27: an interpretation of ADR-0018, not an
# amendment to it. `cargo run -p xtask -- lint` implements the exemption in
# `CD_I2_NOT_CRYPTO_IMPLEMENTATIONS`, and the tests beside it assert that the
# hole did not widen - every other name above is still restricted.
zeroize            = { version = "1.9", features = ["derive"] }
subtle             = "2.6"

# -- test-only --------------------------------------------------------------
proptest   = "1.8"
insta      = "1.44"

# ---------------------------------------------------------------------------
# ADR-0018 §11.3 release profile.
#   panic = "unwind" in EVERY shipped profile - NOT abort - because F-7's
#   containment requires catch_unwind at the FFI boundary.
# ---------------------------------------------------------------------------
[profile.release]
lto           = "fat"
codegen-units = 1
strip         = "symbols"
opt-level     = 3
panic         = "unwind"

# Router-class targets (OpenWrt, GC-0). Selected by `--profile release-small`.
[profile.release-small]
inherits      = "release"
opt-level     = "z"
panic         = "unwind"

[profile.dev]
panic = "unwind"
