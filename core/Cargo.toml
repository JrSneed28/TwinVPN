# The TwinVPN shared core.
#
# ADR-0018 §11.12: "/core/ one cargo workspace, all twinvpn-* crates".
# ADR-0018 §11.7 fixes the crate set and the dependency arrows between them.
#
# ============================================================================
# THIS MANIFEST IS OWNED BY THE INTEGRATION LEAD.
# ============================================================================
# Implementation agents own their own crate directories and their own
# per-crate Cargo.toml. They MUST NOT edit this file: it is the shared manifest
# that CLAUDE.md reserves to the integration owner, and two writers here is the
# concurrency failure the worktree split exists to prevent. A crate that needs a
# new workspace-level dependency asks the integration lead for it.
[workspace]
resolver = "2"
members = [
  "crates/twinvpn-types",
  "crates/twinvpn-env",
  "crates/twinvpn-schema",
  "crates/twinvpn-platform",
  "crates/twinvpn-crypto",
  "crates/twinvpn-store",
  "crates/twinvpn-trust",
  "crates/twinvpn-cp-client",
  "crates/twinvpn-tunnel",
  "crates/twinvpn-path",
  "crates/twinvpn-relay-client",
  "crates/twinvpn-route",
  "crates/twinvpn-dns",
  "crates/twinvpn-enforce",
  "crates/twinvpn-gateway",
  "crates/twinvpn-session",
  "crates/twinvpn-diag",
  "crates/twinvpn-mgmt",
  "crates/twinvpn-core",
  "crates/twinvpn-ffi",
  "crates/twinvpn-platform-linux",
  "crates/twinvpn-platform-windows",
  "crates/twinvpn-platform-macos",
  "crates/twinvpn-platform-ios",
  "crates/twinvpn-platform-android",
  "xtask",
]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
rust-version = "1.90"
license    = "Apache-2.0"
repository = "https://github.com/twinvpn/twinvpn"

# ---------------------------------------------------------------------------
# Workspace dependencies. Every version is pinned to a single minor line so the
# lockfile is the only place a version can move, and ADR-0018 §11.11's
# supply-chain policy has one place to audit.
#
# CD-I2 (ADR-0018 §11.7): ONLY `twinvpn-crypto` may declare a dependency on a
# cryptographic implementation. The crypto entries below exist so that crate can
# name them; `cargo xtask lint` fails the build if any other crate does.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# DP-1 -- "NO UNBOUNDED VERSION RANGES". The `version` next to every `path`
# below is not redundant. A path dependency with no `version` key is a `*`
# requirement, and build/deny.toml mechanises DP-1 as `wildcards = "deny"`.
# `allow-wildcard-paths` there does NOT exempt these: cargo-deny applies it only
# to crates declared private, and these are not declared private. So the bound
# is written on the edge itself, which is where DP-1 asks for it. The `path`
# still wins for resolution; the `version` is what an auditor reads.
# -- intra-workspace --------------------------------------------------------
twinvpn-types          = { version = "0.1.0", path = "crates/twinvpn-types" }
twinvpn-env            = { version = "0.1.0", path = "crates/twinvpn-env" }
twinvpn-schema         = { version = "0.1.0", path = "crates/twinvpn-schema" }
twinvpn-platform       = { version = "0.1.0", path = "crates/twinvpn-platform" }
twinvpn-crypto         = { version = "0.1.0", path = "crates/twinvpn-crypto" }
twinvpn-store          = { version = "0.1.0", path = "crates/twinvpn-store" }
twinvpn-trust          = { version = "0.1.0", path = "crates/twinvpn-trust" }
twinvpn-cp-client      = { version = "0.1.0", path = "crates/twinvpn-cp-client" }
twinvpn-tunnel         = { version = "0.1.0", path = "crates/twinvpn-tunnel" }
twinvpn-path           = { version = "0.1.0", path = "crates/twinvpn-path" }
twinvpn-relay-client   = { version = "0.1.0", path = "crates/twinvpn-relay-client" }
twinvpn-route          = { version = "0.1.0", path = "crates/twinvpn-route" }
twinvpn-dns            = { version = "0.1.0", path = "crates/twinvpn-dns" }
twinvpn-enforce        = { version = "0.1.0", path = "crates/twinvpn-enforce" }
twinvpn-gateway        = { version = "0.1.0", path = "crates/twinvpn-gateway" }
twinvpn-session        = { version = "0.1.0", path = "crates/twinvpn-session" }
twinvpn-diag           = { version = "0.1.0", path = "crates/twinvpn-diag" }
twinvpn-mgmt           = { version = "0.1.0", path = "crates/twinvpn-mgmt" }
# `default-features = false` so the one consumer in this workspace,
# `twinvpn-ffi`, can forward the PROFILE rather than inherit it. `twinvpn-ffi`
# re-enables `full` through its own default feature, so every build in this
# workspace is what it was; the point is that a `core-lite` ABI becomes
# buildable, which is the only way `shells/android/jni` gets compiled at all on
# a host with no NDK. `ownership.md` §11, G-4/G-6.
twinvpn-core           = { version = "0.1.0", path = "crates/twinvpn-core", default-features = false }
twinvpn-platform-linux = { version = "0.1.0", path = "crates/twinvpn-platform-linux" }
twinvpn-platform-windows = { version = "0.1.0", path = "crates/twinvpn-platform-windows" }
twinvpn-platform-macos = { version = "0.1.0", path = "crates/twinvpn-platform-macos" }
twinvpn-platform-ios   = { version = "0.1.0", path = "crates/twinvpn-platform-ios" }
twinvpn-platform-android = { version = "0.1.0", path = "crates/twinvpn-platform-android" }

# -- general ----------------------------------------------------------------
thiserror       = "2.0"
bytes           = "1.10"
prost           = "0.13"
prost-types     = "0.13"
serde           = { version = "1.0", features = ["derive"] }
serde_json      = "1.0"
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
arrayvec        = "0.7"
hex             = "0.4"
socket2         = "0.6"
libc            = "0.2"

# -- per-target platform FFI. Declared here so the wave-2 and wave-3 adapter
# crates name a pinned version like every other dependency; each is reachable
# ONLY from a [target.'cfg(...)'] block in the adapter that needs it, so a Linux
# build never resolves them. CB-3 keeps them out of every other crate.
windows-sys              = "0.61"
core-foundation-sys      = "0.8"
security-framework-sys   = "2.14"
system-configuration-sys = "0.6"
# wave 3, Android only. `jni` is the JNI calling convention, not a decision
# surface: CB-2 confines it to marshalling between the Kotlin shell and this
# adapter. `ndk-context` yields the JavaVM/Context the shell registered, so the
# adapter never discovers ambient state (CD-2).
jni                      = "0.21"
ndk-context              = "0.1"

# -- async ------------------------------------------------------------------
# CD-1/CD-2: the runtime is a capability behind `twinvpn-env`. No crate outside
# `twinvpn-env` and the shells may reach for tokio's time or rng modules; the
# `xtask lint` deny-list enforces it.
tokio      = { version = "1.48", default-features = false }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

# -- L-CONTROL rung 1, for `twinvpn-cp-client` ONLY -------------------------
#
# Finding W-12 (`docs/implementation/ownership.md` §8) rules that `rustls` -- the
# TLS implementation, the raw-public-key verifier, the cipher policy, the
# `CryptoProvider` -- is cryptography and belongs to `twinvpn-crypto`, while
# `quinn` "is a transport protocol implementation that takes its cryptography
# from rustls and implements none itself" and may sit in `twinvpn-cp-client`.
# `CRYPTO_CRATES` in `core/xtask/src/checks.rs` implements exactly that split:
# `rustls` is on the list, `quinn` is not.
#
# `default-features = false` with `rustls-ring` is load-bearing and is the same
# decision `services/Cargo.toml` and `lab/twinsim/Cargo.toml` already record: a
# crate that named `rustls` directly would activate its default `aws-lc-rs`
# alongside quinn's `ring` and put TWO `CryptoProvider`s in one artifact --
# ADR-0018 DP-8's fleet bound violated through a feature flag rather than a
# dependency line, with no line for a reviewer to catch. So the binding names
# `quinn::rustls::...` and never `rustls::...`, and CD-I2 stays true as written.
#
# Added by the integration lead to close W-12. Before this line the composed
# core had no L-CONTROL transport at all and `twinvpnd` refused every
# C1-mapping operation for that reason.
quinn = { version = "0.11", default-features = false, features = [
  "rustls-ring", "runtime-tokio", "log",
] }

# -- cryptography: CD-I2 restricts these to `twinvpn-crypto` ----------------
# `default-features = false` is load-bearing and NOT a size optimisation.
#
# snow 0.10's `std` feature list contains `ring/std`, written without the `?`,
# so enabling `std` force-enables the optional `ring` dependency -- and `ring`
# builds C. That single edge is why `twinvpn-core` could not be cross-compiled
# for x86_64-pc-windows-msvc or aarch64-apple-darwin on a Linux host: `ring`'s
# build script refuses a GNU compiler for an MSVC target and needs `lib.exe`,
# and it fails before reaching a line of our code. Both wave-2 shells hit it
# independently and each had to push its core-hosting code outside
# `make cross-check`.
#
# The primitives are unchanged. ADR-0001 §11 fixes X25519, ChaCha20-Poly1305 and
# BLAKE2s, and the default resolver supplies exactly those through
# curve25519-dalek, chacha20poly1305 and blake2 -- the same crates
# `core/Cargo.toml` already pins for `twinvpn-crypto` under CD-I2. What changes
# is which implementation computes them, not which ones they are.
#
# `risky-raw-split` is a PURE FEATURE FLAG and NOT a dependency-surface change.
# snow 0.10.0's own manifest declares it as `risky-raw-split = []` -- an empty
# list, which pulls in no crate and enables no optional dependency. It gates
# exactly one method, `HandshakeState::dangerously_get_raw_split`. ADR-0018 DP-3
# governs the DEPENDENCY surface, so it is not engaged here: the graph
# `cargo tree` prints is identical with and without this feature.
#
# What it is for: `twinvpn_crypto::established::HandshakeSecret` extracts
# ADR-0001 §7.3.2's `handshake_secret` from the two raw split outputs. That
# module states why the extract is one-way, and why the handshake hash is not a
# substitute for it.
snow               = { version = "0.10", default-features = false, features = [
  "default-resolver", "use-curve25519", "use-chacha20poly1305", "use-blake2",
  "use-sha2", "use-getrandom", "risky-raw-split",
] }
x25519-dalek       = "3.0"
ed25519-dalek      = "3.0"
p256               = "0.14"
chacha20poly1305   = "0.11"
blake2             = "0.11"
sha2               = "0.11"
hkdf               = "0.13"
rand_core          = "0.9"
ciborium           = "0.2"
coset              = "0.4"

# -- NOT restricted by CD-I2, though they sit in this section --------------
# CD-I2's text is "a dependency on a cryptographic IMPLEMENTATION", and
# ADR-0018 §11.7 states its purpose: it is "P2's static half", so a reviewer
# asking WHAT CRYPTOGRAPHY DO WE USE has exactly one crate to read.
#
# Neither of these two answers that question. `zeroize` is memory hygiene - a
# volatile write and a compiler fence. `subtle` is constant-time comparison
# primitives. Neither implements a cipher, a hash, a KDF, a signature scheme or
# a key exchange, so neither adds a line to what that reviewer is looking for.
#
# Reading CD-I2 to forbid them makes the security WORSE, which cannot be what a
# rule that exists to make cryptography auditable intends: without `zeroize` a
# secret's scrub is an elidable `fill(0)`, and without `subtle` a channel-binding
# comparison is data-dependent with no compiler barrier. Both were live residuals
# in this workspace before this ruling.
#
# Integration-lead ruling, 2026-08-27: an interpretation of ADR-0018, not an
# amendment to it. `cargo run -p xtask -- lint` implements the exemption in
# `CD_I2_NOT_CRYPTO_IMPLEMENTATIONS`, and the tests beside it assert that the
# hole did not widen - every other name above is still restricted.
zeroize            = { version = "1.9", features = ["derive"] }
subtle             = "2.6"

# -- test-only --------------------------------------------------------------
proptest   = "1.8"
insta      = "1.44"

# ---------------------------------------------------------------------------
# ADR-0018 §11.3 release profile.
#   panic = "unwind" in EVERY shipped profile - NOT abort - because F-7's
#   containment requires catch_unwind at the FFI boundary.
# ---------------------------------------------------------------------------
[profile.release]
lto           = "fat"
codegen-units = 1
strip         = "symbols"
opt-level     = 3
panic         = "unwind"

# Router-class targets (OpenWrt, GC-0). Selected by `--profile release-small`.
[profile.release-small]
inherits      = "release"
opt-level     = "z"
panic         = "unwind"

[profile.dev]
panic = "unwind"
