# Local log backend for TwinVPN INFRASTRUCTURE structured logs.
#
# ADR-0015 §11.5 fixes the level table and its one absolute rule: "NO LEVEL, IN
# ANY BUILD, MAY EMIT SECRET. Per-packet logging does not exist at any level."
# That is the emitter's obligation (O-14: redaction at emit time by schema
# classification, never at export time by pattern matching over rendered text),
# and this store does not and cannot re-derive it.
#
# What this file contributes is the negative space: short retention, no
# unbounded label cardinality, and an ingestion path that accepts OTLP from the
# collector — which has already applied the positive attribute allowlist — and
# from nothing else.

auth_enabled: false

server:
  http_listen_address: "::"
  http_listen_port: 3100
  grpc_listen_address: "::"
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # ADR-0015 §9's cardinality discipline, restated where it can be enforced.
  # A per-Session or per-Device label is forbidden by O-13; a low stream limit
  # makes an accidental high-cardinality label fail loudly at ingestion rather
  # than quietly become a per-user index.
  max_label_names_per_series: 20
  max_label_name_length: 128
  max_label_value_length: 256
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  reject_old_samples: true
  reject_old_samples_max_age: 24h
  # 72 hours, matching the Prometheus TSDB retention. Logs about a VPN are
  # metadata about a VPN; keeping less of it for less long is the control.
  retention_period: 72h
  allow_structured_metadata: true
  otlp_config:
    resource_attributes:
      attributes_config:
        # These become Loki stream labels. The list is short ON PURPOSE:
        # everything else arrives as structured metadata, which is searchable
        # but not indexed, so no attribute can become a per-entity index.
        - action: index_label
          attributes:
            - service.name
            - deployment.environment
            - twinvpn.component

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false

querier:
  max_concurrent: 4
