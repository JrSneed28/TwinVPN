# twinlab-scenarios — the NAT-class matrix and the named scenario family of testing-strategy.md §3
#
# Owner: test-engineering.
#
# INTEGRATION-LEAD ACTION APPLIED: see the note at the top of
# `lab/twinlab/Cargo.toml`. Every core crate this workspace names now lives in
# `lab/Cargo.toml`'s `[workspace.dependencies]`, and no member names one by path.
[package]
name    = "twinlab-scenarios"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description = "the NAT-class matrix and the named scenario family of testing-strategy.md §3"
publish = false

[dependencies]
twinvpn-types = { workspace = true }
thiserror     = { workspace = true }
tracing       = { workspace = true }
tracing-subscriber = { workspace = true }
twinlab = { workspace = true }
# The fabric. `twinlab` decides what a scenario means and what a verdict is;
# `twinnet` moves the packets. Keeping the two apart is what lets `twinlab` stay
# `#![forbid(unsafe_code)]` while the laboratory still has raw sockets.
twinnet = { workspace = true }
serde = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
