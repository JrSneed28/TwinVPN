# cargo-deny configuration — ADR-0018 §11.11.
#
# One configuration for all four workspaces, referenced by
# .github/workflows/supply-chain-t1.yml. DP-6: "Advisory, licence and
# duplicate-version checks run at T1."
#
# ===========================================================================
# WHAT THIS FILE CAN AND CANNOT DO
# ===========================================================================
# It mechanises DP-6's three automatable checks. It does NOT implement the
# dependency LEDGER, which records per direct dependency "why it is present,
# who reviewed the last bump, whether it reaches a shipped artifact or only dev
# tooling, whether it contains `unsafe`, and whether it has a published audit".
# Four of those five are human judgements. Generating a file that looked like
# the ledger would be worse than not having one, because it would satisfy the
# check without satisfying the requirement.
#
# It also does NOT enforce DP-3's crypto seam ("twinvpn-crypto is the ONLY
# crate permitted a cryptographic dependency"). That is a graph property over
# the workspace, and ADR-0018 CD-I2 assigns it to `cargo run -p xtask -- lint`,
# which is core-foundation's. Implementing a second, weaker version of it here
# would create two answers to one question - the R-31 divergence class.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ===========================================================================
# ADVISORIES — DP-6.
# ===========================================================================
[advisories]
version = 2
# `deny` on both. DP-9: "A malicious dependency or compromised pipeline defeats
# every invariant simultaneously." There is no severity threshold below which
# that stops being true, so there is no severity threshold here.
yanked = "deny"
ignore = [
  # Every entry here MUST carry: the advisory ID, why it does not apply, who
  # decided that, and when it is re-reviewed. An unexplained ignore is how an
  # advisory list becomes a list of advisories nobody reads.
  #
  # Format:
  #   { id = "RUSTSEC-YYYY-NNNN", reason = "why it does not apply | reviewer | re-review date" }

  # -----------------------------------------------------------------------
  # RUSTSEC-2025-0134 - rustls-pemfile is unmaintained.
  # -----------------------------------------------------------------------
  # WHAT IT IS. An `unmaintained` advisory, not a vulnerability: the repository
  # was archived in August 2025 and the advisory itself records "no safe upgrade
  # is available" because there is nothing to upgrade TO - the guidance is to
  # migrate to `rustls-pki-types`' `PemObject` trait, which is the same parsing
  # code rustls-pemfile 2.x already wraps.
  #
  # WHY IT DOES NOT APPLY TODAY. No CVE, no advertised memory-safety or parsing
  # defect. The code reached is the code in `rustls-pki-types` >= 1.9, which is
  # maintained, is already a direct dependency of `services/` at 1.15, and is
  # already in the graph independently. The exposure is one call site --
  # `services/twinvpn-service-common/src/tls/mod.rs::load_private_key` -- reading
  # a private-key PEM from a local operator-supplied path at process start. It
  # parses no attacker-controlled input, and it is not reachable from the shipped
  # client core at all: the crate appears only in the `services` and `tests`
  # workspaces.
  #
  # THIS IS A DEFERRAL, NOT A DISMISSAL. The fix is a one-line source change
  # (`PrivateKeyDer::from_pem_slice`) plus dropping the dependency, and it is
  # SERVICES-DOMAIN source, which the T1 gate's owner does not own. Ignoring it
  # here buys the time to make that change under review instead of making the
  # supply-chain gate the thing that blocks every unrelated merge.
  #
  # DECIDED BY: infrastructure lead, as the T1 supply-chain gate owner, 2026-08-29,
  # recorded here rather than in a commit message. Requires services-domain
  # sign-off on the migration; this entry does not grant it.
  # RE-REVIEW: 2026-11-29, or immediately if the advisory is ever re-classified
  # from `unmaintained` to a vulnerability - whichever comes first. If the
  # migration has landed by then this entry is DELETED, not renewed.
  { id = "RUSTSEC-2025-0134", reason = "unmaintained-only advisory, no CVE; the parsing code is rustls-pki-types >= 1.9 which is maintained and already a direct dependency; one call site, local operator-supplied key file, server artifacts only, never linked into the shipped core. Deferral pending a one-line migration to PrivateKeyDer::from_pem_slice, which is services-domain source. | infrastructure lead (T1 gate owner), 2026-08-29 | re-review 2026-11-29" },
]

# ===========================================================================
# LICENCES.
# ===========================================================================
# The workspace manifests declare Apache-2.0. ADR-0018 states no licence
# policy, so this list is an INFRASTRUCTURE-LEAD CHOICE, recorded as one:
# permissive licences compatible with Apache-2.0 redistribution, and nothing
# copyleft, because ADR-0021 ships the core statically linked into per-platform
# artifacts (§11.9 rows 1, 4, 5, 6, 7, 8, 9) and a copyleft dependency in a
# statically linked artifact is a distribution obligation nobody has agreed to.
#
# If the project wants a different policy that is a decision to record, not a
# line to edit here quietly.
[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
]
confidence-threshold = 0.93
exceptions = []

# ---------------------------------------------------------------------------
# CDLA-Permissive-2.0 IS DELIBERATELY ABSENT. Recorded because "we considered it
# and said no" is not visible in a list of things that are not there.
# ---------------------------------------------------------------------------
# It arrived on `webpki-root-certs`, reached only through
# `rustls-platform-verifier` <- `quinn-proto` <- `quinn`, and only in the
# `services` and `tests` workspaces, because `services/Cargo.toml` took quinn
# with its DEFAULT features while `core/Cargo.toml` had already turned them off.
# It is a data licence for the Mozilla CA root bundle, not a code licence.
#
# The dependency was REMOVED rather than the licence allowed: quinn's
# `platform-verifier` feature verifies a server certificate against the host OS
# trust store, which is a client concern, and nothing under `services/` or
# `tests/` references it. See the note beside `quinn` in `services/Cargo.toml`.
#
# Widening the allowlist would have been the worse trade even though the licence
# is genuinely permissive, because the entry would then sit here permanently to
# admit a dependency nobody wanted, and every later reader would have to
# re-derive why. If a future dependency needs CDLA-Permissive-2.0 for a reason
# that cannot be designed away, that is a new infrastructure-lead decision to
# record in this file with its own rationale - not a precedent set here.

# ===========================================================================
# BANS — duplicate versions, DP-6's third check.
# ===========================================================================
[bans]
# DP-1: "One committed lockfile for the whole workspace. NO UNBOUNDED VERSION
# RANGES." A duplicate version is the symptom of a diamond that DP-1 is meant
# to collapse, and on the router-class targets it is also a size problem: rows
# 8 and 9 gate at 4 MB STRIPPED against 16 MB of flash, so a duplicated
# dependency is a real fraction of the budget.
#
# `warn` rather than `deny`, deliberately: a duplicate is usually caused by a
# transitive dependency the workspace does not control, and denying it would
# make an unrelated upstream release block every merge. DP-6 asks for the
# CHECK; making it a hard gate is a stricter policy than the ADR states and
# would be this file inventing one.
multiple-versions = "warn"
wildcards = "deny"          # DP-1's "no unbounded version ranges", mechanised

# `allow-wildcard-paths` DOES NOT DO WHAT THIS FILE ONCE ASSUMED IT DID, and the
# setting is kept only because leaving it out would change nothing either.
#
# The old comment here read "path deps inside the workspace are not a range".
# That is the right intent and the wrong mechanism: cargo-deny applies this
# exemption only to crates it considers PRIVATE, and it says so in the error --
# "allow-wildcard-paths is enabled, but does not apply to public crates as
# crates.io disallows path dependencies". None of the twinvpn crates declare
# `publish = false`, so every one of them is `public` by cargo-deny's reckoning
# and the exemption never fired. That is why `wildcards = "deny"` was reporting
# ~250 violations across the five workspaces on internal path dependencies.
#
# The fix was NOT to relax `wildcards` to "warn". It was to write the bound on
# the edge: every internal `{ path = ... }` in every workspace manifest now also
# carries `version = "0.1.0"`. That is DP-1 satisfied literally rather than
# waived - the path still decides resolution, and the version is the requirement
# an auditor reads. `publish = false` would have silenced the check equally, but
# it silences rather than states, and DP-1 asks for a stated bound.
allow-wildcard-paths = true
highlight = "all"

deny = [
  # DP-8: AT MOST TWO CRYPTO PROVIDERS FLEET-WIDE. "Two implementations of the
  # same specified algorithm do not violate I2 - I2 forbids NOVEL cryptography,
  # not a second implementation - but they double the assurance surface."
  #
  # This list is empty because naming providers here would pre-empt ADR-0001
  # and ADR-0007, which already chose the primitives, and ADR-0018 DP-3 is
  # explicit that "this ADR does not choose the primitives". The COUNT
  # constraint is enforced by CD-I2 in core/xtask, which can see the graph.
]

skip = []
skip-tree = []

# ===========================================================================
# SOURCES — where crates may come from.
# ===========================================================================
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# DP-2: "MIRROR, DO NOT SOURCE-VENDOR." A git dependency is neither: it is an
# unpinned pointer into someone else's history. DP-7's ladder for "no build for
# this target" ends at `[patch]` with the patch IN-TREE, reviewed, carrying an
# upstream reference - not at a git URL.
allow-git = []
