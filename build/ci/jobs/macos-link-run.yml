# build/ci/jobs/macos-link-run.yml
#
# A JOB BODY, not a workflow. Paste it under a workflow's `jobs:` key at this
# indentation; it is kept as its own file so the Apple half of the platform
# lifecycle gate is reviewable by the domain that owns it (`desktop-macos`)
# rather than buried in a file three domains edit.
#
# ===========================================================================
# WHAT THIS JOB CLAIMS, AND WHAT IT EXPLICITLY DOES NOT
# ===========================================================================
# CLAIMS: the shared core compiles for both macOS arches, the real
# NetworkExtension SYSTEM extension links the real archive, the archive loads,
# Swift crosses `twinvpn_bridge.h` into TwinVPN core code, a typed result comes
# back, and lifecycle transitions execute.
#
# DOES NOT CLAIM: NetworkExtension activation, `pf` programming, or any part of
# the signed system-extension lifecycle. A GitHub-hosted runner has no Developer
# ID, no system-extension entitlement and no root, so `tvb_ext_start` refuses at
# ADR-0016 §11.6's `privilege_posture` step — and PS-18 says it MUST. The
# evidence this job writes carries `privileged: false` and says so in `notes`.
# `build/ci/jobs/macos-privileged-lifecycle.yml` is the ONLY place that claim
# lives.
#
# ===========================================================================
# THE XCODE PIN
# ===========================================================================
# The version is NOT written here. `build/ci/ci-macos.sh --print-xcode-path`
# resolves it, so the pin lives in exactly one place
# (`build/ci/ci-common-apple.sh`'s `TWINVPN_XCODE_VERSION`, currently **26.6**)
# and a workflow cannot drift from a script.
#
# Where the requirement comes from: ADR-0018 §11.3 requires "one exact toolchain
# version pinned … advanced only by a reviewed commit that re-runs the full
# §11.9 matrix", and §11.9 row 5 names the macOS toolchain as "Xcode + pinned
# Rust" — so Xcode itself is the thing pinned to one exact version on a Darwin
# builder, and the Swift compiler is whatever that Xcode ships.
#
# Xcode 26.6 ships Swift 6.3.3 (swift.org's own release index,
# `_data/builds/swift_releases.yml` in swiftlang/swift-org-website), and 26.6 is
# the DEFAULT Xcode of the `macos-26` runner image this job runs on. Both facts
# are cited with their URLs in `ci-common-apple.sh`'s header.
# `apple_require_pinned_swift` then ASSERTS the pair at run time, so a
# runner-image update that quietly moved Swift fails the job instead of changing
# the binary nobody reviewed.
#
# NOT `build/toolchain/env.sh`'s `TWINVPN_SWIFT_VERSION=6.1.2`. That pins the
# LINUX-hosted Swift that `make swift-parse` uses on a host with no Darwin SDK;
# it never compiles a shipped Apple artifact and does not have to equal the
# Xcode-bundled compiler. Reading it as the Darwin pin is what previously put
# Xcode 16.4 here — a version `macos-26` does not carry at all, so this very
# step failed with `xcode-select: error: invalid developer directory ''`.
#
# `shells/ios/README.md` separately documents a FLOOR ("Xcode 15+"). A floor is
# not a pin and this job uses the pin.
#
# The `maxim-lobanov/setup-xcode` step below is the FALLBACK for a runner image
# that does not ship the pinned Xcode side by side. It is commented out rather
# than deleted because turning it on is the correct response to
# `--print-xcode-path` failing, and a reviewer should not have to invent it.
#
# ===========================================================================
# WHAT IS UPLOADED, AND WHAT MUST NEVER BE
# ===========================================================================
# TWO uploads, and they are not the same claim — the same split
# `build/ci/jobs/android-link-run.yml` uses:
#
#   evidence-macos            `if: always()`,  if-no-files-found: **error**
#                             `macos.json` plus the two logs the
#                             `lifecycle_transitions` array is read out of. This
#                             is the acceptance gate's input, and a job that
#                             reached the end while writing no evidence must go
#                             red rather than be read as a green tick.
#
#   diagnostics-macos-link-run  `if: failure()`, if-no-files-found: **ignore**
#                             the whole log tree: xcodebuild logs with the
#                             linker diagnostics, the `.xcresult`, crash reports.
#                             `ignore`, because a job that died in its FIRST step
#                             has no diagnostics to upload and must not have a
#                             second, misleading red stacked on top of the real
#                             failure.
#
# Splitting them is what stops one failure becoming two: run 33283744937 died
# selecting Xcode, and the single combined `always()`+`error` upload then failed
# with "No files were found" — burying the actual cause.
#
# A green run therefore uploads the evidence and the transition logs and nothing
# else; `DerivedData` (which lives under `build/ci/logs/macos/`) is no longer
# swept into a passing run's artifact.
#
# NEVER uploaded: signing identities or private keys, pairing secrets,
# authentication tokens, tunnel plaintext, or unredacted packet captures. The
# paths below are enumerated rather than globbed from the repository root for
# exactly that reason — `path: .` would sweep up whatever a future step happens
# to leave behind. `~/Library/Keychains` and `~/Library/MobileDevice` are not
# named here and must not be added.

  macos-link-run:
    name: macos-link-run
    # PINNED. Not `macos-latest`: R-32's failure mode is "it does not build for
    # that target any more", arriving one silent runner-image update at a time.
    runs-on: macos-26
    # The whole job: two cargo builds for two arches with `ring` compiled from
    # C, an xcodegen run, two xcodebuild invocations. 90 minutes is the hard
    # fail, not a target. Rule C-1: a budget is raised by a reviewed change, not
    # silently.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The FALLBACK, if `--print-xcode-path` reports the pin is absent from the
      # image. Uncomment and keep the version in step with
      # `TWINVPN_XCODE_VERSION` in build/ci/ci-common-apple.sh.
      # - uses: maxim-lobanov/setup-xcode@v1
      #   with:
      #     xcode-version: '26.6'

      - name: select the pinned Xcode and print every toolchain version
        run: |
          # The pin lives in build/ci/ci-common-apple.sh and nowhere else.
          #
          # RESOLVED FIRST, into a variable. Inlining the command substitution
          # into `xcode-select -s "$(...)"` discards the resolver's exit status
          # and hands `xcode-select` an empty string, so the job died with
          # `invalid developer directory ''` instead of with the resolver's own
          # message naming the pin and every Xcode the runner does have.
          # `bash -e` fails the assignment when the resolver fails.
          XCODE_DEV_DIR="$(build/ci/ci-macos.sh --print-xcode-path)"
          sudo xcode-select -s "$XCODE_DEV_DIR"
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk macosx --show-sdk-path
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          sw_vers

      - name: install xcodegen
        # Both Apple shells keep an XcodeGen spec rather than a committed
        # .xcodeproj (shells/macos/project.yml's header says why). Without the
        # generator there is no project to build.
        run: brew install --quiet xcodegen

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: fwg-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}

      - name: make ci-macos
        run: make ci-macos

      - name: collect crash reports
        if: failure()
        # A crash inside the extension or the test host is the most informative
        # artifact this job can produce and it is deleted with the runner. It is
        # COPIED rather than uploaded from its home directory so the upload step
        # below cannot be pointed at ~/Library by accident.
        run: |
          mkdir -p build/ci/logs/macos/crashes
          cp -R ~/Library/Logs/DiagnosticReports/* build/ci/logs/macos/crashes/ 2>/dev/null \
            || echo "no crash reports"

      # The gate's input. `error` is deliberate and stays: a run that reached
      # the end without evidence must not be read as a pass.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-macos
          # ENUMERATED, never `path: .`. See the header for what must never be
          # uploaded from an Apple runner.
          path: |
            build/ci/evidence/macos.json
            build/ci/logs/macos/lifecycle-native.log
            build/ci/logs/macos/xctest.log
          if-no-files-found: error
          retention-days: 14

      # The diagnostics, on failure only, and `ignore` so a job that died before
      # producing any cannot stack a second red on the real failure.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-macos-link-run
          # ENUMERATED to the log tree this job writes. Never `path: .`, never
          # `~/Library/Keychains`, never `~/Library/MobileDevice`.
          path: |
            build/ci/logs/macos/**
          if-no-files-found: ignore
          retention-days: 14
