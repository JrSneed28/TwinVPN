# build/ci/jobs/macos-privileged-lifecycle.yml
#
# ===========================================================================
# SUPERSEDED. THIS JOB NO LONGER EXISTS.
# ===========================================================================
# The criterion it discharged -- MACOS-SYSEXT-LIFECYCLE and MACOS-PRODUCTION-SIGNATURE -- is now
# the `macos-sysext and macos-signature` job in
# `.github/workflows/first-implementation-wave-gate.yml`.
#
# WHAT CHANGED, AND WHY.
#
# This job needed a Mac mini on a desk.
# The First Implementation Wave gate must stay evidence-based, but local or
# user-owned physical hardware is no longer an acceptable dependency for it: a
# blocker that can only be closed by someone with a machine in a room is a
# purchasing decision wearing an engineering costume.
#
# The replacement is an AWS EC2 Mac self-hosted runner, whose SIP can be configured through an API without physical access. The ONE row also became TWO: developer-mode lifecycle and production signing are different claims, and while they shared an evidence file a green lifecycle read as a verified signature.
#
# It is also STRICTER, in three ways that matter:
#
#   * the evidence carries an `environment` attestation of facts the job
#     MEASURED about the machine, and `build/acceptance/report.py` checks those
#     keys BEFORE it reads any test result. A host that was never capable of the
#     claim cannot produce a green row however well its tests ran;
#   * where the criterion makes an egress claim, the verdict comes from
#     `lab/twinoracle` -- an EXTERNAL observer the device can only reach by
#     emitting a packet that left it -- fetched by the aggregator FROM THE
#     ORACLE, not from anything this job could upload;
#   * the job runs in the SAME workflow as the aggregator, so evidence can no
#     longer be imported from a different run.
#
# The script is `build/ci/ci-macos-sysext.sh and build/ci/ci-macos-signature.sh`.
#
# This file is kept as a pointer because several READMEs and source headers
# name it; it is not a job fragment any more and nothing reads it as one.
