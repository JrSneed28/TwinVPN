# rendezvous — the C4 ephemeral signaling / CALL service (ADR-0004, protocol.md §10)
#
# Owner: rendezvous-connectivity. The WORKSPACE manifest at services/Cargo.toml is owned by the
# integration lead and must not be edited from this domain.
[package]
name    = "twinvpn-rendezvous"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description = "the C4 ephemeral signaling / CALL service (ADR-0004, protocol.md §10)"
publish = false

[[bin]]
name = "twinvpn-rendezvous"
path = "src/main.rs"

[lib]
name = "twinvpn_rendezvous"
path = "src/lib.rs"

[dependencies]
twinvpn-schema = { workspace = true }
twinvpn-types  = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
twinvpn-service-common = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
prost = { workspace = true }

[dev-dependencies]
# The B3 parser is the most hostile surface in the system; `ownership.md` §6
# rules 9/10 make "never panics, never allocates unboundedly" a property rather
# than a set of examples, and a property needs a property test.
proptest = "1.11"
