# presence — the device-presence aggregator (architecture.md §2.13; ephemeral, never a gate)
#
# Owner: rendezvous-connectivity. The WORKSPACE manifest at services/Cargo.toml is owned by the
# integration lead and must not be edited from this domain.
#
# NOTE THE ABSENCE OF `sqlx`. `docker-compose.yml` requires TWINVPN_PRESENCE_DATABASE_URL and
# `infra/README.md` §5 lists this service's readiness as "Postgres reachable", but a presence
# record is EPHEMERAL by contract (presence.proto, protocol.md §6.1) and a durable presence log
# is "a permanent movement and IP-address history of the Owner". This service therefore has no
# database client at all: the durable option does not exist rather than defaulting off. The
# divergence is reported in README.md §8.
[package]
name    = "twinvpn-presence"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description = "the device-presence aggregator (architecture.md §2.13; ephemeral, never a gate)"
publish = false

[[bin]]
name = "twinvpn-presence"
path = "src/main.rs"

[lib]
name = "twinvpn_presence"
path = "src/lib.rs"

[dependencies]
twinvpn-schema = { workspace = true }
twinvpn-types  = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
twinvpn-service-common = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
prost = { workspace = true }

# TLS termination. The integration lead added these to the workspace manifest
# after this domain reported the unauthenticated-ATTACH hole; ADR-0018 CD-I2
# scopes the crypto-dependency rule to the /core crate set, and these are
# separate server artifacts that do not link the core (§11.2 rows 2.8/2.11).
rustls           = { workspace = true }
tokio-rustls     = { workspace = true }
rustls-pemfile   = { workspace = true }
rustls-pki-types = { workspace = true }

[dev-dependencies]
proptest = "1.11"

# Test-only key generation. `rustls` already links `aws-lc-rs` at RUNTIME as its
# default provider, so this adds no crate to the lockfile and no runtime
# cryptographic dependency to the service -- it is named here only so a test can
# mint an ephemeral P-256 keypair. The alternative was committing a private key
# to the repository or depending on `openssl` being on the host, and both are
# worse. Flagged to the integration lead in README.md section 8.
aws-lc-rs = "1.18"
