# presence — the device-presence aggregator (architecture.md §2.13; ephemeral, never a gate)
#
# Owner: rendezvous-connectivity. The WORKSPACE manifest at services/Cargo.toml is owned by the
# integration lead and must not be edited from this domain.
#
# NOTE THE ABSENCE OF `sqlx`. `docker-compose.yml` requires TWINVPN_PRESENCE_DATABASE_URL and
# `infra/README.md` §5 lists this service's readiness as "Postgres reachable", but a presence
# record is EPHEMERAL by contract (presence.proto, protocol.md §6.1) and a durable presence log
# is "a permanent movement and IP-address history of the Owner". This service therefore has no
# database client at all: the durable option does not exist rather than defaulting off. The
# divergence is reported in README.md §9.
[package]
name    = "twinvpn-presence"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description = "the device-presence aggregator (architecture.md §2.13; ephemeral, never a gate)"
publish = false

[[bin]]
name = "twinvpn-presence"
path = "src/main.rs"

[lib]
name = "twinvpn_presence"
path = "src/lib.rs"

[dependencies]
twinvpn-schema = { workspace = true }
twinvpn-types  = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
twinvpn-service-common = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
prost = { workspace = true }

# TLS termination and channel binding live in `twinvpn-service-common` now. This
# crate names only `tokio-rustls`, for the `TlsAcceptor` it holds and the stream
# type it serves over; `rustls`, the raw-public-key verifier, the PEM reader and
# the binding table are the shared crate's. Absorbed after this domain shipped
# them identically twice (RZ-8) — and absorbing them found a `release()` defect
# that neither copy's unit tests could see, because both released from a single
# synthetic channel rather than a long-lived connection.
tokio-rustls = { workspace = true }

[dev-dependencies]
proptest = "1.11"

# The shared TLS test kit: ephemeral RFC 7250 key material and the pinning,
# anonymous and TLS-1.2-only clients an authentication test needs. Absorbed from
# this domain's own `tests/common/keys.rs`, which both services carried.
twinvpn-service-common = { workspace = true, features = ["test-support"] }
