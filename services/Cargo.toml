# TwinVPN server-side artifacts.
#
# ============================================================================
# PLACEMENT IS AN INTEGRATION-LEAD DECISION, NOT A PHASE 1 ONE.
# ============================================================================
# ADR-0018 §11.12 fixes /core, /contracts, /shells, /build and /lab, and says of
# the server side only that "the relay server is a separate artifact sharing
# `twinvpn-schema` and the framing crate" (§11.2 row 2.11) and that the control
# plane's "server-side is a different artifact" (row 2.8). It names no path.
#
# /services is therefore chosen by the integration lead, consistent with the
# Phase 3 objective's ownership map and with scripts/check_freeze_scope.py,
# which already lists `services` among the production paths it guards. It is
# recorded here so a later reader does not mistake it for an ADR decision.
#
# These are a SEPARATE cargo workspace from /core deliberately: they are
# separate artifacts, they must not accidentally acquire a core crate as a
# workspace-implicit dependency, and each domain then owns its own manifests.
# The only permitted edge into /core is a path dependency on `twinvpn-schema`
# (and, for the relay, the framing crate) — ADR-0018 §11.2 rows 2.8/2.11.
#
# THIS MANIFEST IS OWNED BY THE INTEGRATION LEAD.
[workspace]
resolver = "2"
members = [
  "twinvpn-service-common",
  "control-plane",
  "rendezvous",
  "presence",
  "relay",
  "relay-directory",
  "relay-health",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.90"
license      = "Apache-2.0"
repository   = "https://github.com/twinvpn/twinvpn"

[workspace.dependencies]
twinvpn-service-common = { path = "twinvpn-service-common" }

# The permitted edges into /core. ADR-0018 §11.2: the server side is a different
# artifact that SHARES `twinvpn-schema` -- and, for the relay, the framing crate
# (row 2.11). It does not link the core.
twinvpn-schema = { path = "../core/crates/twinvpn-schema" }
twinvpn-types  = { path = "../core/crates/twinvpn-types" }

# Added by the integration lead, resolving relay-plane's finding F-1.
#
# The relay and the relay directory need signature verification, a frame MAC and
# a digest: RelayCapabilityToken verification, RelayMap signing, pair_tag
# derivation. `relay-plane` correctly refused to choose between violating CD-I2
# and editing a manifest it does not own, and took all three as injected traits
# with FAIL-CLOSED defaults instead.
#
# The resolution is this edge, NOT four primitive crates, and the reason is
# DP-8: "at most two crypto providers fleet-wide ... they double the assurance
# surface", and both must pass the identical golden-vector corpus. Adding
# ed25519-dalek/blake2/coset/ciborium here would create a SECOND provider whose
# agreement with the core's is untested -- the precise thing DP-8 bounds and
# CD-I2 exists to keep auditable. Depending on `twinvpn-crypto` is not itself a
# cryptographic dependency: it is the crate that encapsulates them, so the
# server artifacts inherit the audited implementation rather than a parallel one.
twinvpn-crypto = { path = "../core/crates/twinvpn-crypto" }

thiserror   = "2.0"
anyhow      = "1.0"
bytes       = "1.10"
prost       = "0.13"
prost-types = "0.13"
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
toml        = "0.9"

tokio       = { version = "1.48", features = ["full"] }
tokio-util  = "0.7"
futures     = "0.3"

axum        = "0.8"
hyper       = "1.11"
hyper-util  = "0.1"
tower       = "0.5"
tower-http  = { version = "0.6", features = ["trace", "timeout"] }
quinn       = "0.11"
rustls      = "0.23"

# TLS termination for the server artifacts.
#
# Added by the integration lead after `rendezvous-connectivity` reported the
# consequence of their absence plainly rather than as a footnote: with no
# channel authentication, ATTACH/BIND are unauthenticated CLAIMS, so an attacker
# could attach as another device's device_id and receive its CALLs, or publish
# presence for it. `rustls` alone is not enough to terminate a connection -- the
# tokio integration and a PEM reader are what actually close that hole.
#
# NOTE the difference from the core: ADR-0018 CD-I2 confines a cryptographic
# dependency to `twinvpn-crypto`, and finding W-12 rules that `rustls` therefore
# belongs there and `quinn` may sit in `twinvpn-cp-client`. CD-I2 is a rule over
# the /core workspace crate set; these are SEPARATE SERVER ARTIFACTS that do not
# link the core (ADR-0018 §11.2 rows 2.8 and 2.11), so they terminate their own
# transport. `cargo run -p xtask -- lint` scopes CD-I2 to /core accordingly.
tokio-rustls     = "0.26"
rustls-pemfile   = "2.2"
rustls-pki-types = "1.15"

tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.33"
opentelemetry      = "0.32"
opentelemetry_sdk  = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "uuid"] }

[profile.release]
lto           = "thin"
codegen-units = 1
panic         = "unwind"
